name: Native Changeset Check
on:
  pull_request:
    branches: [main]
    paths:
      - 'native/kotlin/**'
      - 'native/swift/**'

concurrency:
  group: changeset-check-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-kotlin:
    name: Require Kotlin changeset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      - name: Check for Kotlin changes
        id: kotlin-changes
        run: |
          CHANGES=$(git diff --name-only origin/main...HEAD -- \
            'native/kotlin/runtime/src/*Main/**' \
            'native/kotlin/codegen/src/main/**' \
            'native/kotlin/plugin/src/main/**' \
            'native/kotlin/gradle/libs.versions.toml')
          if [ -n "$CHANGES" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify Kotlin changeset exists
        if: steps.kotlin-changes.outputs.changed == 'true'
        working-directory: native/kotlin
        run: |
          npm ci
          npx changeset status --since=origin/main

  check-swift:
    name: Require Swift changeset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      - name: Check for Swift changes
        id: swift-changes
        run: |
          CHANGES=$(git diff --name-only origin/main...HEAD -- \
            'native/swift/Sources/**' \
            'native/swift/Package.swift')
          if [ -n "$CHANGES" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify Swift changeset exists
        if: steps.swift-changes.outputs.changed == 'true'
        working-directory: native/swift
        run: |
          npm ci
          npx changeset status --since=origin/main
