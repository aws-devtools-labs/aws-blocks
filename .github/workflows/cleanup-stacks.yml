name: Cleanup Stale E2E Stacks

on:
  schedule:
    - cron: '0 */2 * * *' # Every 2 hours
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# Never let two cleanup runs overlap (a slow drain + the next scheduled tick
# would double-trigger deletes and race on the same buckets). Let the in-flight
# run finish rather than cancelling it — cancellation is what made the old runs
# show up as "cancelled" and never complete.
concurrency:
  group: cleanup-stale-stacks
  cancel-in-progress: false

jobs:
  cleanup:
    name: Delete Stale Stacks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: publish
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Find and delete stale e2e stacks
        run: |
          CUTOFF=$(date -d '2 hours ago' +%s)
          # Wall-clock budget for the inline empty+trigger loop. Emptying large
          # versioned buckets is synchronous, so cap total work well under the
          # job's 60-min timeout and defer the rest to the next run — rather than
          # risk re-introducing the timeout this redesign removed.
          DEADLINE=$((SECONDS + 2400)) # 40 minutes
          TRIGGERED=0
          TRIGGER_FAILED=0
          SKIPPED_NOT_E2E=0
          SKIPPED_TOO_NEW=0

          # Empty every S3 bucket in a stack, including all object versions and
          # delete markers. Hosting/test buckets are versioned, so CloudFormation
          # can't remove them on teardown once the stack's autoDeleteObjects Lambda
          # is gone — which happens when the CREATE failed at the account IAM role
          # quota (the Lambda never provisioned) or on a partial rollback. The
          # bucket then blocks delete-stack, the stack sticks in DELETE_FAILED, and
          # its IAM roles leak — worsening the very quota that caused the failure.
          # Emptying out-of-band lets the subsequent delete-stack succeed.
          empty_stack_buckets() {
            local STACK="$1" B BUCKETS PAYLOAD
            # Use list-stack-resources (paginated), NOT describe-stack-resources —
            # the latter caps at 100 resources and on a large OpenNext SSR stack omits
            # the very HostingStorageHostingBucket that blocks the delete, so it never
            # gets emptied.
            BUCKETS=$(aws cloudformation list-stack-resources --stack-name "$STACK" \
              --query "StackResourceSummaries[?ResourceType=='AWS::S3::Bucket'].PhysicalResourceId" \
              --output text 2>/dev/null || echo "")
            for B in $BUCKETS; do
              [ -z "$B" ] && continue
              # Delete in pages of 1000 (the delete-objects limit) until empty.
              # The `|| echo ""` keeps the substitution total: under `set -eo pipefail`
              # a jq error on empty/null stdin (empty bucket) would otherwise abort the
              # whole step instead of falling through to the empty-guard below.
              while :; do
                PAYLOAD=$(aws s3api list-object-versions --bucket "$B" --max-items 1000 --output json 2>/dev/null \
                  | jq -c '{Objects: ((.Versions // []) + (.DeleteMarkers // []) | map({Key, VersionId}))}' 2>/dev/null || echo "")
                [ -z "$PAYLOAD" ] && break
                [ "$(echo "$PAYLOAD" | jq '.Objects | length' 2>/dev/null || echo 0)" = "0" ] && break
                # delete-objects exits 0 even when individual keys fail (legal hold,
                # retention lock, or keys the role can't delete) and reports them in
                # `.Errors`. We re-list from the start each pass, so an object that
                # never disappears would loop forever until the job timeout — break on
                # any reported Errors (no forward progress), not just a non-zero exit.
                RESP=$(aws s3api delete-objects --bucket "$B" --delete "$PAYLOAD" --output json 2>/dev/null) || break
                if echo "$RESP" | jq -e '(.Errors // []) | length > 0' >/dev/null 2>&1; then
                  echo "⚠️  undeletable objects in $B (legal hold / retention / access denied); skipping"
                  break
                fi
              done
            done
          }

          # Get all e2e stacks in deletable states across all name patterns
          STACKS=""
          for PREFIX in blocks-test- blocks-hosting- bb-test- bb-telemetry- bb-vpc-smoke-; do
            BATCH=$(aws cloudformation list-stacks \
              --stack-status-filter CREATE_COMPLETE UPDATE_COMPLETE ROLLBACK_COMPLETE DELETE_FAILED UPDATE_ROLLBACK_COMPLETE REVIEW_IN_PROGRESS \
              --query "StackSummaries[?starts_with(StackName, '${PREFIX}')].StackName" \
              --output text)
            STACKS="$STACKS $BATCH"
          done

          for STACK in $STACKS; do
            # Stop if we've spent the time budget; remaining stacks are picked up
            # on the next scheduled run.
            if [ "$SECONDS" -ge "$DEADLINE" ]; then
              echo "⏱️  Time budget reached; deferring remaining stacks to the next run"
              break
            fi

            # Verify this is an e2e-test stack. The blocks:purpose tag is either
            # `e2e-*` (hosting/bb-test: e2e-hosting-ssr, e2e-native-bindings, …) or
            # `*-e2e` (telemetry-e2e, vpc-smoke-e2e) — accept both shapes.
            PURPOSE=$(aws cloudformation describe-stacks --stack-name "$STACK" \
              --query "Stacks[0].Tags[?Key=='blocks:purpose'].Value | [0]" --output text 2>/dev/null || echo "")

            case "$PURPOSE" in
              e2e-* | *-e2e) ;;
              *)
                echo "⏭️  Skipping $STACK (blocks:purpose='$PURPOSE' is not an e2e marker)"
                SKIPPED_NOT_E2E=$((SKIPPED_NOT_E2E + 1))
                continue
                ;;
            esac

            # Use CloudFormation's CreationTime for precise age check (ISO 8601)
            CREATION_TIME=$(aws cloudformation describe-stacks --stack-name "$STACK" \
              --query "Stacks[0].CreationTime" --output text 2>/dev/null || echo "")

            if [ -z "$CREATION_TIME" ] || [ "$CREATION_TIME" = "None" ]; then
              echo "⚠️  $STACK has no creation time, deleting as orphan"
            else
              CREATED_TS=$(date -d "$CREATION_TIME" +%s 2>/dev/null || echo "0")
              if [ "$CREATED_TS" -gt "$CUTOFF" ]; then
                echo "⏭️  Skipping $STACK (created $CREATION_TIME, less than 2 hours old)"
                SKIPPED_TOO_NEW=$((SKIPPED_TOO_NEW + 1))
                continue
              fi
            fi

            # Empty the versioned buckets (see empty_stack_buckets above for why),
            # then trigger the delete WITHOUT waiting. Fire-and-forget lets
            # CloudFormation delete asynchronously — CloudFront-backed hosting stacks
            # take 15-20 min each, and waiting serially is what blew past the 60-min
            # timeout; anything that doesn't finish is retried on the next run.
            # Count only deletes we actually triggered, so the summary is a trigger
            # count, not an attempt count.
            echo "🧹 Emptying buckets for $STACK"
            empty_stack_buckets "$STACK"
            if aws cloudformation delete-stack --stack-name "$STACK"; then
              echo "🗑️  Delete triggered: $STACK (created $CREATION_TIME)"
              TRIGGERED=$((TRIGGERED + 1))
            else
              echo "⚠️  delete-stack call failed for $STACK (will retry next run)"
              TRIGGER_FAILED=$((TRIGGER_FAILED + 1))
            fi
          done

          # Early-warning: stacks still stuck in DELETE_FAILED (failed on a prior run
          # and not cleared this run). Best-effort — surfaced as a warning so the
          # silent backlog growth that exhausted the quota can't recur unnoticed,
          # without hard-failing this best-effort cleanup job.
          STILL_FAILED=0
          for PREFIX in blocks-test- blocks-hosting- bb-test- bb-telemetry- bb-vpc-smoke-; do
            CNT=$(aws cloudformation list-stacks \
              --stack-status-filter DELETE_FAILED \
              --query "length(StackSummaries[?starts_with(StackName, '${PREFIX}')])" \
              --output text 2>/dev/null || echo 0)
            STILL_FAILED=$((STILL_FAILED + CNT))
          done

          echo ""
          echo "## Stack Cleanup Summary" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "- Delete triggered: $TRIGGERED" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "- Delete-stack call failed: $TRIGGER_FAILED" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "- Skipped (not e2e): $SKIPPED_NOT_E2E" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "- Skipped (< 2h old): $SKIPPED_TOO_NEW" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "- Still DELETE_FAILED: $STILL_FAILED" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "_Deletes run asynchronously; stacks that don't finish are retried on the next scheduled run._" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$STILL_FAILED" -gt 0 ]; then
            echo "::warning::$STILL_FAILED e2e stack(s) still in DELETE_FAILED after cleanup"
          fi

      - name: Find and delete stale Amplify sandbox stacks
        if: always()
        run: |
          # Amplify Gen2 e2e/interop sandboxes are named amplify-amplifygen2-* and
          # amplify-amplifyinteroptest-* and tagged amplify:deployment-type=sandbox.
          # They are NOT covered by the prefix/tag rules above, so they accumulate
          # (each holds an AppSync GraphQL API and exhausts the per-region quota).
          CUTOFF=$(date -d '2 hours ago' +%s)
          TRIGGERED=0
          TRIGGER_FAILED=0

          # Root sandbox stacks only: end in "-sandbox-<hex>" (skip nested -blocksCD/-data/-auth/-amplifyData stacks).
          # The middle identifier segment is matched loosely ([a-z0-9]+) so a future change to
          # Amplify's sandbox naming doesn't silently exclude stacks; the deployment-type tag
          # check below is the real safety gate before any delete.
          STACKS=$(aws cloudformation list-stacks \
            --stack-status-filter CREATE_COMPLETE UPDATE_COMPLETE ROLLBACK_COMPLETE DELETE_FAILED UPDATE_ROLLBACK_COMPLETE REVIEW_IN_PROGRESS \
            --query "StackSummaries[?starts_with(StackName, 'amplify-amplifygen2-') || starts_with(StackName, 'amplify-amplifyinteroptest-')].StackName" \
            --output text | tr '\t' '\n' | grep -E '^amplify-(amplifygen2|amplifyinteroptest)-[a-z0-9]+-sandbox-[0-9a-f]+$' || true)

          for STACK in $STACKS; do
            # Single describe-stacks call returns deployment-type tag, status, and creation time
            # as a tab-separated tuple to minimize API calls (and throttling) when draining a backlog.
            INFO=$(aws cloudformation describe-stacks --stack-name "$STACK" \
              --query "Stacks[0].[Tags[?Key=='amplify:deployment-type'].Value | [0], StackStatus, CreationTime]" \
              --output text 2>/dev/null || echo "")
            DEPLOY_TYPE=$(echo "$INFO" | cut -f1)
            STATUS=$(echo "$INFO" | cut -f2)
            CREATION_TIME=$(echo "$INFO" | cut -f3)
            [ -z "$STATUS" ] && STATUS="GONE"

            # Confirm it is an Amplify-managed sandbox via tags before any destructive action.
            if [ "$DEPLOY_TYPE" != "sandbox" ]; then
              echo "⏭️  Skipping $STACK (not amplify:deployment-type=sandbox)"
              continue
            fi

            if [ -n "$CREATION_TIME" ] && [ "$CREATION_TIME" != "None" ]; then
              CREATED_TS=$(date -d "$CREATION_TIME" +%s 2>/dev/null || echo "0")
              # DELETE_FAILED stacks are always stale (already torn down once); delete regardless of age.
              if [ "$STATUS" != "DELETE_FAILED" ] && [ "$CREATED_TS" -gt "$CUTOFF" ]; then
                echo "⏭️  Skipping $STACK (created $CREATION_TIME, less than 2 hours old)"
                continue
              fi
            fi

            # Fire-and-forget (no wait) so the job can't time out draining a backlog;
            # CloudFormation deletes asynchronously and anything that doesn't finish is
            # retried on the next scheduled run. We intentionally do NOT retry with
            # --retain-resources: at the root level the only stuck child is the nested
            # data stack, which *contains* the AppSync GraphQLApi we are trying to
            # reclaim — retaining it would orphan that API (and the managed DynamoDB
            # table), leaking the very quota this job exists to free. A persistent
            # failure here is usually the Amplify managed DynamoDB table (its
            # table-manager Lambda role lacks dynamodb:DescribeTable) — a real upstream bug.
            if aws cloudformation delete-stack --stack-name "$STACK"; then
              echo "🗑️  Delete triggered: $STACK (status $STATUS, created $CREATION_TIME)"
              TRIGGERED=$((TRIGGERED + 1))
            else
              echo "⚠️  delete-stack call failed for $STACK (will retry next run)"
              TRIGGER_FAILED=$((TRIGGER_FAILED + 1))
            fi
          done

          # Early-warning tally (see the e2e step) — Amplify sandboxes still stuck in
          # DELETE_FAILED (commonly the managed DynamoDB table) surfaced as a warning
          # so the backlog can't grow silently and exhaust the AppSync API quota.
          STILL_FAILED=$(aws cloudformation list-stacks \
            --stack-status-filter DELETE_FAILED \
            --query "length(StackSummaries[?starts_with(StackName, 'amplify-amplifygen2-') || starts_with(StackName, 'amplify-amplifyinteroptest-')])" \
            --output text 2>/dev/null || echo 0)

          echo ""
          echo "## Amplify Sandbox Cleanup Summary" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "- Delete triggered: $TRIGGERED" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "- Delete-stack call failed: $TRIGGER_FAILED" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "- Still DELETE_FAILED: $STILL_FAILED" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "_Deletes run asynchronously; stacks that don't finish (commonly the Amplify managed DynamoDB table) are retried on the next scheduled run._" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$STILL_FAILED" -gt 0 ]; then
            echo "::warning::$STILL_FAILED Amplify sandbox stack(s) still in DELETE_FAILED after cleanup; AppSync API quota may be at risk"
          fi

      - name: Cleanup orphaned CloudFront Response Headers Policies
        if: always()
        run: |
          echo "🔍 Checking for orphaned CloudFront Response Headers Policies..."
          POLICIES=$(aws cloudfront list-response-headers-policies \
            --type custom \
            --query "ResponseHeadersPolicyList.Items[*].[ResponseHeadersPolicy.Id,ResponseHeadersPolicy.ResponseHeadersPolicyConfig.Name]" \
            --output text 2>/dev/null || echo "")

          if [ -z "$POLICIES" ]; then
            echo "✅ No custom Response Headers Policies found"
            exit 0
          fi

          DELETED=0
          SKIPPED=0
          while read -r ID NAME; do
            if [ -z "$ID" ]; then continue; fi
            ETAG=$(aws cloudfront get-response-headers-policy --id "$ID" --query 'ETag' --output text 2>/dev/null)
            if [ -n "$ETAG" ]; then
              if aws cloudfront delete-response-headers-policy --id "$ID" --if-match "$ETAG" 2>/dev/null; then
                echo "🗑️ Deleted orphaned policy: $NAME ($ID)"
                DELETED=$((DELETED+1))
              else
                echo "  ⏭️ Skipped $NAME (in use by a distribution)"
                SKIPPED=$((SKIPPED+1))
              fi
            fi
          done <<< "$POLICIES"
          echo "✅ Cleanup complete. Deleted $DELETED orphaned policies, skipped $SKIPPED in-use policies."
