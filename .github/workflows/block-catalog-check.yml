name: Block Catalog Check

# Fails the PR if the generated Building Block catalog table in
# packages/blocks/README.md is out of date. The script only reads the committed
# package READMEs + root README (Node builtins, zero deps), so no `npm ci` needed.
# On failure its stderr tells the engineer to run `npm run sync-docs` and commit.

on:
  pull_request:
    branches: [main]

concurrency:
  group: block-catalog-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Catalog in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
      - name: Test Building Block catalog helpers
        run: node --test scripts/sync-catalog.test.mjs
      # The dashboard's generated block catalog reads its descriptions through
      # the same extractor, so its helpers belong to this gate rather than to the
      # admin-ui suite (which cannot reach a repo-root .mjs script).
      - name: Test generated block catalog helpers
        run: node --test scripts/generate-block-catalog.test.mjs
      - name: Verify Building Block catalog is in sync
        run: node scripts/sync-catalog.mjs --check
