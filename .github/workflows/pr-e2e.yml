name: PR E2E

# E2E Sandbox, E2E VPC Smoke, E2E Production, E2E Supabase and Telemetry
# E2E, and the E2E Teardown Verify for their stacks. Split out of
# pr-checks.yml so a failed job here can be re-run as soon as this run
# finishes, without waiting for the other E2E workflows. pr-checks.yml has the
# notes on the trigger, the checkout and the concurrency group.

on:
  pull_request:
    branches: ['*']

concurrency:
  group: pr-e2e-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Jobs that assume an AWS role grant themselves id-token: write.
permissions:
  contents: read

env:
  # Use the 'spec' reporter for node:test — produces a clean, hierarchical
  # pass/fail summary instead of verbose TAP output with per-test YAML blocks.
  NODE_OPTIONS: '--test-reporter=spec'

jobs:
  # Picks the E2E jobs to run. By default that is every E2E job when the PR
  # changes packages/ or test-apps/, and none otherwise. An E2E trailer on the
  # PR's head commit overrides it, so a PR that only changes CI (this workflow,
  # .github/actions/) or one E2E suite can run just the jobs it affects:
  #
  #   git commit --trailer 'E2E: all'               every E2E job
  #   git commit --trailer 'E2E: sandbox, hosting'  only these (job ids without the e2e- prefix)
  #
  # Only the head commit counts: a later commit without the trailer goes back
  # to the default. Each PR uses a fixed E2E account from the pool (PR number
  # mod the pool size, see .github/actions/e2e-slot), so parallel PRs spread
  # across it. The E2E Hosting legs spread one run over the pool too, each at
  # a fixed offset from the PR's account (see e2e-hosting).
  #
  # A job the changes call for is never skipped: if the trailer leaves it out,
  # or names an unknown job, it fails in its first step instead. E2E Sandbox
  # and E2E Production are required checks, and GitHub counts a skipped job as
  # passing, so a skip would let the trailer merge a PR past E2E. Push a
  # commit without the trailer before merging. For the same reason those two
  # also start when this job fails or is cancelled, and fail in their first step.
  #
  # E2E VPC Smoke is left out while test-apps/vpc-smoke's tests are switched
  # off (its test:e2e:sandbox script only echoes), since it would test nothing.
  #
  # The logic lives in scripts/ci/e2e-selection.sh, tested by
  # scripts/ci/e2e-selection.test.mjs (in Local Build and Checks).
  # scripts/ci/required-checks.test.mjs checks that no required check passes
  # when a job it depends on fails or is cancelled.
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      # E2E account for this PR (see .github/actions/e2e-slot).
      e2e-index: ${{ steps.e2e-slot.outputs.index }}
      # JSON array of the E2E jobs to run, e.g. ["sandbox","hosting"]
      e2e: ${{ steps.check.outputs.e2e }}
      # JSON array of the E2E jobs the changes call for but the trailer left
      # out. Each fails in its first step.
      e2e-blocked: ${{ steps.check.outputs.blocked }}
      # e2e + e2e-blocked: the E2E jobs that start. Each E2E job's `if:` checks
      # this one, so a blocked job can't be skipped by checking only `e2e`.
      e2e-run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The head commit, not the merge commit: its E2E trailer counts.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - id: e2e-slot
        uses: ./.github/actions/e2e-slot
      - id: check
        env:
          E2E_ACCOUNT: ${{ steps.e2e-slot.outputs.account }}
        run: scripts/ci/e2e-selection.sh origin/main

  e2e-sandbox:
    permissions:
      contents: read
      id-token: write  # assumes the AWS role below
    name: E2E Sandbox
    # No build-and-test-local edge on purpose, here and in the other AWS E2E jobs
    # below: they run their own npm ci and build and use none of its outputs, so
    # they start as soon as detect-changes finishes.
    # "Build, Unit Tests, E2E Local" is a required check itself, so a red unit
    # job still blocks merge. Trade-off: AWS deploys also run when unit tests
    # fail. The Templates jobs keep the edge because they download its
    # dist-registry artifact.
    needs: [detect-changes]
    # Required check: see "Check that Detect Changes succeeded" below. Only
    # that branch uses always(); the run branch keeps success() so a cancelled
    # run (a new push) still cancels the deploy.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      ((always() && needs.detect-changes.result != 'success') ||
       (success() && contains(fromJSON(needs.detect-changes.outputs.e2e-run), 'sandbox')))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: e2e
    # The stacks the teardown is deleting, for E2E Teardown Verify.
    outputs:
      teardown-stacks: ${{ steps.teardown.outputs.stacks }}
    # No BLOCKS_SANDBOX_KEEP here, unlike E2E Production: this is the required
    # job that runs the product's destroySandbox() (the suite's test.after) and
    # fails when it fails, so it waits for that delete.
    env:
      BLOCKS_STACK_SUFFIX: pr-${{ github.event.pull_request.number || github.run_id }}-${{ github.run_attempt }}
      E2E_FROM_EMAIL: ${{ secrets.E2E_FROM_EMAIL }}
    steps:
      # A failed or cancelled Detect Changes would otherwise skip this job, and
      # a skipped required check counts as passing. always() starts the job and
      # this step anyway, also in a cancelled run, and the step fails the job
      # before anything else runs.
      - name: Check that Detect Changes succeeded
        if: always() && needs.detect-changes.result != 'success'
        env:
          RESULT: ${{ needs.detect-changes.result }}
        run: |
          echo "::error::Detect Changes ended $RESULT, so this run can't tell which E2E jobs this PR needs. Re-run the failed jobs."
          exit 1

      - name: Check the E2E trailer
        if: contains(fromJSON(needs.detect-changes.outputs.e2e-blocked), 'sandbox')
        run: |
          echo "::error::The head commit's E2E trailer leaves out this job, but this PR's changes call for it. Push a commit without the trailer before merging."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      # Pin a fixed Blocks CLI telemetry installation ID for CI e2e runs so this
      # traffic is consistent and identifiable (and can be excluded from product
      # usage metrics).
      - uses: ./.github/actions/seed-telemetry-id

      - run: npm ci
      # build:e2e leaves out the scaffolders and the admin UI, which no deploy
      # uses. The AWS E2E jobs below build the same way, except Telemetry E2E,
      # which runs the scaffolder.
      - run: npm run build:e2e

      - name: Configure AWS credentials
        uses: ./.github/actions/e2e-aws-credentials
        with:
          role-arns: ${{ secrets.AWS_ROLE_ARNS }}
          index: ${{ needs.detect-changes.outputs.e2e-index }}

      - name: Generate the test-support secret
        # This run's test-support secret: random per run, masked in the logs, never
        # stored. The deploy registers it as config for the e2e build's gated
        # test-only methods, and the tests send it, so nothing reads it from AWS.
        run: |
          secret="$(openssl rand -hex 32)"
          echo "::add-mask::$secret"
          echo "BLOCKS_TEST_SUPPORT_SECRET=$secret" >> "$GITHUB_ENV"

      - name: E2E Test Sandbox
        run: npm run test:e2e:sandbox

      # The suite destroys its stack in test.after, which never runs when this
      # job is cancelled (a new push cancels the run), times out or crashes.
      # Delete what this checkout deployed: skipped when nothing was synthesized,
      # one ListStacks call when the suite cleaned up. A stack the suite's
      # destroy left after the tests passed fails the job (E2E_TEARDOWN_STRICT
      # below). It waits only until the delete has started; E2E Teardown Verify
      # waits for the rest. Fresh credentials, since the first session can
      # expire before a long or timed-out job gets here. GitHub force-stops a
      # cancelled job 5 minutes after the cancel, so the two steps get 3 minutes
      # together.
      - name: Configure AWS credentials for teardown
        if: always() && hashFiles('test-apps/comprehensive/.cdk-blocks-sandbox/sandbox-id.txt') != ''
        timeout-minutes: 1
        uses: ./.github/actions/e2e-aws-credentials
        with:
          role-arns: ${{ secrets.AWS_ROLE_ARNS }}
          index: ${{ needs.detect-changes.outputs.e2e-index }}

      - name: Tear down leftover stacks
        id: teardown
        if: always() && hashFiles('test-apps/comprehensive/.cdk-blocks-sandbox/sandbox-id.txt') != ''
        timeout-minutes: 2
        env:
          JOB_STATUS: ${{ job.status }}
          # The suite's destroy is the product's destroySandbox(): a stack it
          # left after the tests passed fails this job.
          E2E_TEARDOWN_STRICT: '1'
        run: node scripts/ci/e2e-teardown.mjs test-apps/comprehensive

  e2e-sandbox-vpc:
    permissions:
      contents: read
      id-token: write  # assumes the AWS role below
    name: E2E VPC Smoke
    # No build-and-test-local edge on purpose, see e2e-sandbox.
    needs: [detect-changes]
    if: contains(fromJSON(needs.detect-changes.outputs.e2e-run), 'sandbox-vpc') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: e2e
    # detect-changes doesn't start this job while test-apps/vpc-smoke's
    # test:e2e:sandbox script only echoes; it starts again by itself once the
    # script runs the tests. Switching them on (or removing the suite) is
    # tracked in https://github.com/aws-devtools-labs/aws-blocks/issues/987.
    # Before that, this job must share one concurrency group with every other
    # job that deploys BlocksTestVpc: e2e-selection.test.mjs fails once the
    # tests are on and the groups differ.
    #
    # Serialize across PRs: the smoke app provisions private-DNS interface
    # endpoints into the shared persistent test VPC, and AWS permits only one
    # per service per VPC. Without this, two open PRs collide on the endpoints
    # (and the shared stack) and CloudFormation fails the second run. Queue
    # rather than cancel so an in-flight deploy/destroy isn't interrupted.
    concurrency:
      group: blocks-test-vpc-${{ needs.detect-changes.outputs.e2e-index }}
      cancel-in-progress: false
    env:
      BLOCKS_STACK_SUFFIX: vpc-${{ github.event.pull_request.number || github.run_id }}-${{ github.run_attempt }}
      E2E_FROM_EMAIL: ${{ secrets.E2E_FROM_EMAIL }}
    steps:
      - name: Check the E2E trailer
        if: contains(fromJSON(needs.detect-changes.outputs.e2e-blocked), 'sandbox-vpc')
        run: |
          echo "::error::The head commit's E2E trailer leaves out this job, but this PR's changes call for it. Push a commit without the trailer before merging."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      # Pin a fixed Blocks CLI telemetry installation ID for CI e2e runs so this
      # traffic is consistent and identifiable (and can be excluded from product
      # usage metrics).
      - uses: ./.github/actions/seed-telemetry-id

      - run: npm ci
      - run: npm run build:e2e

      - name: Configure AWS credentials
        uses: ./.github/actions/e2e-aws-credentials
        with:
          role-arns: ${{ secrets.AWS_ROLE_ARNS }}
          index: ${{ needs.detect-changes.outputs.e2e-index }}

      - name: Ensure persistent test VPC
        run: cd test-infra && npx cdk deploy BlocksTestVpc --require-approval never --outputs-file outputs.json

      - name: Export VPC ID
        run: |
          VPC_ID=$(cat test-infra/outputs.json | python3 -c "import sys,json; print(json.loads(sys.stdin.read())['BlocksTestVpc']['VpcId'])")
          echo "VPC_TEST_VPC_ID=$VPC_ID" >> "$GITHUB_ENV"

      - name: E2E VPC Smoke
        run: npm run test:e2e:sandbox:vpc

  e2e-production:
    permissions:
      contents: read
      id-token: write  # assumes the AWS role below
    name: E2E Production
    # No build-and-test-local edge on purpose, see e2e-sandbox.
    needs: [detect-changes]
    # Required check: see "Check that Detect Changes succeeded" below. Only
    # that branch uses always(); the run branch keeps success() so a cancelled
    # run (a new push) still cancels the deploy.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      ((always() && needs.detect-changes.result != 'success') ||
       (success() && contains(fromJSON(needs.detect-changes.outputs.e2e-run), 'production')))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: e2e
    # The stacks the teardown is deleting, for E2E Teardown Verify.
    outputs:
      teardown-stacks: ${{ steps.teardown.outputs.stacks }}
    env:
      BLOCKS_STACK_SUFFIX: pr-${{ github.event.pull_request.number || github.run_id }}-${{ github.run_attempt }}
      # The suite keeps its stack instead of waiting for its delete; the
      # always() teardown at the end deletes it (see there). This also turns
      # off the suite's run of the product destroy() (test/production-destroy.ts
      # in test.after), not just the local-dev stack reuse it is named for: E2E
      # Sandbox keeps running destroySandbox() in-job, and Telemetry E2E runs
      # destroy() against a real stack.
      BLOCKS_SANDBOX_KEEP: '1'
      E2E_FROM_EMAIL: ${{ secrets.E2E_FROM_EMAIL }}
    steps:
      # A failed or cancelled Detect Changes would otherwise skip this job, and
      # a skipped required check counts as passing. always() starts the job and
      # this step anyway, also in a cancelled run, and the step fails the job
      # before anything else runs.
      - name: Check that Detect Changes succeeded
        if: always() && needs.detect-changes.result != 'success'
        env:
          RESULT: ${{ needs.detect-changes.result }}
        run: |
          echo "::error::Detect Changes ended $RESULT, so this run can't tell which E2E jobs this PR needs. Re-run the failed jobs."
          exit 1

      - name: Check the E2E trailer
        if: contains(fromJSON(needs.detect-changes.outputs.e2e-blocked), 'production')
        run: |
          echo "::error::The head commit's E2E trailer leaves out this job, but this PR's changes call for it. Push a commit without the trailer before merging."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      # Pin a fixed Blocks CLI telemetry installation ID for CI e2e runs so this
      # traffic is consistent and identifiable (and can be excluded from product
      # usage metrics).
      - uses: ./.github/actions/seed-telemetry-id

      - run: npm ci
      - run: npm run build:e2e

      - name: Configure AWS credentials
        uses: ./.github/actions/e2e-aws-credentials
        with:
          role-arns: ${{ secrets.AWS_ROLE_ARNS }}
          index: ${{ needs.detect-changes.outputs.e2e-index }}

      - name: Generate the test-support secret
        # This run's test-support secret: random per run, masked in the logs, never
        # stored. The deploy registers it as config for the e2e build's gated
        # test-only methods, and the tests send it, so nothing reads it from AWS.
        run: |
          secret="$(openssl rand -hex 32)"
          echo "::add-mask::$secret"
          echo "BLOCKS_TEST_SUPPORT_SECRET=$secret" >> "$GITHUB_ENV"

      - name: E2E Test Production
        run: npm run test:e2e:production

      # Delete what this checkout deployed. The suite keeps its stack
      # (BLOCKS_SANDBOX_KEEP above), and this also runs when the job is
      # cancelled (a new push cancels the run), times out or crashes. It waits
      # only until the delete has started: E2E Teardown Verify waits for the
      # rest (~12 minutes, most of it the RDS instance) outside this required
      # check. Skipped when nothing was synthesized. Fresh credentials, since
      # the first session can expire before a long or timed-out job gets here.
      # GitHub force-stops a cancelled job 5 minutes after the cancel, so the two
      # steps get 3 minutes together.
      - name: Configure AWS credentials for teardown
        if: always() && hashFiles('test-apps/comprehensive/.cdk-blocks-sandbox/sandbox-id.txt') != ''
        timeout-minutes: 1
        uses: ./.github/actions/e2e-aws-credentials
        with:
          role-arns: ${{ secrets.AWS_ROLE_ARNS }}
          index: ${{ needs.detect-changes.outputs.e2e-index }}

      - name: Tear down leftover stacks
        id: teardown
        if: always() && hashFiles('test-apps/comprehensive/.cdk-blocks-sandbox/sandbox-id.txt') != ''
        timeout-minutes: 2
        env:
          JOB_STATUS: ${{ job.status }}
        run: node scripts/ci/e2e-teardown.mjs test-apps/comprehensive

  e2e-supabase:
    permissions:
      contents: read
      id-token: write  # assumes the AWS role below
    name: E2E Supabase
    # No build-and-test-local edge on purpose, see e2e-sandbox.
    needs: [detect-changes]
    if: contains(fromJSON(needs.detect-changes.outputs.e2e-run), 'supabase') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: e2e
    env:
      # Pin the Supabase Root 2021 CA (public cert, committed) so every external-DB
      # connection in this suite runs verify-full — exercising the TLS verification
      # feature end-to-end instead of connecting unverified. externalDbSsl() reads
      # this; the explicit-engine tests read it too.
      DATABASE_CA_CERT: ${{ github.workspace }}/packages/bb-database/test/fixtures/supabase-ca.crt
    # One Supabase project serves every E2E account, so this group stays global.
    concurrency:
      group: e2e-supabase
      cancel-in-progress: false
    steps:
      - name: Check the E2E trailer
        if: contains(fromJSON(needs.detect-changes.outputs.e2e-blocked), 'supabase')
        run: |
          echo "::error::The head commit's E2E trailer leaves out this job, but this PR's changes call for it. Push a commit without the trailer before merging."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      # Pin a fixed Blocks CLI telemetry installation ID for CI e2e runs so this
      # traffic is consistent and identifiable (and can be excluded from product
      # usage metrics).
      - uses: ./.github/actions/seed-telemetry-id

      - run: npm ci
      - run: npm run build:e2e

      - name: Install pg_dump 18 (for the run-all baseline E2E)
        # The runner's default pg_dump may be older than the Supabase server, and
        # pg_dump's major must be >= the server's. Install the PGDG client so the
        # run-all baseline E2E (migrations-e2e) generates a real baseline instead of
        # skipping. Applying migrations needs no pg_dump — only generating one does.
        # Best-effort (continue-on-error): if the install ever fails, the gated E2E
        # just skips — it must not take down the crud/auth Supabase suites. Uses the
        # armored key via apt `signed-by` directly (no `gpg --dearmor`, which fails
        # on `/dev/tty` under sudo in CI).
        continue-on-error: true
        run: |
          sudo install -d /etc/apt/keyrings
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo tee /etc/apt/keyrings/pgdg.asc > /dev/null
          echo "deb [signed-by=/etc/apt/keyrings/pgdg.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Configure AWS credentials
        uses: ./.github/actions/e2e-aws-credentials
        with:
          role-arns: ${{ secrets.AWS_ROLE_ARNS }}
          index: ${{ needs.detect-changes.outputs.e2e-index }}

      # Masks every value (line by line) before exporting it to later steps;
      # see scripts/ci/secret-to-env.sh.
      - name: Fetch Supabase secrets
        run: |
          set -euo pipefail
          aws secretsmanager get-secret-value \
            --secret-id blocks/supabase-e2e \
            --query SecretString --output text \
            | scripts/ci/secret-to-env.sh

      - name: Apply test schema
        run: npx tsx packages/bb-database/test/apply-schema.ts

      - name: E2E Test Supabase
        run: npm run test:e2e:supabase

  e2e-telemetry:
    name: Telemetry E2E
    # No build-and-test-local edge on purpose, see e2e-sandbox.
    needs: [detect-changes]
    if: contains(fromJSON(needs.detect-changes.outputs.e2e-run), 'telemetry') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: e2e
    permissions:
      contents: read
      id-token: write
    env:
      BLOCKS_STACK_SUFFIX: telemetry-${{ github.event.pull_request.number || github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check the E2E trailer
        if: contains(fromJSON(needs.detect-changes.outputs.e2e-blocked), 'telemetry')
        run: |
          echo "::error::The head commit's E2E trailer leaves out this job, but this PR's changes call for it. Push a commit without the trailer before merging."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Configure AWS credentials
        id: aws-creds
        uses: ./.github/actions/e2e-aws-credentials
        with:
          role-arns: ${{ secrets.AWS_ROLE_ARNS }}
          index: ${{ needs.detect-changes.outputs.e2e-index }}

      - name: Seed fixed e2e telemetry installation ID
        shell: bash
        run: |
          mkdir -p "$HOME/.cdk-blocks/telemetry"
          printf '%s' '00000000-0000-0000-0000-000000000e2e' > "$HOME/.cdk-blocks/telemetry/installation-id"

      - name: Telemetry E2E Tests
        run: npm run test:telemetry

      # e2e-cleanup.mjs first stops what earlier steps left running (after a
      # cancel, their cdk holds the cdk.out lock), and reports a failed destroy
      # as a warning. It runs only once AWS credentials were set up: before that
      # nothing was deployed (and a trailer-blocked job has no checkout).
      - name: Cleanup stacks
        if: always() && steps.aws-creds.outcome == 'success'
        run: |
          cd test-apps/telemetry
          node "$GITHUB_WORKSPACE/scripts/ci/e2e-cleanup.mjs" -- npx tsx cdk-blocks/scripts/sandbox-destroy.ts
          node "$GITHUB_WORKSPACE/scripts/ci/e2e-cleanup.mjs" -- npx tsx cdk-blocks/scripts/destroy.ts

  # Waits for the stack deletes that E2E Production starts in its last step
  # but no longer waits for, and for any stack the E2E Sandbox teardown had to
  # delete (its suite destroys its own). Fails, naming each stack and what
  # blocked it, when a delete ends DELETE_FAILED after retries or is not done
  # in time; cleanup-stacks.yml then reclaims the stack. Not a required check,
  # so the 12-22 minute deletes stay off the merge path: red here means a stack
  # to look at, not a failed test. Skipped when the run is cancelled (a new
  # push), since the next run starts right away. pr-e2e-compute.yml has its own
  # copy for E2E Compute Smoke.
  teardown-verify:
    name: E2E Teardown Verify
    permissions:
      contents: read
      id-token: write  # assumes the AWS role below
    needs: [detect-changes, e2e-sandbox, e2e-production]
    if: >-
      !cancelled() && github.event.pull_request.head.repo.full_name == github.repository &&
      (needs.e2e-sandbox.outputs.teardown-stacks != '' || needs.e2e-production.outputs.teardown-stacks != '')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/actions
            scripts/ci

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      - name: Configure AWS credentials
        uses: ./.github/actions/e2e-aws-credentials
        with:
          role-arns: ${{ secrets.AWS_ROLE_ARNS }}
          index: ${{ needs.detect-changes.outputs.e2e-index }}

      - name: Wait for the E2E stack deletes
        env:
          STACKS: >-
            ${{ needs.e2e-sandbox.outputs.teardown-stacks }}
            ${{ needs.e2e-production.outputs.teardown-stacks }}
        run: node scripts/ci/e2e-stack-wait.mjs $STACKS
