name: PR E2E Hosting

# The E2E Hosting matrix. Split out of pr-checks.yml so a failed leg can be
# re-run as soon as this run finishes, without waiting for the other E2E
# workflows. pr-checks.yml has the notes on the trigger, the checkout and the
# concurrency group.

on:
  pull_request:
    branches: ['*']

concurrency:
  group: pr-e2e-hosting-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Jobs that assume an AWS role grant themselves id-token: write.
permissions:
  contents: read

env:
  # Use the 'spec' reporter for node:test — produces a clean, hierarchical
  # pass/fail summary instead of verbose TAP output with per-test YAML blocks.
  NODE_OPTIONS: '--test-reporter=spec'

jobs:
  # Picks the E2E jobs to run. By default that is every E2E job when the PR
  # changes packages/ or test-apps/, and none otherwise. An E2E trailer on the
  # PR's head commit overrides it, so a PR that only changes CI (this workflow,
  # .github/actions/) or one E2E suite can run just the jobs it affects:
  #
  #   git commit --trailer 'E2E: all'               every E2E job
  #   git commit --trailer 'E2E: sandbox, hosting'  only these (job ids without the e2e- prefix)
  #
  # Only the head commit counts: a later commit without the trailer goes back
  # to the default. Each PR uses a fixed E2E account from the pool (PR number
  # mod the pool size, see .github/actions/e2e-slot), so parallel PRs spread
  # across it. The E2E Hosting legs spread one run over the pool too, each at
  # a fixed offset from the PR's account (see e2e-hosting).
  #
  # A job the changes call for is never skipped: if the trailer leaves it out,
  # or names an unknown job, it fails in its first step instead. E2E Sandbox
  # and E2E Production are required checks, and GitHub counts a skipped job as
  # passing, so a skip would let the trailer merge a PR past E2E. Push a
  # commit without the trailer before merging. For the same reason those two
  # also start when this job fails or is cancelled, and fail in their first step.
  #
  # E2E VPC Smoke is left out while test-apps/vpc-smoke's tests are switched
  # off (its test:e2e:sandbox script only echoes), since it would test nothing.
  #
  # The logic lives in scripts/ci/e2e-selection.sh, tested by
  # scripts/ci/e2e-selection.test.mjs (in Local Build and Checks).
  # scripts/ci/required-checks.test.mjs checks that no required check passes
  # when a job it depends on fails or is cancelled.
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      # E2E account for this PR (see .github/actions/e2e-slot).
      e2e-index: ${{ steps.e2e-slot.outputs.index }}
      # JSON array of the E2E jobs to run, e.g. ["sandbox","hosting"]
      e2e: ${{ steps.check.outputs.e2e }}
      # JSON array of the E2E jobs the changes call for but the trailer left
      # out. Each fails in its first step.
      e2e-blocked: ${{ steps.check.outputs.blocked }}
      # e2e + e2e-blocked: the E2E jobs that start. Each E2E job's `if:` checks
      # this one, so a blocked job can't be skipped by checking only `e2e`.
      e2e-run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The head commit, not the merge commit: its E2E trailer counts.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - id: e2e-slot
        uses: ./.github/actions/e2e-slot
      - id: check
        env:
          E2E_ACCOUNT: ${{ steps.e2e-slot.outputs.account }}
        run: scripts/ci/e2e-selection.sh origin/main

  e2e-hosting:
    permissions:
      contents: read
      id-token: write  # assumes the AWS role below
    name: E2E Hosting (${{ matrix.framework }})
    timeout-minutes: 60
    # No build-and-test-local edge on purpose, see e2e-sandbox.
    needs: [detect-changes]
    if: contains(fromJSON(needs.detect-changes.outputs.e2e-run), 'hosting') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: e2e
    strategy:
      fail-fast: false
      # API Gateway allows one REST API delete every 30 seconds per account,
      # and CloudFormation fails a REST API delete it can't make in about 4.5
      # minutes (DELETE_FAILED, 429 Too Many Requests). The legs' stacks hold
      # 16 REST APIs (DefaultCompute/API, plus Cdn/SsrRestApi on the nextjs,
      # nuxt, nuxt-buffered and sveltekit legs), and other PRs' runs delete
      # theirs in the same accounts. So each leg uses the account
      # `account-offset` after the PR's own (see .github/actions/e2e-slot),
      # spreading every run's deletes over three accounts. The offsets put at
      # most two 2-API legs on one account, and the fewest REST APIs (4,
      # against 7 and 5) on offset 0, which also takes the PR's Sandbox,
      # Production, Telemetry and Compute Smoke stacks.
      # A leg's offset must stay fixed: changing it moves the leg's stack to
      # another account, and the old account's cleanup-stacks.yml leg then
      # has to remove anything left there.
      #
      # Teardown waits (`teardown-at`) are not set on purpose: fixed delays
      # would need re-tuning whenever the suites' durations change, and most
      # failed deletes queue behind other runs, which no delay inside one run
      # avoids. scripts/ci/hosting-teardown-replay.mjs replays recent runs'
      # deletes through that quota, to check how long they wait or to evaluate
      # a schedule or other offsets (its header lists the inputs).
      matrix:
        include:
          - framework: spa
            app-dir: test-apps/hosting-spa
            script: test:e2e:hosting-spa
            account-offset: 1
          # The same SPA suite behind the regional ALB door (HOSTING_FRONT_DOOR),
          # then a redeploy of the kept sandbox. The other built-in doors are
          # covered by template tests and run as follow-up lanes.
          - framework: spa-alb
            app-dir: test-apps/hosting-spa
            script: test:e2e:hosting-spa
            front-door: alb
            account-offset: 2
          - framework: nextjs
            app-dir: test-apps/hosting-ssr
            script: test:e2e:hosting-ssr
            account-offset: 1
          - framework: nuxt
            app-dir: test-apps/hosting-ssr-nuxt
            script: test:e2e:hosting-ssr-nuxt
            account-offset: 2
          - framework: astro
            app-dir: test-apps/hosting-ssr-astro
            script: test:e2e:hosting-ssr-astro
            account-offset: 2
          - framework: astro-default404
            app-dir: test-apps/hosting-ssr-astro-default404
            script: test:e2e:hosting-ssr-astro-default404
            account-offset: 0
          - framework: sveltekit
            app-dir: test-apps/hosting-ssr-sveltekit
            script: test:e2e:hosting-ssr-sveltekit
            account-offset: 0
          - framework: preview
            app-dir: test-apps/hosting-preview
            script: test:e2e:hosting-preview
            account-offset: 1
          # Same suite with the SSR server on AWS Lambda Web Functions
          # (compute.type: 'web-function'); the app reads HOSTING_COMPUTE_TYPE.
          - framework: sveltekit-web-function
            app-dir: test-apps/hosting-ssr-sveltekit
            script: test:e2e:hosting-ssr-sveltekit
            compute-type: web-function
            account-offset: 2
          - framework: nextjs-web-function
            app-dir: test-apps/hosting-ssr
            script: test:e2e:hosting-ssr
            compute-type: web-function
            account-offset: 0
          - framework: nuxt-web-function
            app-dir: test-apps/hosting-ssr-nuxt
            script: test:e2e:hosting-ssr-nuxt
            compute-type: web-function
            account-offset: 1
          # The nuxt suite with `awsLambda.streaming` left unset (Nitro's
          # default; the app reads HOSTING_NITRO_STREAMING), so the server is
          # a buffered handler behind the CloudFront door.
          - framework: nuxt-buffered
            app-dir: test-apps/hosting-ssr-nuxt
            script: test:e2e:hosting-ssr-nuxt
            nitro-streaming: 'off'
            account-offset: 1
    env:
      BLOCKS_STACK_SUFFIX: pr-${{ github.event.pull_request.number || github.run_id }}-${{ matrix.framework }}
      HOSTING_COMPUTE_TYPE: ${{ matrix.compute-type || 'lambda' }}
      HOSTING_FRONT_DOOR: ${{ matrix.front-door || '' }}
      HOSTING_NITRO_STREAMING: ${{ matrix.nitro-streaming || '' }}
      # The suite keeps its sandbox; Destroy sandbox below deletes it (after the
      # Web Function and front-door redeploy checks, which need it).
      BLOCKS_SANDBOX_KEEP: '1'
      E2E_FROM_EMAIL: ${{ secrets.E2E_FROM_EMAIL }}
    steps:
      - name: Check the E2E trailer
        if: contains(fromJSON(needs.detect-changes.outputs.e2e-blocked), 'hosting')
        run: |
          echo "::error::The head commit's E2E trailer leaves out this job, but this PR's changes call for it. Push a commit without the trailer before merging."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      # Pin a fixed Blocks CLI telemetry installation ID for CI e2e runs so this
      # traffic is consistent and identifiable (and can be excluded from product
      # usage metrics).
      - uses: ./.github/actions/seed-telemetry-id

      - run: npm ci
      - run: npm run build:e2e

      # This leg's account: the PR's, moved by the leg's account-offset.
      - id: e2e-slot
        uses: ./.github/actions/e2e-slot
        with:
          offset: ${{ matrix.account-offset }}

      - name: Configure AWS credentials
        id: aws-creds
        uses: ./.github/actions/e2e-aws-credentials
        with:
          role-arns: ${{ secrets.AWS_ROLE_ARNS }}
          index: ${{ steps.e2e-slot.outputs.index }}

      # Bounded: an apt mirror can stall silently (once for 57 min, until the job
      # timeout). The wrapper retries an attempt that prints nothing for 8 min and
      # gives up after 23 min in all; timeout-minutes is the backstop.
      # See scripts/ci/install-playwright.mjs.
      - name: Install Playwright
        timeout-minutes: 25
        run: node scripts/ci/install-playwright.mjs chromium

      - name: Generate the test-support secret
        # This run's test-support secret: random per run, masked in the logs, never
        # stored. The deploy registers it as config for the e2e build's gated
        # test-only methods, and the tests send it, so nothing reads it from AWS.
        run: |
          secret="$(openssl rand -hex 32)"
          echo "::add-mask::$secret"
          echo "BLOCKS_TEST_SUPPORT_SECRET=$secret" >> "$GITHUB_ENV"

      - name: E2E Test Hosting (${{ matrix.framework }})
        id: e2e
        run: npm run ${{ matrix.script }}

      # Sandbox deploys use Express Mode (rollback disabled), which rejects
      # replacement updates; a fresh create can't catch a revision that updates
      # in place. Redeploy the kept sandbox with a new revision and check it serves.
      - name: Redeploy with a new Web Function revision
        if: matrix.compute-type == 'web-function'
        run: npx tsx scripts/ci/web-function-redeploy.ts ${{ matrix.app-dir }}

      - name: Redeploy behind the ${{ matrix.front-door }} front door
        if: matrix.front-door
        run: npx tsx scripts/ci/hosting-redeploy.ts ${{ matrix.app-dir }}

      # Runs whenever the suite ran, passed or failed, like the suite's own
      # afterAll destroy did, and a failed destroy fails the job, as it did
      # from the afterAll (Web Function legs too; before, only Cleanup sandbox
      # destroyed theirs, and ignored a failure). Cleanup sandbox retries when
      # this step didn't succeed.
      - name: Destroy sandbox
        id: destroy
        if: ${{ !cancelled() && steps.e2e.outcome != 'skipped' }}
        run: |
          cd ${{ matrix.app-dir }}
          npx tsx test/sandbox-destroy.ts cdk-blocks/index.cdk.ts

      # e2e-cleanup.mjs first stops what earlier steps left running (after a
      # cancel, their cdk holds the cdk.out lock), and reports a failed destroy
      # as a warning. It runs only once AWS credentials were set up: before that
      # nothing was deployed (and a trailer-blocked job has no checkout).
      - name: Cleanup sandbox
        if: always() && steps.aws-creds.outcome == 'success' && steps.destroy.outcome != 'success'
        run: |
          cd ${{ matrix.app-dir }}
          node "$GITHUB_WORKSPACE/scripts/ci/e2e-cleanup.mjs" -- npx tsx test/sandbox-destroy.ts cdk-blocks/index.cdk.ts
