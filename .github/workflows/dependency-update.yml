name: Weekly Dependency Update

on:
  schedule:
    - cron: '0 5 * * 6' # Saturday 5am UTC — PR ready for Monday AM Berlin
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-deps:
    name: Bump Dependencies
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: '--test-reporter=spec'
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      # Pin a fixed Blocks CLI telemetry installation ID for CI e2e runs so this
      # traffic is consistent and identifiable (and can be excluded from product
      # usage metrics).
      - uses: ./.github/actions/seed-telemetry-id

      - run: npm install -g npm-check-updates

      - name: Bump root + workspace packages
        run: ncu -u --target minor --root --workspaces

      - name: Bump templates
        run: |
          for dir in packages/create-blocks-app/templates/*/; do
            if [ ! -f "$dir/package.json" ]; then
              echo "Skipping $dir (no package.json)"
              continue
            fi
            echo "Updating $dir"
            ncu -u --target minor --cwd "$dir"
          done

      - name: Install and build
        run: |
          npm install
          npm run build

      - name: Verify with local e2e
        run: npm run test:e2e:local

      - name: Create PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Target the branch this run was triggered on: on the schedule that's
          # main; a manual run from the Actions menu against a feature branch bumps
          # (and PRs into) THAT branch, so the PR merges cleanly instead of carrying
          # the branch's own commits into a main-targeted PR.
          TARGET="$GITHUB_REF_NAME"
          DATE="$(date +%Y-%m-%d)"
          BRANCH="chore/dependency-update-${TARGET}-${DATE}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          # Stage only dependency manifests + the lockfile, so a run from a feature
          # branch can't sweep that branch's unrelated changes into the bump PR.
          git add -- ':(glob)**/package.json' package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes found."
            exit 0
          fi
          git commit -m "chore: weekly dependency bump for ${TARGET} (${DATE})"
          git push -u origin "$BRANCH"
          gh pr create \
            --title "chore: weekly dependency bump for ${TARGET} (${DATE})" \
            --body "Automated dependency bump via \`npm-check-updates\` (\`--target minor\`).

          Target branch: \`${TARGET}\`
          Scope: root, all workspace packages, and templates.

          Build and local e2e passed. Please review and merge." \
            --base "$TARGET"
