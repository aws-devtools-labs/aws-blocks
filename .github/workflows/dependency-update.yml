name: Weekly Dependency Update

on:
  schedule:
    - cron: '0 5 * * 6' # Saturday 5am UTC — PR ready for Monday AM Berlin
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-deps:
    name: Bump Dependencies
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: '--test-reporter=spec'
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      # Pin a fixed Blocks CLI telemetry installation ID for CI e2e runs so this
      # traffic is consistent and identifiable (and can be excluded from product
      # usage metrics).
      - uses: ./.github/actions/seed-telemetry-id

      - run: npm install -g npm-check-updates

      - name: Bump root + workspace packages
        run: ncu -u --target minor --root --workspaces

      - name: Bump templates
        run: |
          for dir in packages/create-blocks-app/templates/*/; do
            echo "Updating $dir"
            ncu -u --target minor --cwd "$dir"
          done

      - name: Install and build
        run: |
          npm install
          # Auto-remediate advisories the bump may have introduced (same GitHub
          # Advisory data the `dependency-review` PR gate blocks on), so most
          # vulnerable transitives are patched here instead of needing a manual
          # `overrides` pin. No `--force`: we only take in-range (non-breaking)
          # fixes unattended; anything needing a major bump or a bundled-dep
          # override is left for a human. `|| true` so a partial/again-flagged
          # fix never fails the job — the dependency-review gate on the PR is the
          # authoritative check, and the build/e2e below verify whatever changed.
          npm audit fix || true
          npm run build

      - name: Verify with local e2e
        run: npm run test:e2e:local

      # Generate a changeset covering any published @aws-blocks/* package whose
      # package.json the bump changed, so the `Require changeset` gate passes.
      # A dependency bump is non-breaking, so the entries are `patch`; the
      # umbrella is bumped alongside its siblings. Writes nothing when only
      # test-apps/templates/private tooling changed.
      - name: Generate changeset for bumped packages
        run: |
          git fetch origin "$GITHUB_REF_NAME" --depth=1 || true
          node --experimental-strip-types scripts/generate-dependency-changeset.ts "origin/$GITHUB_REF_NAME"

      - name: Create PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Target the branch this run was triggered on: on the schedule that's
          # main; a manual run from the Actions menu against a feature branch bumps
          # (and PRs into) THAT branch, so the PR merges cleanly instead of carrying
          # the branch's own commits into a main-targeted PR.
          TARGET="$GITHUB_REF_NAME"
          DATE="$(date +%Y-%m-%d)"
          BRANCH="chore/dependency-update-${TARGET}-${DATE}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          # Stage only dependency manifests + the lockfile + the generated
          # changeset, so a run from a feature branch can't sweep that branch's
          # unrelated changes into the bump PR.
          git add -- ':(glob)**/package.json' package-lock.json .changeset
          if git diff --cached --quiet; then
            echo "No dependency changes found."
            exit 0
          fi
          git commit -m "chore: weekly dependency bump for ${TARGET} (${DATE})"
          git push -u origin "$BRANCH"
          gh pr create \
            --title "chore: weekly dependency bump for ${TARGET} (${DATE})" \
            --body "Automated dependency bump via \`npm-check-updates\` (\`--target minor\`).

          Target branch: \`${TARGET}\`
          Scope: root, all workspace packages, and templates.

          A changeset for the bumped published packages is included (patch).
          Build and local e2e passed. Please review and merge." \
            --base "$TARGET"
