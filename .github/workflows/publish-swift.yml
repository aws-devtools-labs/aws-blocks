name: Publish Swift SDK

on:
  workflow_dispatch:

concurrency:
  group: publish-swift
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-15
    defaults:
      run:
        working-directory: native/swift
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: swift build

      - name: Run unit tests
        run: swift test --filter "BlocksCodegenTests|BlocksRuntimeTests"

      - name: Build for iOS
        run: xcodebuild build -scheme aws-blocks-swift-Package -destination 'platform=iOS Simulator,name=iPhone 16'

      - name: Run unit tests on iOS
        run: xcodebuild test -scheme aws-blocks-swift-Package -destination 'platform=iOS Simulator,name=iPhone 16' -only-testing BlocksCodegenTests -only-testing BlocksRuntimeTests

  create-release-prs:
    name: Create Release PRs
    needs: build-and-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/swift
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.OPS_GITHUB_TOKEN }}
          # Don't persist the PAT into .git/config; pushes below authenticate
          # via an explicit tokenised remote URL instead.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: native/swift/package-lock.json

      - name: Install changeset CLI
        run: npm ci

      - name: Verify pending changesets
        run: npx changeset status --since=origin/main

      - name: Run changeset version
        env:
          GITHUB_TOKEN: ${{ secrets.OPS_GITHUB_TOKEN }}
        run: npx changeset version

      # changeset version bumps package.json; regenerate the committed constant
      # so the release carries the new version.
      - name: Regenerate Swift version constant
        run: scripts/generate-version.sh

      - name: Read version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Swift SDK version: $VERSION"

      - name: Guard against existing release branch
        env:
          GH_TOKEN: ${{ secrets.OPS_GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # persist-credentials:false leaves `origin` unauthenticated. Supply the
          # token via a GIT_ASKPASS helper (reads it from the environment) so it
          # is never placed in the git command's argv / process list.
          ASKPASS="$(mktemp)"
          printf '#!/bin/sh\nprintf %%s "$GH_TOKEN"\n' > "$ASKPASS"
          chmod +x "$ASKPASS"
          export GIT_ASKPASS="$ASKPASS"
          REMOTE="https://x-access-token@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --heads "$REMOTE" "release/swift-${VERSION}" | grep -q .; then
            echo "::error::Release branch release/swift-${VERSION} already exists."
            exit 1
          fi

      - name: Read CHANGELOG entry
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ENTRY=$(./scripts/extract-changelog.sh CHANGELOG.md "$VERSION")
          # Use a randomised heredoc delimiter so a changelog line that happens
          # to equal a fixed "EOF" can't terminate this $GITHUB_OUTPUT block
          # early and disturb the captured value.
          DELIM="ENTRY_$(openssl rand -hex 16)"
          {
            echo "entry<<${DELIM}"
            echo "$ENTRY"
            echo "${DELIM}"
          } >> "$GITHUB_OUTPUT"

      - name: Create monorepo release PR
        env:
          GH_TOKEN: ${{ secrets.OPS_GITHUB_TOKEN }}
          # Pass the changelog to the step as data via env rather than letting
          # the workflow expression expand into the script text, so the shell
          # treats the value as data and does not evaluate it.
          CHANGELOG_ENTRY: ${{ steps.changelog.outputs.entry }}
        working-directory: .
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BRANCH="release/swift-${VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git add -A
          git commit -m "chore(swift): release ${VERSION}"
          # persist-credentials:false keeps the PAT out of .git/config. Supply
          # the token via a GIT_ASKPASS helper (reads it from the environment)
          # so it is never placed in the git command's argv / process list.
          ASKPASS="$(mktemp)"
          printf '#!/bin/sh\nprintf %%s "$GH_TOKEN"\n' > "$ASKPASS"
          chmod +x "$ASKPASS"
          export GIT_ASKPASS="$ASKPASS"
          git push "https://x-access-token@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"

          # Build the PR body from a quoted heredoc (<<'EOF' = pure literal, no
          # command substitution or expansion), then inject the dynamic values
          # via bash parameter substitution so they are data, never code.
          BODY=$(cat <<'EOF'
          ## Swift SDK Release __VERSION__

          __CHANGELOG_ENTRY__

          On merge, this will be tagged `swift@__VERSION__` and synced to aws-blocks-swift.
          EOF
          )
          BODY=${BODY//__VERSION__/$VERSION}
          BODY=${BODY/__CHANGELOG_ENTRY__/$CHANGELOG_ENTRY}

          gh pr create \
            --title "chore(swift): release ${VERSION}" \
            --body "$BODY"

      - name: Checkout aws-blocks-swift
        uses: actions/checkout@v7
        with:
          repository: aws-devtools-labs/aws-blocks-swift
          path: target-repo
          token: ${{ secrets.OPS_GITHUB_TOKEN }}
          # Don't persist the PAT into .git/config; the release-PR step pushes
          # via an explicit tokenised remote URL instead.
          persist-credentials: false

      - name: Sync files to aws-blocks-swift
        run: |
          # Remove synced content (preserve repo-only files)
          find ../../target-repo -maxdepth 1 \
            -not -name '.git' \
            -not -name '.github' \
            -not -name 'LICENSE' \
            -not -name 'NOTICE' \
            -not -name 'CODE_OF_CONDUCT.md' \
            -not -name 'CONTRIBUTING.md' \
            -not -name '.' \
            -not -name '..' \
            -exec rm -rf {} +

          # Copy native/swift contents to target repo root.
          # Anchor the root package.json/package-lock.json excludes with a
          # leading '/' so they only skip native/swift's changeset-tooling
          # manifests. Unanchored patterns match at every depth and would also
          # drop Demo/typescript-demo/package.json + package-lock.json, which
          # the demo needs (and which carry the dependency/security fixes).
          rsync -a --exclude='.changeset' \
                   --exclude='node_modules' \
                   --exclude='.build' \
                   --exclude='/package.json' \
                   --exclude='/package-lock.json' \
                   --exclude='Demo/typescript-demo/node_modules' \
                   ./ ../../target-repo/

      - name: Create aws-blocks-swift release PR
        working-directory: target-repo
        env:
          GH_TOKEN: ${{ secrets.OPS_GITHUB_TOKEN }}
          # Pass the changelog as data, not as script text (see the monorepo
          # step) — prevents $(...) in changelog prose executing on the runner.
          CHANGELOG_ENTRY: ${{ steps.changelog.outputs.entry }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BRANCH="release/swift-${VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git add -A

          if git diff --cached --quiet; then
            echo "::error::No changes to sync"
            exit 1
          fi

          git commit -m "chore: release ${VERSION}"
          # persist-credentials:false keeps the PAT out of .git/config. Supply
          # the token via a GIT_ASKPASS helper (reads it from the environment)
          # so it is never placed in the git command's argv / process list.
          ASKPASS="$(mktemp)"
          printf '#!/bin/sh\nprintf %%s "$GH_TOKEN"\n' > "$ASKPASS"
          chmod +x "$ASKPASS"
          export GIT_ASKPASS="$ASKPASS"
          git push "https://x-access-token@github.com/aws-devtools-labs/aws-blocks-swift.git" "$BRANCH"

          # Build the PR body from a quoted heredoc (<<'EOF' = pure literal),
          # then inject the dynamic values via bash parameter substitution so
          # they are treated as data, never code.
          BODY=$(cat <<'EOF'
          ## Release __VERSION__

          __CHANGELOG_ENTRY__

          Synced from aws-blocks monorepo branch `release/swift-__VERSION__`.

          On merge, a git tag `__VERSION__` will be created automatically and a GitHub Release published. Swift Package Manager will pick up the new version via the tag.
          EOF
          )
          BODY=${BODY//__VERSION__/$VERSION}
          BODY=${BODY/__CHANGELOG_ENTRY__/$CHANGELOG_ENTRY}

          gh pr create \
            --title "chore: release ${VERSION}" \
            --body "$BODY"
