name: Publish Swift SDK

on:
  workflow_dispatch:

concurrency:
  group: publish-swift
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-26
    # The build runs package plugins and codegen, so give it a read-only token
    # and keep that token out of .git/config.
    permissions:
      contents: read
    defaults:
      run:
        working-directory: native/swift
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        run: swift build

      - name: Run unit tests
        run: swift test --filter "BlocksCodegenTests|BlocksRuntimeTests|BlocksGeneratedCodeTests|BlocksGeneratedMainActorTests"

      - name: Build for iOS
        run: xcodebuild build -scheme aws-blocks-swift-Package -destination 'platform=iOS Simulator,name=iPhone 17 Pro'

      - name: Run unit tests on iOS
        run: xcodebuild test -scheme aws-blocks-swift-Package -destination 'platform=iOS Simulator,name=iPhone 17 Pro' -only-testing BlocksCodegenTests -only-testing BlocksRuntimeTests

  create-release-prs:
    name: Create Release PRs
    needs: build-and-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/swift
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Don't persist the token into .git/config. A dedicated "Configure git
          # auth" step wires up the gh credential helper for the git operations
          # that need it, so the token is neither stored on disk nor placed in a
          # git command's argv.
          persist-credentials: false

      - name: Configure git auth
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Registers `gh auth git-credential` as the credential helper in the
        # global git config. It stores no secret on disk and only returns the
        # token to processes that already carry GH_TOKEN or GITHUB_TOKEN in
        # their environment, so steps without either stay unauthenticated. This keeps the
        # `origin` remote usable (so the remote-tracking ref `gh pr create`
        # needs still gets written) without persisting credentials.
        run: gh auth setup-git

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: native/swift/package-lock.json

      - name: Install changeset CLI
        run: npm ci

      - name: Verify pending changesets
        run: npx changeset status --since=origin/main

      - name: Run changeset version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx changeset version

      # changeset version bumps package.json; regenerate the committed constant
      # so the release carries the new version.
      - name: Regenerate Swift version constant
        run: scripts/generate-version.sh

      - name: Read version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Swift SDK version: $VERSION"

      - name: Guard against existing release branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # --exit-code returns 2 when no ref matches. Any other failure (network,
          # auth) must stop the release instead of reading as "absent".
          rc=0
          git ls-remote --exit-code --heads origin "release/swift-${VERSION}" >/dev/null || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "::error::Release branch release/swift-${VERSION} already exists."
            exit 1
          elif [ "$rc" -ne 2 ]; then
            echo "::error::git ls-remote failed (exit $rc)."
            exit 1
          fi

      - name: Read CHANGELOG entry
        id: changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ENTRY=$(./scripts/extract-changelog.sh CHANGELOG.md "$VERSION")
          # Use a randomised heredoc delimiter so a changelog line that happens
          # to equal a fixed "EOF" can't terminate this $GITHUB_OUTPUT block
          # early and disturb the captured value.
          DELIM="ENTRY_$(openssl rand -hex 16)"
          {
            echo "entry<<${DELIM}"
            echo "$ENTRY"
            echo "${DELIM}"
          } >> "$GITHUB_OUTPUT"

      # This PR is opened with GITHUB_TOKEN, so its checks wait for a
      # maintainer to approve the workflow runs on the PR. The aws-blocks-swift
      # repo pulls the release from the swift@<version> tag after merge; see
      # the PR body for that step.
      - name: Create monorepo release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pass the changelog to the step as data via env rather than letting
          # the workflow expression expand into the script text, so the shell
          # treats the value as data and does not evaluate it.
          CHANGELOG_ENTRY: ${{ steps.changelog.outputs.entry }}
          VERSION: ${{ steps.version.outputs.version }}
        working-directory: .
        run: |
          BRANCH="release/swift-${VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git add -A
          git commit -m "chore(swift): release ${VERSION}"
          # Credentials come from the gh credential helper configured in
          # "Configure git auth", so `origin` (which the checkout set to this
          # repo) pushes without the token appearing in argv, and the
          # remote-tracking ref that `gh pr create --head` relies on is written.
          git push origin "$BRANCH"

          # The PR body is rendered by the tested script
          # native/swift/scripts/render-release-body.sh: the changelog entry is
          # piped in on stdin (never argv) and kept literal, so `&`, backticks,
          # `$(...)` or a bare EOF line in it can't be expanded or truncated.
          BODY=$(printf '%s' "$CHANGELOG_ENTRY" | native/swift/scripts/render-release-body.sh monorepo "$VERSION")

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore(swift): release ${VERSION}" \
            --body "$BODY"
