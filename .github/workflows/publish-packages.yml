name: Release

# Version + publish via changesets/action. On push to main it either opens/updates
# a "Version Packages" PR (running `changeset version`) or, once that PR is merged
# and no changesets remain, publishes to npm. Merging the PR is the release gate.
# Canary publishes live in publish-canary.yml.
#
# NOTE: The Version Packages PR does not start its PR checks automatically.
# Approve the workflow runs at the bottom of the PR. Then merge the PR.

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # push the version-PR branch + tags
  pull-requests: write # open/update the Version Packages PR
  id-token: write # npm provenance

jobs:
  release:
    name: Version & Publish (npm)
    runs-on: ubuntu-latest
    environment: publish
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      # --ignore-scripts: a publishing job shouldn't run dependencies' install
      # scripts, and the build doesn't need them (esbuild/sharp binaries ship
      # as optional deps). Keep it on this command only: `changeset publish`
      # still runs our own prepack. pr-checks.yml's release-install-check runs
      # the same install + build on every PR; keep the two in sync.
      - run: npm ci --ignore-scripts

      # Dependabot can't write changesets, so its bumps merge without one
      # (verify-coverage skips them). Write it here instead: one patch entry for
      # each published package whose package.json changed since the last release
      # and that no pending changeset covers yet. This has to run before
      # changesets/action, not inside `npm run version`: the action only
      # versions when it finds a changeset on disk, and otherwise publishes. The
      # file stays uncommitted; the action reads it, `changeset version` consumes
      # it, and the result lands in the Version Packages PR. On the push that
      # merges that PR the diff is empty, so nothing is written and the action
      # publishes.
      - name: Changeset for dependency bumps since the last release
        run: |
          LAST_RELEASE="$(git log -1 --format=%H --grep='^chore: version packages' HEAD)"
          if [ -z "$LAST_RELEASE" ]; then
            echo "::warning::No 'chore: version packages' commit found; skipping the dependency changeset."
            exit 0
          fi
          node --experimental-strip-types scripts/generate-dependency-changeset.ts "$LAST_RELEASE" automated

      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        id: changesets
        with:
          version-script: npm run version
          publish-script: npm run release
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'

      # The Version PR is created with GITHUB_TOKEN, so it doesn't auto-trigger
      # CI. Append operator instructions to the PR body.
      - name: Add release instructions to Version PR
        if: steps.changesets.outputs.pr-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUM="${{ steps.changesets.outputs.pr-number }}"
          CURRENT_BODY=$(gh pr view "$PR_NUM" --json body --jq .body)
          INSTRUCTIONS="## Release Instructions

          > **To complete this release:**
          > 1. Read the version bumps and changelogs below.
          > 2. Go to the bottom of this PR.
          > 3. **Approve the workflow runs.**
          > 4. Wait until all checks pass.
          > 5. Merge the PR.
          >
          > The merge starts the npm publish.

          ---

          "
          gh pr edit "$PR_NUM" --body "${INSTRUCTIONS}${CURRENT_BODY}"
