name: Canary

# Scaffolds a fresh app from a locally-published @aws-blocks registry.
# Tests the full packaging + scaffold + build + e2e path using published
# artifacts (not workspace links).
# Not a PR gate. Runs on a daily schedule against the default branch.

on:
  workflow_dispatch:
  schedule:
    # Daily at 16:00 UTC (default branch only).
    - cron: '0 16 * * *'
  pull_request:
    paths:
      - '.github/workflows/canary.yml'
      - 'scripts/canary/**'
      # A template's package.json defines whether it ships a `test:e2e`, which
      # is what the discover job keys on — so adding or changing one re-runs
      # the canary on the PR that introduces it.
      - 'packages/create-blocks-app/templates/*/package.json'

concurrency:
  group: canary-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_OPTIONS: '--test-reporter=spec'

jobs:
  # Discover the matrix from the source of truth rather than hard-coding it.
  # `packages/create-blocks-app/templates/` is the only source of truth for the
  # template list (packages/create-blocks-app/src/index.ts), so the canary runs
  # exactly the templates that ship a runnable `test:e2e` and never drifts when
  # a template is added or removed. A template without a `test:e2e` script (for
  # example `amplify`, whose coverage lives in the `test-apps/amplify-gen2`
  # interop suite) is excluded automatically.
  discover:
    name: Discover templates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      templates: ${{ steps.list.outputs.templates }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: list
        name: List templates with a test:e2e script
        run: |
          templates="$(
            for pkg in packages/create-blocks-app/templates/*/package.json; do
              if jq -e '.scripts["test:e2e"]' "$pkg" > /dev/null 2>&1; then
                basename "$(dirname "$pkg")"
              fi
            done | sort | jq -R . | jq -cs .
          )"
          echo "Discovered templates: $templates"
          if [ "$templates" = "[]" ]; then
            echo "ERROR: no templates with a test:e2e script found" >&2
            exit 1
          fi
          echo "templates=$templates" >> "$GITHUB_OUTPUT"

  canary:
    name: Canary (${{ matrix.template }}, local mocks)
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # One cell per discovered template; a single template failing must not
      # cancel the others, so each day reports every template's result.
      fail-fast: false
      matrix:
        template: ${{ fromJSON(needs.discover.outputs.templates) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      # Pin a fixed Blocks CLI telemetry installation ID for CI e2e runs so this
      # traffic is consistent and identifiable (and can be excluded from product
      # usage metrics).
      - uses: ./.github/actions/seed-telemetry-id

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to local registry
        run: npm run publish:local

      - name: Start local registry
        run: |
          npx tsx scripts/publish/serve-local-registry.ts &
          for i in $(seq 1 15); do
            if curl -sf http://localhost:4873/registry/@aws-blocks/blocks > /dev/null 2>&1; then
              echo "Registry ready"
              break
            fi
            if [ $i -eq 15 ]; then
              echo "ERROR: Registry did not start"
              exit 1
            fi
            sleep 1
          done

      - name: Run canary
        env:
          BLOCKS_REGISTRY_URL: http://localhost:4873/registry/
        run: npm run canary -- --template ${{ matrix.template }}
