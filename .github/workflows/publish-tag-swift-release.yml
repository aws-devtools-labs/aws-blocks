name: Tag Swift Release

on:
  pull_request:
    types: [closed]
    branches: [main]

# Not cancellable: the job pushes a git tag, so a run must not die part-way.
concurrency:
  group: tag-swift-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tag:
    name: Tag swift@x.y.z
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/swift-')
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract version from branch name
        id: version
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          VERSION="${BRANCH#release/swift-}"

          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "ERROR: refusing to tag: '$VERSION' is not a valid SemVer version" >&2
            exit 1
          fi
          if [ "$(printf '%s' "$VERSION" | wc -l)" -ne 0 ]; then
            echo "ERROR: refusing to tag: version contains a newline" >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Tagging swift@${VERSION}"

      - name: Create tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "swift@${VERSION}" -m "Swift SDK ${VERSION}"
          git push origin "swift@${VERSION}"
