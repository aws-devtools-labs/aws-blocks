name: Supabase Keep-Alive
on:
  schedule:
    - cron: '0 0 */3 * *' # Every 3 days
  workflow_dispatch: # run by hand to check the e2e account wiring
permissions:
  id-token: write
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    environment: e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/actions/e2e-aws-credentials
            packages/bb-data/test/fixtures/supabase-ca.crt
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Configure AWS credentials
        uses: ./.github/actions/e2e-aws-credentials
        with:
          # Not a PR run, so always E2E account 1 (see .github/actions/e2e-slot).
          role-arns: ${{ secrets.AWS_ROLE_ARNS }}

      - name: Ping Supabase
        env:
          # Same pinned Supabase Root 2021 CA as the E2E Supabase job.
          PGSSLROOTCERT: packages/bb-data/test/fixtures/supabase-ca.crt
          PGSSLMODE: verify-full
        run: |
          DB_URL=$(aws secretsmanager get-secret-value \
            --secret-id blocks/supabase-e2e \
            --query SecretString --output text | jq -r .SUPABASE_DB_URL)
          echo "::add-mask::$DB_URL"
          # A query, not an HTTP health check: the Auth health endpoint doesn't
          # touch Postgres, so it may not count as project activity.
          psql "$DB_URL" -tAc 'select 1' > /dev/null
          echo "✓ Supabase project is alive"
