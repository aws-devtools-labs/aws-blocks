name: Supabase Keep-Alive
on:
  schedule:
    - cron: '0 0 */3 * *' # Every 3 days
  workflow_dispatch: # run by hand to check the e2e account wiring
permissions:
  id-token: write
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    environment: e2e
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Ping Supabase
        run: |
          SECRET=$(aws secretsmanager get-secret-value \
            --secret-id blocks/supabase-e2e \
            --query SecretString --output text)
          PROJECT_REF=$(echo "$SECRET" | jq -r .SUPABASE_PROJECT_REF)
          ANON_KEY=$(echo "$SECRET" | jq -r .SUPABASE_ANON_KEY)
          # /rest/v1/ (the schema root) now returns 401 for the anon key, so
          # ping the auth health endpoint instead.
          curl -sf "https://${PROJECT_REF}.supabase.co/auth/v1/health" \
            -H "apikey: ${ANON_KEY}" \
            -H "Authorization: Bearer ${ANON_KEY}" \
            > /dev/null
          echo "✓ Supabase project is alive"
