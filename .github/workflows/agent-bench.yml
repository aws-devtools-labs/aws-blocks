name: Agent Bench

# Per-PR LLM-agent benchmark: each cell scaffolds a template, a builder agent builds it, then
# build + Playwright spec run and a judge agent grades. Runs entirely on the GitHub runner.
# Requires (agent-bench env): BENCH_ROLE_ARN secret (OIDC role with bedrock InvokeModelWithResponseStream
# + Converse on the bench model, and s3 Put/Get on bench/* in the bench bucket) and BENCH_BUCKET var.
# Both come from test-infra/github-oidc-stack.ts.
# Invoked by pr-agent-bench.yml, which owns the triggers + same-repo gate; the OIDC steps and
# `environment: agent-bench` live on the jobs here because a `uses:` caller job cannot set environment.
#
# LEAST PRIVILEGE: the bench job's initial OIDC session is narrowed to Bedrock only via
# an inline session policy, so the shell-capable "2. Agent run" step (and judge/analysis) cannot
# reach s3:PutObject even though the role grants it. The same role is re-assumed WITHOUT a session
# policy immediately before "Persist to S3" so only that step regains the s3 write. See the
# "Configure AWS credentials (OIDC)" step below for the canonical explanation of how the inline
# session policy works (intersection semantics, why the BENCH_ROLE_ARN role is untouched, and the
# exact allow-list). The `summary` job holds the full role (Bedrock + S3 baseline) but has no
# shell-capable agent (tracked as follow-up).

on:
  workflow_call:

permissions:
  contents: read

# Harden npm against transient registry blips so a network hiccup retries with backoff; set at
# workflow level so every job and child process inherits it (never masks real 4xx/auth errors).
env:
  NPM_CONFIG_FETCH_RETRIES: '5'
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: '20000'
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: '120000'

jobs:
  # Build + pack the whole monorepo to a local npm registry ONCE per run, handed to every cell
  # as the dist-registry/ artifact (cells resolve @aws-blocks/* from the packed .tgz, not symlinks,
  # so every cell tests byte-identical packages). Replaces the per-cell monorepo rebuild. No AWS.
  build-blocks:
    name: build blocks (pack dist-registry once)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      # build packs every package to dist-registry/ as .tgz; the one build+pack all cells consume.
      - name: Build + pack to dist-registry
        run: |
          npm run build
          npm run publish:local
      - name: Upload dist-registry
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-registry
          path: dist-registry/
          retention-days: 1
          # Every cell depends on this artifact, so an empty pack must red build-blocks.
          if-no-files-found: error

  bench:
    name: ${{ matrix.task }} · ${{ matrix.template }}
    runs-on: ubuntu-latest
    # Not the sum of the step caps: the capped steps add up to 125 min (Playwright install 25,
    # agent 35, build/test 12, judge 20, analyze 20, stage 10, S3 persist 3), plus the uncapped
    # ones. Even the main path (install 25 + agent 35 + build/test 12 + judge 20 = 92) can
    # exceed it, so a cell that runs long in an early step can hit this job timeout in a later
    # step (the judge, the analysis or an upload) before that step's own cap fires. The caps
    # bound each step on its own; only this line bounds the cell.
    timeout-minutes: 85
    permissions:
      id-token: write
      contents: read
    environment: agent-bench
    # Gate cells on the single upstream build+pack; if it breaks, cells skip (one loud failure).
    needs: build-blocks
    strategy:
      fail-fast: false
      # Cap concurrent cells so builder invokes fan out in waves instead of hitting the account
      # tokens-per-minute ceiling all at once (that failed 6/10 cells in run 28967475174).
      max-parallel: 5
      # One cell per (task, template) pair: each task runs on the single template that best
      # exercises its Building Blocks — 10 cells cover 18 Blocks without a full cross-product.
      # DIAGNOSTIC (temporary, not for merge): round 3 confirms the cause found in round 2 (procps
      # kill reading `-9 -1xxxxx` as kill(-1); fixed by the `--` in groupKillArgv, PR #1102). Every
      # cell runs the full judge with bash and the group kill on; all four should finish and score.
      # Restore the full matrix before anything merges.
      matrix:
        include:
          - { task: file-gallery, template: bare, judge_stop: '', judge_bash: echo }
          - { task: async-word-counter, template: bare, judge_stop: '', judge_bash: echo }
          - { task: observability-api, template: backend, judge_stop: '', judge_bash: echo }
          - { task: email-digest, template: demo, judge_stop: '', judge_bash: echo }
    env:
      WORKSPACE: ${{ github.workspace }}/bench-app
      TASK: ${{ matrix.task }}
      # Bedrock geo inference-profile IDs (both resolve in us-east-1). Overridable via BENCH_MODEL;
      # builder and judge share Opus 4.8 (same-model self-eval bias accepted for now).
      BENCH_MODEL: us.anthropic.claude-opus-4-8
      BENCH_JUDGE_MODEL: us.anthropic.claude-opus-4-8
      AWS_REGION: us-east-1
      TEMPLATE: ${{ matrix.template }}
      PR_NUMBER: ${{ github.event.pull_request.number || 'manual' }}
      # Deterministic startup stagger for the builder's first Bedrock call (see 2-agent-run.ts):
      # it sleeps (BENCH_CELL_INDEX mod BENCH_STAGGER_WAVE_SIZE) * BENCH_STAGGER_STEP_SEC. Staggering
      # by within-wave slot keeps the delay bounded; WAVE_SIZE must mirror max-parallel above.
      BENCH_CELL_INDEX: ${{ strategy.job-index }}
      BENCH_STAGGER_STEP_SEC: '7'
      BENCH_STAGGER_WAVE_SIZE: '5' # keep in sync with strategy.max-parallel above
      # One shared browser cache dir so the agent phase (step 2, whose shell inherits
      # this job env) and the verifier (step 3) resolve chromium from the same path. Under the
      # workspace to stay on the checkout's volume.
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers
      # Single source of truth for the per-command log path: 2-agent-run.ts honours a pre-set
      # BENCH_CMD_LOG (else derives it beside TRACE), and the trace-upload step references the same
      # env — so the writer and the uploader can't drift if the path ever changes.
      BENCH_CMD_LOG: /tmp/commands.jsonl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # cache: npm so the per-cell root `npm ci` restores from the Actions cache.
          node-version-file: '.nvmrc'
          cache: npm

      # AGENT-SHELL ISOLATION (issue #184): every agent-controlled process (builder + judge shells,
      # the app step 3 builds/serves/tests) runs as an unprivileged user (benchagent) via
      # sudo+runuser, so it can't signal the harness or read its credential-bearing environ
      # (cross-uid). A distinct uid (not a PID namespace) lets a setsid dev server persist across bash
      # calls. Create the user here; the workspace ACL and runner-temp lockdown are applied and
      # verified at runtime (lib/isolation.mjs). If it fails, the cell's agent phases refuse to run
      # (harness_error) — there is no same-uid fallback in CI.
      - name: Create isolation user (agent-shell isolation)
        continue-on-error: true
        run: |
          sudo useradd -m benchagent 2>/dev/null || true
          if sudo -n runuser -u benchagent -- true 2>/dev/null; then
            echo "benchagent + passwordless sudo+runuser: AVAILABLE (agent-shell isolation will be ACTIVE)"
          else
            echo "benchagent + passwordless sudo+runuser: UNAVAILABLE (agent phases will refuse to run: harness_error)"
          fi

      # The runner user has passwordless sudo (that is how it enters benchagent via runuser);
      # benchagent must have none, or any agent command could become root and the uid isolation
      # would be nominal. Not continue-on-error: fail the job rather than run an uncontained agent.
      - name: Verify isolation user cannot sudo
        run: |
          # `sudo -n -l` also catches a passwordless rule narrowed to specific commands.
          if sudo -n runuser -u benchagent -- sudo -n true 2>/dev/null ||
             sudo -n runuser -u benchagent -- sudo -n -l >/dev/null 2>&1; then
            echo "::error::benchagent can run sudo, so the agent shell is not contained"
            exit 1
          fi
          echo "benchagent holds no sudo rights"

      - id: npmci
        run: npm ci
        continue-on-error: true

      # GREEN-REGARDLESS: every fallible cell step is continue-on-error so a cell never reds the PR
      # check; the explicit `if: steps.<prev>.outcome == 'success'` chain stops at the first failure.
      # A timed-out agent surfaces as a NON-SUCCESS outcome (skips steps 3-4) so it scores composite 0
      # — that invariant is load-bearing; never let a timed-out agent surface as 'success'.
      # Write a baseline result.json BEFORE OIDC so even an OIDC failure yields a summary-table row.
      - name: 0. Init result
        id: initresult
        continue-on-error: true
        if: steps.npmci.outcome == 'success'
        run: node scripts/agent-bench/steps/0-init-result.mjs
        env:
          RESULT_PATH: /tmp/result.json

      - name: Configure AWS credentials (OIDC)
        id: oidc
        continue-on-error: true
        if: steps.initresult.outcome == 'success'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.BENCH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          # Extend the OIDC session past the ~1h default so it survives slow cells (AWS clamps
          # to the role's max if lower).
          role-duration-seconds: 7200
          # LEAST PRIVILEGE (canonical explanation): the effective session permissions are the
          # INTERSECTION of the role's policy and this inline policy, so this narrows the initial
          # session to Bedrock model-invocation ONLY — steps 1→4b (agent, judge, per-cell analysis) run
          # with no s3:PutObject. It cannot widen the role, so the BENCH_ROLE_ARN role itself and the
          # later steps that re-assume it are untouched. The
          # allow-list is exactly the model-invocation actions with a verified call site: the Strands
          # `BedrockModel` (builder/judge stream — see the ModelStreamUpdateEvent hook in 2-agent-run.ts
          # and 4-judge.ts) calls `bedrock:InvokeModelWithResponseStream`, and the CLI
          # `bedrock-runtime converse` analysis (analysis.mjs bedrockConverse) calls `bedrock:Converse`.
          # Non-streaming `InvokeModel` and `ConverseStream` are intentionally omitted — no path uses
          # them. (Earlier this list omitted the Invoke* actions on the false assumption that the SDK
          # used ConverseStream — that is what 403'd every cell. NOTE: this is the SESSION half only;
          # the role's own identity policy must ALSO grant these actions or the intersection is still
          # empty.) Resources stay on model-invocation ARNs (inference-profile + foundation-model),
          # robust to the us.* geo profile's cross-region routing and a BENCH_MODEL override. "Persist
          # to S3" re-assumes the same role below WITHOUT this policy to regain the s3 write for that
          # step.
          inline-session-policy: >-
            {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Sid": "BedrockInvokeOnly",
                  "Effect": "Allow",
                  "Action": [
                    "bedrock:InvokeModelWithResponseStream",
                    "bedrock:Converse"
                  ],
                  "Resource": [
                    "arn:aws:bedrock:*:*:inference-profile/*",
                    "arn:aws:bedrock:*:*:application-inference-profile/*",
                    "arn:aws:bedrock:*::foundation-model/*"
                  ]
                }
              ]
            }

      # BUILD-ONCE: pull the dist-registry/ build-blocks packed so "1. Init bench-app" can skip the
      # ~150s monorepo build. Best-effort: a download blip never reds the cell (init rebuilds it).
      # Gated on initresult (not oidc): download-artifact uses no AWS, so an OIDC failure must not
      # skip it — the packed registry is still worth pulling regardless of the AWS session.
      - name: 1a. Download prebuilt dist-registry
        continue-on-error: true
        if: steps.initresult.outcome == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-registry
          path: dist-registry/

      - name: 1. Init bench-app
        id: init
        continue-on-error: true
        if: steps.oidc.outcome == 'success'
        run: bash scripts/agent-bench/steps/1-init-bench-app.sh "$TEMPLATE"
        env:
          BLOCKS_TELEMETRY_CANARY_ID: ${{ secrets.BLOCKS_TELEMETRY_CANARY_ID }}

      # Provision the browser once, before the agent phase — step 2 used to run with
      # no chromium, so the agent wasted turns hunting for one. `--with-deps` pulls the OS libs;
      # version-pinned to the verifier's PW_VERSION (1.60.0). Then wrap the system chromium so every
      # launch (the agent's ad-hoc CDP sessions included) starts cleanly instead of aborting on
      # crashpad. Best-effort (continue-on-error): a blip must not red the cell — step 3's guarded
      # fallback covers the install, and an unwrapped chromium still runs, just less reliably.
      # The install retries an attempt that prints nothing for 8 min (a stalled apt mirror) and
      # gives up after 23 min in all; timeout-minutes is the backstop. See scripts/ci/install-playwright.mjs.
      # That cap counts against the job's 85 min (see the note on timeout-minutes above).
      - name: Provision Playwright chromium (before agent phase)
        id: pwprovision
        continue-on-error: true
        if: steps.init.outcome == 'success'
        timeout-minutes: 25
        run: |
          node scripts/ci/install-playwright.mjs --package playwright@1.60.0 chromium
          # sudo env_reset strips job-level env, so pass PLAYWRIGHT_BROWSERS_PATH through explicitly —
          # the shim wraps the Playwright-installed chromium under it, which is the binary reliably
          # present on a stock runner (npx install above runs unprivileged and writes it there).
          # The wrapper is root-owned by design (the shim also wraps system-PATH binaries that need
          # root).
          sudo PLAYWRIGHT_BROWSERS_PATH="$PLAYWRIGHT_BROWSERS_PATH" bash scripts/agent-bench/steps/install-chromium-shim.sh
          # The agent phase (step 2) runs as a DIFFERENT unprivileged user (benchagent) than the user
          # that populated $PLAYWRIGHT_BROWSERS_PATH above, so the browser cache dir is not owned by the
          # agent. If the agent then runs `npx playwright install` (it does, defensively), it fails to
          # take the install lock (`.pw-browsers/__dirlock`) with EACCES and falls back to hunting for a
          # chromium binary — the exact churn this pre-provision exists to remove. Make the cache dir
          # writable by whatever user the agent phase runs as so that fallback is a true no-op. It is a
          # throwaway per-cell browser cache under the workspace, so loosening its perms is harmless.
          # NOTE: this recursion deliberately also makes the root-owned shim wrapper (and its moved-aside
          # <file>.real) agent-writable — the shim comment calls those "root-owned by design", and after
          # this line they are not tamper-proof by the agent. Accepted in this isolation model: the
          # wrapper is only ever launched as the unprivileged benchagent (never with elevated privilege),
          # and the whole cache is a throwaway dir on an ephemeral single-cell runner, so there is no
          # escalation path. The recursion (not a lock-file-scoped chmod) is intentional so a future
          # Playwright layout change can't reintroduce the EACCES this fixes.
          chmod -R a+rwX "$PLAYWRIGHT_BROWSERS_PATH" 2>/dev/null || sudo chmod -R a+rwX "$PLAYWRIGHT_BROWSERS_PATH" 2>/dev/null || true

      # SECURITY: this step runs an LLM agent with a shell. Its commands run as the unprivileged
      # benchagent user with a credential-free env (fail closed under CI: no benchagent, no agent run),
      # behind a locked runner temp dir, and are reaped at the end; the job's AWS session is also
      # narrowed to Bedrock-only by the OIDC step's inline session policy. Same-repo guard in
      # pr-agent-bench.yml (fork PRs get no secrets/OIDC). See README "Security" for the boundary.
      - name: 2. Agent run
        id: agent
        continue-on-error: true
        if: steps.init.outcome == 'success'
        timeout-minutes: 35
        run: npx tsx scripts/agent-bench/steps/2-agent-run.ts
        env:
          TASK_PROMPT: ${{ github.workspace }}/tasks/${{ env.TASK }}/PROMPT.md
          OUTPUT: /tmp/builder-result.json
          # Trace tree + run metrics, uploaded as bench-trace-*. Written only on normal completion
          # (no mid-run trace accessor), so a wall-clock timeout emits no trace.
          TRACE: /tmp/trace.json
          METRICS: /tmp/metrics.json

      - name: 3. Build and test
        id: tests
        continue-on-error: true
        if: steps.agent.outcome == 'success'
        timeout-minutes: 12
        run: bash scripts/agent-bench/steps/3-build-and-test.sh
        env:
          TASK_DIR: ${{ github.workspace }}/tasks/${{ env.TASK }}

      - name: 4. Judge
        id: judge
        continue-on-error: true
        if: steps.tests.outcome == 'success'
        # 20-min cap: the judge's Bedrock calls now retry with backoff, so the step needs room
        # for a few escalating retries on top of a single grade.
        timeout-minutes: 20
        run: |
          echo "[judge][diag] reached: before-freeze"
          if [ "$BENCH_DIAG_JUDGE_STOP" = before-freeze ]; then echo "[judge][diag] stopping at before-freeze"; exit 0; fi
          # Freeze the workspace read-only so the judge can't mutate the app it grades. Isolated
          # files are benchagent-owned, so freeze via sudo (covers both owners); never abort grading.
          sudo -n chmod -R a-w "$WORKSPACE" 2>/dev/null || chmod -R a-w "$WORKSPACE" || true
          npx tsx scripts/agent-bench/steps/4-judge.ts
        env:
          # DIAGNOSTIC (temporary, not for merge): where this cell's judge stops (see 4-judge.ts).
          BENCH_DIAG_JUDGE_STOP: ${{ matrix.judge_stop }}
          # none: no bash tool. no-group-kill: skip run-shell's group kill. ulimit: cap each command's
          # processes + memory. Any value (echo: nothing else) also echoes each command (run-shell.ts).
          BENCH_DIAG_JUDGE_BASH: ${{ matrix.judge_bash }}
          BUILDER_RESULT: /tmp/builder-result.json
          TASK_PROMPT: ${{ github.workspace }}/tasks/${{ env.TASK }}/PROMPT.md
          OUTPUT: /tmp/result.json
          # EVIDENCE = objective signals for the judge's hard caps. Boolean flags are QUOTED so a
          # non-true/false value can't break the JSON; build_status is the tri-state (na|ok|failed)
          # the build cap keys off ("na" = no build script, not capped). Counts stay bare numbers.
          EVIDENCE: |
            {
              "build_succeeded": "${{ steps.tests.outputs.build_succeeded || 'false' }}",
              "build_status": "${{ steps.tests.outputs.build_status || 'failed' }}",
              "dev_server_started": "${{ steps.tests.outputs.dev_server_started || 'false' }}",
              "playwright_installed": "${{ steps.tests.outputs.playwright_installed || 'false' }}",
              "tests_passed": ${{ steps.tests.outputs.tests_passed || '0' }},
              "tests_failed": ${{ steps.tests.outputs.tests_failed || '0' }},
              "tests_total": ${{ steps.tests.outputs.tests_total || '0' }}
            }

      # Stamp final status on result.json — always runs so failed cells get a summary-table row too.
      - name: Finalize result
        if: always()
        continue-on-error: true
        run: node scripts/agent-bench/steps/finalize-result.mjs
        env:
          RESULT_PATH: /tmp/result.json
          # On a wall-clock agent timeout, steps 3-4 are skipped and only this if:always() step
          # survives, so it folds the builder's partial envelope. Path matches step 2's OUTPUT.
          BUILDER_RESULT: /tmp/builder-result.json
          OUTCOME_OIDC: ${{ steps.oidc.outcome }}
          OUTCOME_INIT: ${{ steps.init.outcome }}
          OUTCOME_AGENT: ${{ steps.agent.outcome }}
          OUTCOME_TESTS: ${{ steps.tests.outcome }}
          OUTCOME_JUDGE: ${{ steps.judge.outcome }}

      # PER-CELL ANALYSIS: reads this cell's result.json + trace + metrics and asks the judge model
      # for a 2-4 sentence analysis, written back into result.json as `analysis` (rolled up by the
      # summary job). Best-effort + isolated: only ADDS the field, never touches the score or reds
      # the cell. Runs before the uploads so the analysis is included.
      - name: 4b. Analyze cell (best-effort)
        if: always()
        continue-on-error: true
        timeout-minutes: 20
        run: node scripts/agent-bench/steps/analyze-cell.mjs
        env:
          RESULT_PATH: /tmp/result.json
          TRACE: /tmp/trace.json
          METRICS: /tmp/metrics.json
          # Deep-failure evidence, staged to stable /tmp paths by step "3. Build and test". Missing files
          # degrade to null in analyze-cell.mjs (the deep pass simply has less to work with).
          PW_RESULTS: /tmp/pw-results.json
          DEV_LOG: /tmp/dev.log
          BUILD_LOG: /tmp/build.log
          # BENCH_JUDGE_MODEL and AWS_REGION are inherited from the job-level env.

      # Build the ONLY copy that gets published: reap every benchagent process (fail closed), then
      # stage + redact result, trace, metrics, command log and the generated source into a runner-only
      # dir (no symlinks, binaries, oversized/unreadable files or credential-bearing names). The
      # uploads, the S3 re-assume and the persist below run only if this succeeded. See README "Security".
      - name: 4c. Stage artifacts (reap + redact)
        id: stage
        if: always()
        continue-on-error: true
        timeout-minutes: 10
        run: node scripts/agent-bench/steps/stage-artifacts.mjs
        env:
          STAGE_DIR: ${{ runner.temp }}/bench-stage
          RESULT_PATH: /tmp/result.json
          TRACE: /tmp/trace.json
          METRICS: /tmp/metrics.json
          # WORKSPACE and BENCH_CMD_LOG are inherited from the job-level env.

      - name: 5. Upload result
        if: always() && steps.stage.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-result-${{ matrix.task }}-${{ matrix.template }}
          path: ${{ runner.temp }}/bench-stage/result/result.json
          retention-days: 90
          overwrite: true
          # No file to upload if npm ci fails before 0-init writes result.json — ignore.
          if-no-files-found: ignore

      # Archive the agent's generated source for post-run audit, from the staged copy (deps/build
      # output, VCS, the Blocks sandbox and anything credential-shaped were never staged).
      - name: 6. Upload source
        if: always() && steps.stage.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-source-${{ matrix.task }}-${{ matrix.template }}
          path: ${{ runner.temp }}/bench-stage/source
          retention-days: 90
          overwrite: true
          if-no-files-found: ignore

      # Archive the agent's full trace + run metrics (step 2) for post-hoc inspection. A wall-clock
      # timeout writes no trace, so this simply finds no file.
      - name: 6b. Upload trace
        if: always() && steps.stage.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-trace-${{ matrix.task }}-${{ matrix.template }}
          path: ${{ runner.temp }}/bench-stage/trace
          retention-days: 90
          overwrite: true
          if-no-files-found: ignore

      # LEAST PRIVILEGE: re-assume the SAME role WITHOUT an inline session policy so only
      # this persist step regains s3:PutObject on bench/*. Runs after the shell-capable agent step, so
      # the s3 write is never live while the agent is. Best-effort: a re-assume failure just leaves the
      # (Bedrock-only) session in place and the persist below degrades gracefully — never reds a cell.
      # `!cancelled()` (not always()): on a cancelled run we deliberately do NOT re-widen the session,
      # so a cancellation can never leave an S3-capable session active for a later step; it still runs
      # on job failure so a failed cell can persist its partial result.json. No role-duration-seconds:
      # unlike the initial assume (which must span the whole ~85min cell), this session is taken at the
      # end and only needs to outlive the ~3min best-effort upload, so the ~1h default is ample.
      - name: Re-assume role for S3 persist (drop Bedrock-only session policy)
        id: oidc_s3
        if: ${{ !cancelled() && steps.stage.outcome == 'success' }}
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.BENCH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Archive the raw per-cell result under a COMMIT-keyed prefix; the summary job builds the
      # aggregate + baseline from these.
      - name: Persist to S3 (best-effort)
        if: always() && steps.stage.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 3
        env:
          BENCH_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BUCKET: ${{ vars.BENCH_BUCKET }}
          # Surface (don't swallow) a silent archival gap: if the re-assume above failed, the session
          # is still Bedrock-only and this upload will AccessDenied. That never reds the cell (the PR
          # summary aggregates from GitHub artifacts, not S3), but it drops this cell's commit-keyed
          # baseline entry — annotate it so a missing historical row isn't later read as "no results".
          OIDC_S3_OUTCOME: ${{ steps.oidc_s3.outcome }}
        run: |
          if [ "${OIDC_S3_OUTCOME}" != "success" ]; then
            echo "::warning title=Bench S3 archive skipped::S3 re-assume outcome='${OIDC_S3_OUTCOME}' (not success); the Bedrock-only session is still active so this cell's baseline archive will likely fail — historical baseline entry for ${TASK}-${TEMPLATE} may be missing."
          fi
          KEY="bench/runs/${BENCH_SHA}/cells/${TASK}-${TEMPLATE}.json"
          bash scripts/agent-bench/steps/lib/s3-put.sh "${RUNNER_TEMP}/bench-stage/result/result.json" "s3://${BUCKET}/$KEY" "cell archive"

  summary:
    needs: [bench, build-blocks]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # id-token: OIDC -> S3 to read/write the baseline. pull-requests: write posts the scoreboard as a
    # sticky PR comment (in addition to the Actions run summary) so the delta is visible on the PR.
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    # `agent-bench` env holds BENCH_ROLE_ARN / BENCH_BUCKET, needed to read + write the S3 baseline.
    environment: agent-bench
    # Defense-in-depth same-repo gate (caller already gates). always() so the table renders even
    # when bench cells fail.
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       github.event_name == 'push' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      # Checkout first — it would wipe the workspace if it ran after the artifact download.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          sparse-checkout: scripts/agent-bench
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: '.nvmrc' }
      # Each result.json already carries its per-cell `analysis`, so the roll-up consumes these
      # directly — no re-download of bench-trace-* needed.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { path: results, pattern: bench-result-* }

      # OIDC for S3 (read/write the baseline). Best-effort: a creds failure degrades the overview
      # to "no baseline" and skips the persist — never reds the summary job.
      - name: Configure AWS credentials (OIDC)
        id: oidc
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.BENCH_ROLE_ARN }}
          aws-region: us-east-1

      # Fetch the baseline aggregate the overview diffs against. Best-effort (a miss => "no baseline").
      #   - PR / manual dispatch → the latest-main pointer (current main tip), never the PR's
      #     recorded base.sha (which goes stale as main advances).
      #   - push to main → the immediately preceding main commit (github.event.before) by exact sha,
      #     falling back to the latest-main pointer.
      - name: Fetch baseline from S3 (best-effort)
        id: baseline
        if: steps.oidc.outcome == 'success'
        continue-on-error: true
        env:
          BUCKET: ${{ vars.BENCH_BUCKET }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASELINE_PATH: ${{ github.workspace }}/baseline.json
        run: |
          set -u
          if [ "$EVENT_NAME" = "push" ]; then
            if [ -n "${BEFORE_SHA:-}" ] \
               && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] \
               && aws s3 cp "s3://${BUCKET}/bench/runs/${BEFORE_SHA}/results.json" "$BASELINE_PATH" 2>/dev/null; then
              echo "baseline: previous main commit ${BEFORE_SHA} (exact)"
            elif aws s3 cp "s3://${BUCKET}/bench/runs/latest-main.json" "$BASELINE_PATH" 2>/dev/null; then
              echo "baseline: latest-main pointer (previous main bench)"
            else
              echo "baseline: none found — overview will show absolute numbers"
              rm -f "$BASELINE_PATH"
            fi
          else
            if aws s3 cp "s3://${BUCKET}/bench/runs/latest-main.json" "$BASELINE_PATH" 2>/dev/null; then
              echo "baseline: latest-main (current main tip)"
            else
              echo "baseline: none found (latest-main) — overview will show absolute numbers"
              rm -f "$BASELINE_PATH"
            fi
          fi

      # The ONLY step intentionally not green-regardless: summary.mjs fails the job when an enabled
      # merge gate is unmet (floor / regression-vs-main / harness-errors — see lib/gates.mjs), or if
      # summary.mjs itself crashes. Each gate is opt-in via its env var below; all unset => observational.
      - name: Render summary table
        timeout-minutes: 5
        run: node scripts/agent-bench/steps/summary.mjs
        env:
          RESULTS_DIR: results
          # ── Merge gates (all opt-in; unset => observational, exits 0) ──
          # 1. Absolute floor: fail when the scored-cell mean composite is below this.
          BENCH_MIN_SCORE: ${{ vars.BENCH_MIN_SCORE }}
          # 2. Regression vs main: fail when the mean composite drops more than this many points vs the
          #    main baseline. No baseline (first run) => not evaluated.
          BENCH_MAX_REGRESSION: ${{ vars.BENCH_MAX_REGRESSION }}
          # 3. Harness/infra failures: fail when more than this many cells are harness_error (a broken
          #    measurement, distinct from a low agent score). Set to 0 to block on ANY infra failure.
          BENCH_MAX_HARNESS_ERRORS: ${{ vars.BENCH_MAX_HARNESS_ERRORS }}
          # PR-vs-baseline overview inputs (all optional; summary.mjs degrades gracefully):
          BENCH_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BENCH_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BENCH_EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number || 'manual' }}
          # Baseline the fetch step wrote (absent => "no baseline").
          BASELINE_PATH: ${{ github.workspace }}/baseline.json
          # summary.mjs writes the compact aggregate here; the persist step uploads it as the baseline.
          AGGREGATE_PATH: ${{ github.workspace }}/bench-aggregate.json
          # summary.mjs writes one NDJSON line per scored cell here; persisted to the Athena prefix.
          ATHENA_NDJSON_PATH: ${{ github.workspace }}/bench-athena.ndjson
          # summary.mjs also writes the rendered report here so the next step can post it as a PR
          # comment. Written BEFORE the gate can exit 1, so a blocking run still comments.
          # Exported ONLY on pull_request: the comment step below runs only on PRs, so on a push-to-main
          # run there is no consumer — leaving it unset makes summary.mjs skip the write instead of
          # leaving a dead temp file. summary.mjs already no-ops when the env var is absent.
          COMMENT_MD_PATH: ${{ github.event_name == 'pull_request' && format('{0}/bench-comment.md', github.workspace) || '' }}
          # The upstream job results, passed by the workflow (success | failure | cancelled | skipped).
          # Lets the harness gate red the check when the matrix produced ZERO artifacts because an
          # upstream job did not succeed. BENCH_BUILD_RESULT is load-bearing: `bench` has
          # `needs: build-blocks` with no `if:`, so a build-blocks FAILURE makes GitHub SKIP bench and
          # needs.bench.result is 'skipped' not 'failure' — the build result is the only signal that the
          # skip was a failure (the path allowlist gates the whole workflow at the caller, so bench is
          # never skipped by a per-cell path filter mid-run).
          BENCH_JOB_RESULT: ${{ needs.bench.result }}
          BENCH_BUILD_RESULT: ${{ needs.build-blocks.result }}

      # Post the SAME report as a single sticky PR comment (upsert by marker), so the PR-vs-main delta
      # is visible on the PR itself — not only in the Actions run summary. Only on a same-repo PR (a
      # fork PR has no token to comment with; push-to-main has no PR). if: always() so a BLOCKING run
      # (summary.mjs exited 1) still posts the verdict that explains the red check.
      - name: Comment bench report on PR (sticky)
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BODY_FILE: ${{ github.workspace }}/bench-comment.md
        run: bash scripts/agent-bench/steps/lib/pr-comment.sh

      # Best-effort, isolated top-level roll-up: synthesizes an executive summary from each cell's
      # `analysis` via one Bedrock call and appends it to the step summary. Never reds the job.
      - name: Roll up per-cell analyses (best-effort)
        if: always()
        continue-on-error: true
        timeout-minutes: 8
        run: node scripts/agent-bench/steps/analyze.mjs
        env:
          RESULTS_DIR: results
          BASELINE_PATH: ${{ github.workspace }}/baseline.json
          ANALYSIS_PATH: ${{ github.workspace }}/bench-analysis.json
          # Same judge model as 4-judge.ts / the per-cell analysis.
          BENCH_JUDGE_MODEL: us.anthropic.claude-opus-4-8
          AWS_REGION: us-east-1

      - name: Upload analysis (best-effort)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-analysis
          path: ${{ github.workspace }}/bench-analysis.json
          if-no-files-found: ignore
          retention-days: 90
          overwrite: true

      # Persist this run's aggregate as the COMMIT-keyed baseline (and update the latest-main pointer
      # on push-to-main). Best-effort: never reds the summary job.
      - name: Persist baseline to S3 (best-effort)
        if: always() && steps.oidc.outcome == 'success'
        env:
          BUCKET: ${{ vars.BENCH_BUCKET }}
          BENCH_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          AGG: ${{ github.workspace }}/bench-aggregate.json
        run: |
          set -u
          bash scripts/agent-bench/steps/lib/s3-put.sh "$AGG" "s3://${BUCKET}/bench/runs/${BENCH_SHA}/results.json" "aggregate"
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            bash scripts/agent-bench/steps/lib/s3-put.sh "$AGG" "s3://${BUCKET}/bench/runs/latest-main.json" "latest-main pointer"
          fi

      # Persist the Athena NDJSON to a date-partitioned prefix so bench history is Athena-queryable.
      # Existing bench/* IAM covers it. Best-effort: never reds the job.
      - name: Persist Athena NDJSON to S3 (best-effort)
        if: always() && steps.oidc.outcome == 'success'
        env:
          BUCKET: ${{ vars.BENCH_BUCKET }}
          BENCH_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          NDJSON: ${{ github.workspace }}/bench-athena.ndjson
        run: |
          set -u
          YEAR="$(date -u +%Y)"
          MONTH="$(date -u +%m)"
          SHA_SHORT="${BENCH_SHA:0:12}"
          KEY="bench/athena/year=${YEAR}/month=${MONTH}/${SHA_SHORT}.json"
          bash scripts/agent-bench/steps/lib/s3-put.sh "$NDJSON" "s3://${BUCKET}/${KEY}" "Athena NDJSON"

  # Bench harness SELF-CHECK: tsc + unit-test the bench's own code via test:ci. Lives here (not the
  # repo-wide test:unit fan-out) so a bench-only issue reds THIS workflow, not the main Unit Tests
  # gate. Runs once per bench run, no AWS/OIDC.
  selfcheck:
    name: bench self-check (tsc + unit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      # Same isolation-user creation as the bench job. Free (no Bedrock/OIDC); its unit suite runs
      # the isolation tests against the real runner (benchagent containment, runner-temp lockdown,
      # unreadable harness environ, fail-closed refusal). Under CI those tests fail, not skip, if the
      # user can't be created.
      - name: Create isolation user (agent-shell isolation)
        continue-on-error: true
        run: |
          sudo useradd -m benchagent 2>/dev/null || true
          if sudo -n runuser -u benchagent -- true 2>/dev/null; then
            echo "benchagent + passwordless sudo+runuser: AVAILABLE (isolation tests will run)"
          else
            echo "benchagent + passwordless sudo+runuser: UNAVAILABLE (the credential-boundary tests will fail)"
          fi
      # The runner user has passwordless sudo (that is how it enters benchagent via runuser);
      # benchagent must have none, or any agent command could become root and the uid isolation
      # would be nominal. Not continue-on-error: fail the job rather than run an uncontained agent.
      - name: Verify isolation user cannot sudo
        run: |
          # `sudo -n -l` also catches a passwordless rule narrowed to specific commands.
          if sudo -n runuser -u benchagent -- sudo -n true 2>/dev/null ||
             sudo -n runuser -u benchagent -- sudo -n -l >/dev/null 2>&1; then
            echo "::error::benchagent can run sudo, so the agent shell is not contained"
            exit 1
          fi
          echo "benchagent holds no sudo rights"
      - run: npm ci
      - name: Type-check + unit-test the bench harness
        run: npm run test:ci -w scripts/agent-bench
