name: Native SDK Swift

on:
  pull_request:
    branches: [main]
    paths:
      - 'native/swift/**'
      # The golden tests and the fixture-goldens job read the shared codegen fixtures.
      - 'native/codegen-fixtures/**'
      - '.github/workflows/native-sdk-swift.yml'
  workflow_dispatch:

concurrency:
  group: native-swift-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version-constant:
    name: Version constant is current
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Check Swift version constant matches package.json
        run: native/swift/scripts/generate-version.sh --check

      - name: Test the Swift scripts
        run: |
          for test in native/swift/scripts/*.test.sh; do
            # Needs macOS (xcrun swiftc); runs in the fixture-goldens job.
            [ "$(basename "$test")" = compile-fixture-goldens.test.sh ] && continue
            echo "== $test =="
            bash "$test"
          done

  fixture-goldens:
    name: Fixture goldens compile
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Test the compile script
        run: bash native/swift/scripts/compile-fixture-goldens.test.sh

      # The golden tests only compare text, so a golden that doesn't compile still passes them.
      - name: Compile every fixture's Swift golden as its own module (fails on errors)
        run: bash native/swift/scripts/compile-fixture-goldens.sh

  build-and-test-macos:
    name: Build & Test (macOS)
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: native/swift
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Build
        run: swift build

      - name: Run unit tests
        run: swift test --filter "BlocksCodegenTests|BlocksRuntimeTests"

  build-and-test-ios:
    name: Build & Test (iOS)
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: native/swift
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Build for iOS
        run: xcodebuild build -scheme aws-blocks-swift-Package -destination 'platform=iOS Simulator,name=iPhone 16'

      - name: Run unit tests on iOS
        run: xcodebuild test -scheme aws-blocks-swift-Package -destination 'platform=iOS Simulator,name=iPhone 16' -only-testing BlocksCodegenTests -only-testing BlocksRuntimeTests

  swiftlint:
    name: SwiftLint
    runs-on: macos-15
    timeout-minutes: 10
    defaults:
      run:
        working-directory: native/swift
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint --reporter github-actions-logging

  swiftformat:
    name: SwiftFormat
    runs-on: macos-15
    timeout-minutes: 10
    defaults:
      run:
        working-directory: native/swift
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install SwiftFormat
        run: brew install swiftformat

      - name: Check formatting
        run: swiftformat --lint .
