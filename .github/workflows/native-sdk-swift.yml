name: Native SDK Swift

on:
  pull_request:
    branches: [main]
    paths:
      - 'native/swift/**'
      - 'native/codegen-fixtures/**'
      - '.github/workflows/native-sdk-swift.yml'
  workflow_dispatch:

concurrency:
  group: native-swift-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version-constant:
    name: Version constant is current
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      - name: Check Swift version constant matches package.json
        run: native/swift/scripts/generate-version.sh --check

      - name: Test the Swift scripts
        run: |
          for test in native/swift/scripts/*.test.sh; do
            # codegen-config.test.sh needs a Swift toolchain, so it runs in the macOS job.
            if [[ "$test" == */codegen-config.test.sh ]]; then continue; fi
            echo "== $test =="
            bash "$test"
          done

  build-and-test-macos:
    name: Build & Test (macOS)
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: native/swift
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Build
        run: swift build

      - name: Run unit tests
        run: swift test --filter "BlocksCodegenTests|BlocksRuntimeTests|BlocksGeneratedCodeTests|BlocksGeneratedMainActorTests"

      - name: Test the codegen configuration surface
        run: scripts/codegen-config.test.sh

  build-and-test-ios:
    name: Build & Test (iOS)
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: native/swift
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Pick an available iOS simulator
        uses: ./.github/actions/pick-ios-simulator

      - name: Build for iOS
        run: xcodebuild build -scheme aws-blocks-swift-Package -destination "platform=iOS Simulator,id=$SIM_UDID"

      - name: Run unit tests on iOS
        run: xcodebuild test -scheme aws-blocks-swift-Package -destination "platform=iOS Simulator,id=$SIM_UDID" -only-testing BlocksCodegenTests -only-testing BlocksRuntimeTests

  swiftlint:
    name: SwiftLint
    runs-on: macos-15
    timeout-minutes: 10
    defaults:
      run:
        working-directory: native/swift
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint --reporter github-actions-logging

  swiftformat:
    name: SwiftFormat
    runs-on: macos-15
    timeout-minutes: 10
    defaults:
      run:
        working-directory: native/swift
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install SwiftFormat
        run: brew install swiftformat

      - name: Check formatting
        run: swiftformat --lint .
