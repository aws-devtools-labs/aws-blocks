name: PR Checks

# The build, unit test and local E2E jobs of a PR. The E2E jobs that deploy
# to AWS run in pr-e2e.yml, pr-e2e-hosting.yml and pr-e2e-compute.yml, each a
# workflow of its own so a failed job can be re-run as soon as its run
# finishes. The notes below on the trigger, the checkout and the concurrency
# group hold for all four.
#
# Originally used pull_request_target so fork PRs get secrets and OIDC access.
# Workflow YAML is always sourced from the default branch (main) with that
# trigger, so checkout steps referenced the PR head SHA.
#
# Security: this is a private repo. Gate 1 (Settings → Actions → General)
# requires approval for fork PRs from users without write access.
#
# Switched to `pull_request` so PRs can test their own workflow changes.
# E2E jobs additionally check github.event.pull_request.head.repo.full_name
# to skip for fork PRs (defense in depth — pull_request already blocks secrets).
# TODO: Verify with AppSec before making this repo public.
#
# With `pull_request`, GitHub reads this file from the PR's merge commit
# (refs/pull/N/merge), and jobs check out that same commit (actions/checkout's
# default). A step added on main then finds the script it runs even when the
# PR branch predates it; checking out the head SHA instead failed every PR not
# rebased onto such a change. Only Detect Changes and Blocks Package Integrity
# check out the head SHA: they read the head commit itself (its E2E trailer,
# and its packed content against the base).

on:
  pull_request:
    branches: ['*']

# One run per PR. When a new commit is pushed, any still-running run for the
# same PR is cancelled. Prevents two concurrent `cdk deploy` invocations from
# racing on the same PR-scoped stack, which can leave a partial rollback
# wedged in DELETE_FAILED and block every later run until the stack is
# manually cleaned up in AWS.
concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Grant OIDC tokens only to role-assuming jobs so PR-head build jobs cannot
# mint AWS credentials.
permissions:
  contents: read

env:
  # Use the 'spec' reporter for node:test — produces a clean, hierarchical
  # pass/fail summary instead of verbose TAP output with per-test YAML blocks.
  NODE_OPTIONS: '--test-reporter=spec'

jobs:
  # Picks the E2E jobs to run. By default that is every E2E job when the PR
  # changes packages/ or test-apps/, and none otherwise. An E2E trailer on the
  # PR's head commit overrides it, so a PR that only changes CI (this workflow,
  # .github/actions/) or one E2E suite can run just the jobs it affects:
  #
  #   git commit --trailer 'E2E: all'               every E2E job
  #   git commit --trailer 'E2E: sandbox, hosting'  only these (job ids without the e2e- prefix)
  #
  # Only the head commit counts: a later commit without the trailer goes back
  # to the default. Each PR uses a fixed E2E account from the pool (PR number
  # mod the pool size, see .github/actions/e2e-slot), so parallel PRs spread
  # across it. The E2E Hosting legs spread one run over the pool too, each at
  # a fixed offset from the PR's account (see e2e-hosting).
  #
  # A job the changes call for is never skipped: if the trailer leaves it out,
  # or names an unknown job, it fails in its first step instead. E2E Sandbox
  # and E2E Production are required checks, and GitHub counts a skipped job as
  # passing, so a skip would let the trailer merge a PR past E2E. Push a
  # commit without the trailer before merging. For the same reason those two
  # also start when this job fails or is cancelled, and fail in their first step.
  #
  # E2E VPC Smoke is left out while test-apps/vpc-smoke's tests are switched
  # off (its test:e2e:sandbox script only echoes), since it would test nothing.
  #
  # The logic lives in scripts/ci/e2e-selection.sh, tested by
  # scripts/ci/e2e-selection.test.mjs (in Local Build and Checks).
  # scripts/ci/required-checks.test.mjs checks that no required check passes
  # when a job it depends on fails or is cancelled.
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      # E2E account for this PR (see .github/actions/e2e-slot).
      e2e-index: ${{ steps.e2e-slot.outputs.index }}
      # JSON array of the E2E jobs to run, e.g. ["sandbox","hosting"]
      e2e: ${{ steps.check.outputs.e2e }}
      # JSON array of the E2E jobs the changes call for but the trailer left
      # out. Each fails in its first step.
      e2e-blocked: ${{ steps.check.outputs.blocked }}
      # e2e + e2e-blocked: the E2E jobs that start. Each E2E job's `if:` checks
      # this one, so a blocked job can't be skipped by checking only `e2e`.
      e2e-run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The head commit, not the merge commit: its E2E trailer counts.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - id: e2e-slot
        uses: ./.github/actions/e2e-slot
      - id: check
        env:
          E2E_ACCOUNT: ${{ steps.e2e-slot.outputs.account }}
        run: scripts/ci/e2e-selection.sh origin/main

  blocks-integrity:
    name: Blocks Package Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Packs the PR head against its base (see the step below).
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci

      - name: Sync block docs (prebuild step)
        run: node scripts/gen-block-docs.mjs

      - name: Check blocks docs-sync integrity
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          # Release PRs consume changesets — the files are already gone. Skip.
          if [[ "$GITHUB_HEAD_REF" == "changeset-release/main" ]]; then
            echo "✅ Skipping — release PR (changesets already consumed into version bumps)"
            exit 0
          fi

          # gen-block-docs.mjs regenerates packages/blocks/docs/ from sibling READMEs
          # (docs/ is gitignored, built at publish time). We compare the packed
          # aws-cdk-blocks tarball at THIS PR's head against the PR base branch —
          # like-for-like (same algo, same build state), so only a change introduced by
          # THIS PR trips the check. A PR that doesn't alter what ships needs no bump.
          # The base pack falls back to the pre-rename sync-block-docs.mjs so this job works
          # against bases from either side of the gen-block-docs.mjs rename.
          pack_blocks() {
            local dest="$1"
            node scripts/gen-block-docs.mjs >/dev/null
            # --ignore-scripts intentionally packs source + synced docs, NOT a freshly built dist/ — this diffs shipped content, not the published build.
            ( cd packages/blocks && npm pack --ignore-scripts --pack-destination "$dest" >/dev/null )
            set -- "$dest"/*.tgz
            [ $# -eq 1 ] || { echo "expected exactly one .tgz in $dest, found $#" >&2; exit 1; }
            shasum -a 512 "$1" | awk '{print $1}'
          }

          mkdir -p /tmp/head-pack
          HEAD_INTEGRITY=$(pack_blocks /tmp/head-pack)

          # BASE_SHA is present locally (checkout uses fetch-depth: 0).
          git worktree add --detach /tmp/blocks-base "$BASE_SHA" >/dev/null
          mkdir -p /tmp/base-pack
          BASE_INTEGRITY=$(
            cd /tmp/blocks-base
            node scripts/gen-block-docs.mjs >/dev/null 2>/dev/null || node scripts/sync-block-docs.mjs >/dev/null
            ( cd packages/blocks && npm pack --ignore-scripts --pack-destination /tmp/base-pack >/dev/null )
            set -- /tmp/base-pack/*.tgz
            [ $# -eq 1 ] || { echo "expected exactly one .tgz in /tmp/base-pack, found $#" >&2; exit 1; }
            shasum -a 512 "$1" | awk '{print $1}'
          )
          git worktree remove --force /tmp/blocks-base

          echo "Head packed shasum: $HEAD_INTEGRITY"
          echo "Base packed shasum: $BASE_INTEGRITY"

          # Relies on npm's reproducible packing (fixed mtimes); head & base pack on the same runner, so identical content ⇒ identical tarball hash.
          if [ "$HEAD_INTEGRITY" = "$BASE_INTEGRITY" ]; then
            echo "✅ aws-cdk-blocks packaged content is unchanged vs the base branch — no version bump required."
            exit 0
          fi

          # Content changed vs base — require a changeset that bumps aws-cdk-blocks.
          CHANGESET_BUMPS=$(find .changeset -name '*.md' ! -name 'README.md' -exec grep -l '"aws-cdk-blocks"' {} \; || true)

          if [ -n "$CHANGESET_BUMPS" ]; then
            echo "✅ Packaged content changed and a changeset already bumps aws-cdk-blocks:"
            echo "$CHANGESET_BUMPS"
            exit 0
          fi

          echo "❌ This PR changes aws-cdk-blocks packaged content (e.g. synced docs from sibling READMEs) vs the base branch, but no changeset bumps it. Add \"aws-cdk-blocks\": patch to a changeset."
          exit 1

  # Mirrors the Release job's install (publish-packages.yml): no dependency
  # install scripts, then build. Release only runs on main after the Version
  # Packages PR merges, so without this a dependency that needs its install
  # script to build would pass every PR check and block the next release.
  release-install-check:
    name: Release Install Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

  # The parts of the required "Build, Unit Tests, E2E Local" check run as
  # parallel jobs: local-build (build, checks including check:api, the
  # dist-registry artifact), local-unit and local-e2e. Each installs and
  # builds on its own.
  # build-and-test-local below passes only when all of them succeeded.
  local-build:
    name: Local Build and Checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      # Pin a fixed Blocks CLI telemetry installation ID for CI e2e runs so this
      # traffic is consistent and identifiable (and can be excluded from product
      # usage metrics).
      - uses: ./.github/actions/seed-telemetry-id

      - run: npm ci

      - name: Lint (advisory — annotations only, non-blocking)
        run: npm run lint
        continue-on-error: true

      - name: Lint deps (blocking)
        run: npm run lint:deps

      # Every tracked source file under packages/, native/ and scripts/ carries
      # the Apache-2.0 license header (exclusions listed in the script). The
      # checker's header detection, insertion and exclusions are tested first.
      - name: Test the license-header check
        run: node --test scripts/check-license-headers.test.mjs

      - name: Check license headers
        run: npm run check:headers

      - name: Build
        run: npm run build

      - name: Check aws-blocks exports consistency
        run: npm run check:exports-consistency

      # Keeps every Playwright browser install bounded (an apt hang once held a
      # Hosting job for 57 min).
      - name: Test the Playwright install wrapper
        run: node --test scripts/ci/install-playwright.test.mjs

      # The Harbor agent check and agent bench only run from main or with model credentials, so
      # their cache-scope hardening (the Harbor build container and output guard, agent bench's
      # lockfile-pinned Playwright matching PW_VERSION), the Harbor approval gate and the bounds on
      # the Harbor model credentials are checked here on every PR.
      - name: Test the benchmark workflows' cache-scope hardening, approval gate and credentials
        run: node --test scripts/ci/harbor-packages-isolation.test.mjs scripts/ci/harbor-approval-gate.test.mjs scripts/ci/harbor-credentials.test.mjs scripts/ci/agent-bench-playwright.test.mjs

      # Every BB with an aws-runtime export (and the create-block template) must
      # call assertNotMockInDeployedEnv at the top of its mock entry.
      - name: Check runtime mock-guard coverage
        run: npm run check:runtime-guard

      # The hidden `.cdk-blocks` folder is reached by separate join() calls across
      # five packages, shell steps that seed the installation id, and the
      # templates' tsconfig includes. One left on the old name still builds, lints
      # and passes its unit tests, so the guard is unit-tested first and then run.
      - name: Test the hidden-folder guard
        run: node --test scripts/dot-folder-guard.test.mjs

      - name: Check no reference to the old hidden folder remains
        run: npm run check:dot-folder

      # `.gitignore` negates test-apps/**/.cdk-blocks/** so each test app's
      # committed config.json stays tracked. Asserted in a throwaway fixture, not
      # also un-ignores the Building Block data now nested under it, which the
      # flat `.bb-data/` rule used to keep out.
      - name: Check the consolidated data directory stays git-ignored
        run: npm run check:data-ignored

      # The four mistakes this rename made more than once: a multi-segment path
      # compared against a single path segment, a LEGACY constant holding the new
      # name, and a reflow merging one documented command into the next.
      - name: Check the rename traps
        run: npm run check:rename-traps

      # The guard decides whether unattributed traffic can ship, so it is unit-tested
      # first. A regression shows up here instead of as a wrong verdict below.
      - name: Test the client user-agent guard
        run: node --test scripts/check-client-user-agent-consistency.test.mjs

      - name: Check client user-agent middleware consistency
        run: npm run check:client-user-agent

      # publish:local empties dist-registry/ before every run; this pins that the
      # reset can never delete anything outside it.
      - name: Test the local-registry reset guard
        run: npx tsx --test scripts/publish/local-registry.test.ts

      # A test app whose stacks the stale-stack sweeper can't match leaks every
      # stack whose teardown fails.
      - name: Test that cleanup-stacks.yml covers the E2E stacks
        run: node --test scripts/ci/e2e-stack-prefixes.test.mjs

      # The scheduled stack cleanup (cleanup-stacks.yml) runs this script to
      # unblock Amplify sandboxes stuck in DELETE_FAILED.
      - name: Test the stuck Amplify sandbox delete
        run: node --test scripts/ci/amplify-stuck-delete.test.mjs

      # Decides which E2E jobs run, and which a PR can't skip by leaving them
      # out of its E2E trailer.
      - name: Test the E2E job selection
        run: node --test scripts/ci/e2e-selection.test.mjs

      # Maps a PR, and each E2E Hosting leg, to its E2E account.
      - name: Test the E2E account slot
        run: node --test scripts/ci/e2e-slot.test.mjs
      # Secret values reach $GITHUB_ENV only masked, and pull request workflows
      # grant id-token: write only to the jobs that assume an AWS role.
      - name: Test workflow secret handling and OIDC scope
        run: node --test scripts/ci/workflow-secrets.test.mjs

      # No value is interpolated unescaped into a RegExp, a shell command, a
      # workflow run: script, generated Kotlin/Swift/Dart source or HTML.
      - name: Check injection sink guards
        run: node --test scripts/sink-guards/regex.test.mjs scripts/sink-guards/shell.test.mjs scripts/sink-guards/workflows.test.mjs scripts/sink-guards/codegen.test.mjs scripts/sink-guards/html.test.mjs

      # Deletes the stacks a cancelled or crashed E2E job leaves behind.
      - name: Test the E2E teardown
        run: node --test scripts/ci/e2e-teardown.test.mjs scripts/ci/e2e-stack-wait.test.mjs

      # Retries the Amplify interop sandbox delete when CloudFormation gives up
      # on a throttled resource delete.
      - name: Test the Amplify sandbox teardown
        run: node --test scripts/ci/amplify-sandbox-teardown.test.mjs

      # The stale-stack sweeper deletes Amplify sandboxes one at a time.
      - name: Test the Amplify sandbox sweep
        run: node --test scripts/ci/amplify-sweep.test.mjs

      # No required check may pass when a job it depends on fails or is
      # cancelled (GitHub counts a skipped required check as passing).
      - name: Test the required checks' failure paths
        run: node --test scripts/ci/required-checks.test.mjs

      # The Hosting delete replay (scripts/ci/hosting-teardown-replay.mjs): its
      # log parser and quota model, against fixture logs (no GitHub calls).
      - name: Test the Hosting teardown replay
        run: node --test scripts/ci/hosting-teardown-replay.test.mjs

      # The wait the hosting E2E suites run between deploy and their first test
      # (scripts/ci/hosting-ready.ts).
      - name: Test the hosting readiness wait
        run: npx tsx --test scripts/ci/hosting-ready.test.ts

      - name: Test the E2E cleanup wrapper
        run: node --test scripts/ci/e2e-cleanup.test.mjs

      # The scheduled stack cleanup (cleanup-stacks.yml): a REST API or IAM role
      # count it can't read must fail its leg, no listing failure may read as
      # "nothing to sweep", and the Cognito pool sweep deletes only orphaned
      # CI pools in an E2E account.
      - name: Test the stack cleanup's listing failures
        run: node --test scripts/ci/rest-api-quota.test.mjs scripts/ci/cleanup-listings.test.mjs scripts/ci/sweep-cognito-pools.test.mjs

      # The Windows E2E driver's teardown failure reporting and the stack tag
      # cleanup-stacks.yml needs to reclaim a stack it leaks.
      - name: Test the CI template driver helpers
        run: node --test scripts/ci/_proc.test.mjs scripts/ci/_scaffold-tag.test.mjs

      # .puppeteerrc.cjs skips Puppeteer's browser download on GitHub Actions,
      # but only for installs under the repo's own node_modules.
      - name: Test the Puppeteer download gate
        run: node --test scripts/ci/puppeteerrc.test.mjs

      # Runs on the root build output, before Unit Tests: a package `pretest` that
      # bundles an asset would otherwise hide a bundle the release build skips.
      - name: Test the packed-assets guard
        run: node --test scripts/check-packed-assets.test.mjs

      - name: Check packed Lambda assets
        run: npm run check:packed-assets

      # The Windows E2E driver's rewrite that keeps its production deploy from
      # leaking retained resources (it runs on a schedule, not on PRs).
      - name: Test the Windows E2E scaffold teardown helper
        run: node --test scripts/ci/_scaffold-teardown.test.mjs

      - name: Check API backward compatibility
        run: npm run check:api

      # The scheduled stack cleanup (cleanup-stacks.yml) deletes orphaned log groups
      # with this step; it must never delete one whose function or cluster is live.
      - name: Test the orphaned log group sweep
        run: node --test scripts/ci/sweep-log-groups.test.mjs

      # Tests the splitter the local-unit jobs use.
      - name: Test the unit test sharding
        run: node --test scripts/ci/unit-test-shard.test.mjs

      - name: Pack for local registry
        run: npm run publish:local

      - name: Upload registry artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-registry
          path: dist-registry/
          retention-days: 1

  # The unit tests of every workspace, split by scripts/ci/unit-test-shard.mjs
  # so each workspace runs in exactly one shard. The shard count is the matrix
  # length, so the matrix has no other axis (unit-test-shard.test.mjs checks).
  local-unit:
    name: Local Unit Tests (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # Let every shard finish, so a run reports all failing workspaces.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      # Pin a fixed Blocks CLI telemetry installation ID for CI e2e runs so this
      # traffic is consistent and identifiable (and can be excluded from product
      # usage metrics).
      - uses: ./.github/actions/seed-telemetry-id

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Unit Tests
        env:
          # The real-CDK stream-routing probe in packages/core guards the issue #222
          # root cause (`--ci` is what moves CloudFormation progress off stderr).
          # Require it here so a runner that cannot resolve the CDK CLI fails
          # instead of skipping, and have it drop a marker file the next step
          # checks — a probe that stops running must not read as green.
          BLOCKS_REQUIRE_CDK_PROBE: '1'
          BLOCKS_CDK_PROBE_MARKER: ${{ runner.temp }}/cdk-routing-probe.marker
          # Fail, rather than skip, the core runtime-guard e2e test when the built
          # BB it imports cannot be resolved, so a rename cannot drop it silently.
          BLOCKS_REQUIRE_RUNTIME_GUARD_E2E: '1'
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
        # npm run test:unit is npm run test --workspaces; this runs the same
        # script in this shard's workspaces.
        run: |
          set -euo pipefail
          workspaces=$(node scripts/ci/unit-test-shard.mjs "$SHARD" "$SHARDS")
          echo "Shard $SHARD of $SHARDS runs:"
          echo "$workspaces"
          args=()
          while IFS= read -r ws; do args+=(-w "$ws"); done <<<"$workspaces"
          npm run test "${args[@]}"

      - name: Verify the real-CDK stream-routing probe ran
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
        run: |
          set -euo pipefail
          # The probe is in @aws-cdk-blocks/core, which runs in one shard only. A
          # tree where no shard runs it fails here instead of passing.
          owner=0
          for i in $(seq 1 "$SHARDS"); do
            workspaces=$(node scripts/ci/unit-test-shard.mjs "$i" "$SHARDS")
            if grep -qx '@aws-cdk-blocks/core' <<<"$workspaces"; then owner=$i; fi
          done
          if [ "$owner" = 0 ]; then
            echo "::error::no unit test shard runs @aws-cdk-blocks/core, so the real-CDK stream-routing probe would not run."
            exit 1
          fi
          if [ "$owner" != "$SHARD" ]; then
            echo "@aws-cdk-blocks/core runs in shard $owner; that shard checks the probe."
            exit 0
          fi
          marker='${{ runner.temp }}/cdk-routing-probe.marker'
          if [ ! -s "$marker" ]; then
            echo "::error::the real-CDK --ci stream-routing probe did not run (no marker at $marker). It is the only test that verifies the CDK CLI still routes deploy logs to stdout under --ci and keeps failures on stderr (issue #222); a silent skip is a regression."
            exit 1
          fi
          cat "$marker"

  local-e2e:
    name: Local E2E
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      # Pin a fixed Blocks CLI telemetry installation ID for CI e2e runs so this
      # traffic is consistent and identifiable (and can be excluded from product
      # usage metrics).
      - uses: ./.github/actions/seed-telemetry-id

      - run: npm ci

      - name: Build
        run: npm run build

      # tsx runs the e2e suites without type-checking them, so a test's
      # `@ts-expect-error` (a typed-DX assertion: "this call must not
      # compile") would go unchecked. Type-check the backend, the frontend and
      # the tests together.
      - name: Type-check the comprehensive app and its e2e tests
        working-directory: test-apps/comprehensive
        run: npx tsc --noEmit -p tsconfig.json

      - name: E2E Test Local
        run: npm run test:e2e:local

  # Required check. Passes only when every local-* part succeeded: a failed,
  # cancelled or skipped part fails it, and it runs even then so it never
  # reports as skipped (GitHub counts a skipped required check as passing).
  # Keep always(), not !cancelled(): a cancelled run then fails this check
  # instead of skipping it. Jobs that need it wait for all the parts.
  build-and-test-local:
    name: Build, Unit Tests, E2E Local
    needs: [local-build, local-unit, local-e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check that every part succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          failed=0
          for part in local-build local-unit local-e2e; do
            result=$(jq -r --arg part "$part" '.[$part].result // "missing"' <<<"$NEEDS")
            echo "$part: $result"
            if [ "$result" != success ]; then failed=1; fi
          done
          if [ "$failed" != 0 ]; then
            echo "::error::Every part of Build, Unit Tests, E2E Local must succeed."
            exit 1
          fi

  e2e-templates:
    name: E2E Templates
    needs: [build-and-test-local, detect-changes]
    # Required check: see "Check that Detect Changes succeeded" below. Only
    # that branch uses always(); the run branch keeps success(), so the job
    # still skips when Build, Unit Tests, E2E Local did not pass (that check is
    # required itself) or when the run is cancelled.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      ((always() && needs.detect-changes.result != 'success') ||
       (success() && contains(fromJSON(needs.detect-changes.outputs.e2e-run), 'templates')))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Without Detect Changes' outputs the `if:` above would skip this job, and
      # a skipped required check counts as passing. E2E Sandbox and E2E
      # Production fail the same way, but in another workflow, with their own
      # Detect Changes, so they do not cover a failure of this one.
      - name: Check that Detect Changes succeeded
        if: always() && needs.detect-changes.result != 'success'
        env:
          RESULT: ${{ needs.detect-changes.result }}
        run: |
          echo "::error::Detect Changes ended $RESULT, so this run can't tell which E2E jobs this PR needs. Re-run the failed jobs."
          exit 1

      - name: Check the E2E trailer
        if: contains(fromJSON(needs.detect-changes.outputs.e2e-blocked), 'templates')
        run: |
          echo "::error::The head commit's E2E trailer leaves out this job, but this PR's changes call for it. Push a commit without the trailer before merging."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      # Pin a fixed Blocks CLI telemetry installation ID for CI e2e runs so this
      # traffic is consistent and identifiable (and can be excluded from product
      # usage metrics).
      - uses: ./.github/actions/seed-telemetry-id

      - run: npm ci

      - name: Download registry artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-registry
          path: dist-registry/

      - name: Template E2E and docs task upgrade
        run: node scripts/ci/templates-e2e.mjs --skip-publish

  # Same local template suite as e2e-templates, on Windows — the OS where
  # client-side template tooling (paths, process spawn/kill, .cmd shims, line
  # endings) diverges from POSIX. Runs the SAME cross-platform driver, so the
  # two lanes cannot drift. Local only (each template's test:e2e boots a mock
  # dev server) — no AWS, so no credentials/environment and no deploy wait. The
  # real Windows deploy smoke stays in windows-e2e.yml (scheduled).
  e2e-templates-windows:
    name: E2E Templates (Windows)
    needs: [build-and-test-local, detect-changes]
    # Required check: see "Check that Detect Changes succeeded" below. Only
    # that branch uses always(); the run branch keeps success(), so the job
    # still skips when Build, Unit Tests, E2E Local did not pass (that check is
    # required itself) or when the run is cancelled.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      ((always() && needs.detect-changes.result != 'success') ||
       (success() && contains(fromJSON(needs.detect-changes.outputs.e2e-run), 'templates-windows')))
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      # Without Detect Changes' outputs the `if:` above would skip this job, and
      # a skipped required check counts as passing. E2E Sandbox and E2E
      # Production fail the same way, but in another workflow, with their own
      # Detect Changes, so they do not cover a failure of this one.
      - name: Check that Detect Changes succeeded
        if: always() && needs.detect-changes.result != 'success'
        # $RESULT is a shell variable only in bash; the runner defaults to PowerShell.
        shell: bash
        env:
          RESULT: ${{ needs.detect-changes.result }}
        run: |
          echo "::error::Detect Changes ended $RESULT, so this run can't tell which E2E jobs this PR needs. Re-run the failed jobs."
          exit 1

      - name: Check the E2E trailer
        if: contains(fromJSON(needs.detect-changes.outputs.e2e-blocked), 'templates-windows')
        run: |
          echo "::error::The head commit's E2E trailer leaves out this job, but this PR's changes call for it. Push a commit without the trailer before merging."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      # Pin a fixed Blocks CLI telemetry installation ID for CI e2e runs so this
      # traffic is consistent and identifiable (and can be excluded from product
      # usage metrics).
      - uses: ./.github/actions/seed-telemetry-id

      - run: npm ci

      - name: Download registry artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-registry
          path: dist-registry/

      - name: Template E2E and docs task upgrade (Windows)
        run: node scripts/ci/templates-e2e.mjs --skip-publish
