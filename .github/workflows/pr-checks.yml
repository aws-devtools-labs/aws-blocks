name: PR Checks

# Originally used pull_request_target so fork PRs get secrets and OIDC access.
# Workflow YAML is always sourced from the default branch (main) with that trigger.
# All checkout steps explicitly reference the PR head SHA.
#
# Security: this is a private repo. Gate 1 (Settings → Actions → General)
# requires approval for fork PRs from users without write access.
#
# Switched to `pull_request` so PRs can test their own workflow changes.
# E2E jobs additionally check github.event.pull_request.head.repo.full_name
# to skip for fork PRs (defense in depth — pull_request already blocks secrets).
# TODO: Verify with AppSec before making this repo public.

on:
  pull_request:
    branches: ['*']

# One run per PR. When a new commit is pushed, any still-running run for the
# same PR is cancelled. Prevents two concurrent `cdk deploy` invocations from
# racing on the same PR-scoped stack, which can leave a partial rollback
# wedged in DELETE_FAILED and block every later run until the stack is
# manually cleaned up in AWS.
concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Grant OIDC tokens only to role-assuming jobs so PR-head build jobs cannot
# mint AWS credentials.
permissions:
  contents: read

env:
  # Use the 'spec' reporter for node:test — produces a clean, hierarchical
  # pass/fail summary instead of verbose TAP output with per-test YAML blocks.
  NODE_OPTIONS: '--test-reporter=spec'

jobs:
  # Picks the E2E jobs to run. By default that is every E2E job when the PR
  # changes packages/ or test-apps/, and none otherwise. An E2E trailer on the
  # PR's head commit overrides it, so a PR that only changes CI (this workflow,
  # .github/actions/) or one E2E suite can run just the jobs it affects:
  #
  #   git commit --trailer 'E2E: all'               every E2E job
  #   git commit --trailer 'E2E: sandbox, hosting'  only these (job ids without the e2e- prefix)
  #
  # Only the head commit counts: a later commit without the trailer goes back
  # to the default. Each PR uses a fixed E2E account from the pool (PR number
  # mod the pool size, see .github/actions/e2e-slot), so parallel PRs spread across it.
  #
  # A job the changes call for is never skipped: if the trailer leaves it out,
  # or names an unknown job, it fails in its first step instead. E2E Sandbox
  # and E2E Production are required checks, and GitHub counts a skipped job as
  # passing, so a skip would let the trailer merge a PR past E2E. Push a
  # commit without the trailer before merging.
  #
  # The logic lives in scripts/ci/e2e-selection.sh, tested by
  # scripts/ci/e2e-selection.test.mjs (in Local Build and Checks).
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      # E2E account for this PR (see .github/actions/e2e-slot).
      e2e-index: ${{ steps.e2e-slot.outputs.index }}
      # JSON array of the E2E jobs to run, e.g. ["sandbox","hosting"]
      e2e: ${{ steps.check.outputs.e2e }}
      # JSON array of the E2E jobs the changes call for but the trailer left
      # out. Each fails in its first step.
      e2e-blocked: ${{ steps.check.outputs.blocked }}
      # e2e + e2e-blocked: the E2E jobs that start. Each E2E job's `if:` checks
      # this one, so a blocked job can't be skipped by checking only `e2e`.
      e2e-run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - id: e2e-slot
        uses: ./.github/actions/e2e-slot
      - id: check
        env:
          E2E_ACCOUNT: ${{ steps.e2e-slot.outputs.account }}
        run: scripts/ci/e2e-selection.sh origin/main

  blocks-integrity:
    name: Blocks Package Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci

      - name: Sync block docs (prebuild step)
        run: node scripts/gen-block-docs.mjs

      - name: Check blocks docs-sync integrity
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          # Release PRs consume changesets — the files are already gone. Skip.
          if [[ "$GITHUB_HEAD_REF" == "changeset-release/main" ]]; then
            echo "✅ Skipping — release PR (changesets already consumed into version bumps)"
            exit 0
          fi

          # gen-block-docs.mjs regenerates packages/blocks/docs/ from sibling READMEs
          # (docs/ is gitignored, built at publish time). We compare the packed
          # @aws-blocks/blocks tarball at THIS PR's head against the PR base branch —
          # like-for-like (same algo, same build state), so only a change introduced by
          # THIS PR trips the check. A PR that doesn't alter what ships needs no bump.
          # The base pack falls back to the pre-rename sync-block-docs.mjs so this job works
          # against bases from either side of the gen-block-docs.mjs rename.
          pack_blocks() {
            local dest="$1"
            node scripts/gen-block-docs.mjs >/dev/null
            # --ignore-scripts intentionally packs source + synced docs, NOT a freshly built dist/ — this diffs shipped content, not the published build.
            ( cd packages/blocks && npm pack --ignore-scripts --pack-destination "$dest" >/dev/null )
            set -- "$dest"/*.tgz
            [ $# -eq 1 ] || { echo "expected exactly one .tgz in $dest, found $#" >&2; exit 1; }
            shasum -a 512 "$1" | awk '{print $1}'
          }

          mkdir -p /tmp/head-pack
          HEAD_INTEGRITY=$(pack_blocks /tmp/head-pack)

          # BASE_SHA is present locally (checkout uses fetch-depth: 0).
          git worktree add --detach /tmp/blocks-base "$BASE_SHA" >/dev/null
          mkdir -p /tmp/base-pack
          BASE_INTEGRITY=$(
            cd /tmp/blocks-base
            node scripts/gen-block-docs.mjs >/dev/null 2>/dev/null || node scripts/sync-block-docs.mjs >/dev/null
            ( cd packages/blocks && npm pack --ignore-scripts --pack-destination /tmp/base-pack >/dev/null )
            set -- /tmp/base-pack/*.tgz
            [ $# -eq 1 ] || { echo "expected exactly one .tgz in /tmp/base-pack, found $#" >&2; exit 1; }
            shasum -a 512 "$1" | awk '{print $1}'
          )
          git worktree remove --force /tmp/blocks-base

          echo "Head packed shasum: $HEAD_INTEGRITY"
          echo "Base packed shasum: $BASE_INTEGRITY"

          # Relies on npm's reproducible packing (fixed mtimes); head & base pack on the same runner, so identical content ⇒ identical tarball hash.
          if [ "$HEAD_INTEGRITY" = "$BASE_INTEGRITY" ]; then
            echo "✅ @aws-blocks/blocks packaged content is unchanged vs the base branch — no version bump required."
            exit 0
          fi

          # Content changed vs base — require a changeset that bumps @aws-blocks/blocks.
          CHANGESET_BUMPS=$(find .changeset -name '*.md' ! -name 'README.md' -exec grep -l '"@aws-blocks/blocks"' {} \; || true)

          if [ -n "$CHANGESET_BUMPS" ]; then
            echo "✅ Packaged content changed and a changeset already bumps @aws-blocks/blocks:"
            echo "$CHANGESET_BUMPS"
            exit 0
          fi

          echo "❌ This PR changes @aws-blocks/blocks packaged content (e.g. synced docs from sibling READMEs) vs the base branch, but no changeset bumps it. Add \"@aws-blocks/blocks\": patch to a changeset."
          exit 1

  # Mirrors the Release job's install (publish-packages.yml): no dependency
  # install scripts, then build. Release only runs on main after the Version
  # Packages PR merges, so without this a dependency that needs its install
  # script to build would pass every PR check and block the next release.
  release-install-check:
    name: Release Install Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

  # The parts of the required "Build, Unit Tests, E2E Local" check run as
  # parallel jobs: local-build (build, checks including check:api, the
  # dist-registry artifact), local-unit and local-e2e. Each installs and
  # builds on its own.
  # build-and-test-local below passes only when all of them succeeded.
  local-build:
    name: Local Build and Checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      # Pin a fixed Blocks CLI telemetry installation ID for CI e2e runs so this
      # traffic is consistent and identifiable (and can be excluded from product
      # usage metrics).
      - uses: ./.github/actions/seed-telemetry-id

      - run: npm ci

      - name: Lint (advisory — annotations only, non-blocking)
        run: npm run lint
        continue-on-error: true

      - name: Lint deps (blocking)
        run: npm run lint:deps

      - name: Build
        run: npm run build

      - name: Check aws-blocks exports consistency
        run: npm run check:exports-consistency

      # The guard decides whether unattributed traffic can ship, so it is unit-tested
      # first. A regression shows up here instead of as a wrong verdict below.
      - name: Test the client user-agent guard
        run: node --test scripts/check-client-user-agent-consistency.test.mjs

      - name: Check client user-agent middleware consistency
        run: npm run check:client-user-agent

      # Decides which E2E jobs run, and which a PR can't skip by leaving them
      # out of its E2E trailer.
      - name: Test the E2E job selection
        run: node --test scripts/ci/e2e-selection.test.mjs

      # Runs on the root build output, before Unit Tests: a package `pretest` that
      # bundles an asset would otherwise hide a bundle the release build skips.
      - name: Test the packed-assets guard
        run: node --test scripts/check-packed-assets.test.mjs

      - name: Check packed Lambda assets
        run: npm run check:packed-assets

      - name: Check API backward compatibility
        run: npm run check:api

      # Tests the splitter the local-unit jobs use.
      - name: Test the unit test sharding
        run: node --test scripts/ci/unit-test-shard.test.mjs

      - name: Pack for local registry
        run: npm run publish:local

      - name: Upload registry artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-registry
          path: dist-registry/
          retention-days: 1

  # The unit tests of every workspace, split by scripts/ci/unit-test-shard.mjs
  # so each workspace runs in exactly one shard. The shard count is the matrix
  # length, so the matrix has no other axis (unit-test-shard.test.mjs checks).
  local-unit:
    name: Local Unit Tests (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # Let every shard finish, so a run reports all failing workspaces.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      # Pin a fixed Blocks CLI telemetry installation ID for CI e2e runs so this
      # traffic is consistent and identifiable (and can be excluded from product
      # usage metrics).
      - uses: ./.github/actions/seed-telemetry-id

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Unit Tests
        env:
          # The real-CDK stream-routing probe in packages/core guards the issue #222
          # root cause (`--ci` is what moves CloudFormation progress off stderr).
          # Require it here so a runner that cannot resolve the CDK CLI fails
          # instead of skipping, and have it drop a marker file the next step
          # checks — a probe that stops running must not read as green.
          BLOCKS_REQUIRE_CDK_PROBE: '1'
          BLOCKS_CDK_PROBE_MARKER: ${{ runner.temp }}/cdk-routing-probe.marker
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
        # npm run test:unit is npm run test --workspaces; this runs the same
        # script in this shard's workspaces.
        run: |
          set -euo pipefail
          workspaces=$(node scripts/ci/unit-test-shard.mjs "$SHARD" "$SHARDS")
          echo "Shard $SHARD of $SHARDS runs:"
          echo "$workspaces"
          args=()
          while IFS= read -r ws; do args+=(-w "$ws"); done <<<"$workspaces"
          npm run test "${args[@]}"

      - name: Verify the real-CDK stream-routing probe ran
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
        run: |
          set -euo pipefail
          # The probe is in @aws-blocks/core, which runs in one shard only. A
          # tree where no shard runs it fails here instead of passing.
          owner=0
          for i in $(seq 1 "$SHARDS"); do
            workspaces=$(node scripts/ci/unit-test-shard.mjs "$i" "$SHARDS")
            if grep -qx '@aws-blocks/core' <<<"$workspaces"; then owner=$i; fi
          done
          if [ "$owner" = 0 ]; then
            echo "::error::no unit test shard runs @aws-blocks/core, so the real-CDK stream-routing probe would not run."
            exit 1
          fi
          if [ "$owner" != "$SHARD" ]; then
            echo "@aws-blocks/core runs in shard $owner; that shard checks the probe."
            exit 0
          fi
          marker='${{ runner.temp }}/cdk-routing-probe.marker'
          if [ ! -s "$marker" ]; then
            echo "::error::the real-CDK --ci stream-routing probe did not run (no marker at $marker). It is the only test that verifies the CDK CLI still routes deploy logs to stdout under --ci and keeps failures on stderr (issue #222); a silent skip is a regression."
            exit 1
          fi
          cat "$marker"

  local-e2e:
    name: Local E2E
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      # Pin a fixed Blocks CLI telemetry installation ID for CI e2e runs so this
      # traffic is consistent and identifiable (and can be excluded from product
      # usage metrics).
      - uses: ./.github/actions/seed-telemetry-id

      - run: npm ci

      - name: Build
        run: npm run build

      - name: E2E Test Local
        run: npm run test:e2e:local

  # Required check. Passes only when every local-* part succeeded: a failed,
  # cancelled or skipped part fails it, and it runs even then so it never
  # reports as skipped (GitHub counts a skipped required check as passing).
  # Keep always(), not !cancelled(): a cancelled run then fails this check
  # instead of skipping it. Jobs that need it wait for all the parts.
  build-and-test-local:
    name: Build, Unit Tests, E2E Local
    needs: [local-build, local-unit, local-e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check that every part succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          failed=0
          for part in local-build local-unit local-e2e; do
            result=$(jq -r --arg part "$part" '.[$part].result // "missing"' <<<"$NEEDS")
            echo "$part: $result"
            if [ "$result" != success ]; then failed=1; fi
          done
          if [ "$failed" != 0 ]; then
            echo "::error::Every part of Build, Unit Tests, E2E Local must succeed."
            exit 1
          fi

  e2e-templates:
    name: E2E Templates
    needs: [build-and-test-local, detect-changes]
    if: contains(fromJSON(needs.detect-changes.outputs.e2e-run), 'templates') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check the E2E trailer
        if: contains(fromJSON(needs.detect-changes.outputs.e2e-blocked), 'templates')
        run: |
          echo "::error::The head commit's E2E trailer leaves out this job, but this PR's changes call for it. Push a commit without the trailer before merging."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      # Pin a fixed Blocks CLI telemetry installation ID for CI e2e runs so this
      # traffic is consistent and identifiable (and can be excluded from product
      # usage metrics).
      - uses: ./.github/actions/seed-telemetry-id

      - run: npm ci

      - name: Download registry artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-registry
          path: dist-registry/

      - name: Template E2E Tests
        run: node scripts/ci/templates-e2e.mjs --skip-publish

  # Same local template suite as e2e-templates, on Windows — the OS where
  # client-side template tooling (paths, process spawn/kill, .cmd shims, line
  # endings) diverges from POSIX. Runs the SAME cross-platform driver, so the
  # two lanes cannot drift. Local only (each template's test:e2e boots a mock
  # dev server) — no AWS, so no credentials/environment and no deploy wait. The
  # real Windows deploy smoke stays in windows-e2e.yml (scheduled).
  e2e-templates-windows:
    name: E2E Templates (Windows)
    needs: [build-and-test-local, detect-changes]
    if: contains(fromJSON(needs.detect-changes.outputs.e2e-run), 'templates-windows') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check the E2E trailer
        if: contains(fromJSON(needs.detect-changes.outputs.e2e-blocked), 'templates-windows')
        run: |
          echo "::error::The head commit's E2E trailer leaves out this job, but this PR's changes call for it. Push a commit without the trailer before merging."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      # Pin a fixed Blocks CLI telemetry installation ID for CI e2e runs so this
      # traffic is consistent and identifiable (and can be excluded from product
      # usage metrics).
      - uses: ./.github/actions/seed-telemetry-id

      - run: npm ci

      - name: Download registry artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-registry
          path: dist-registry/

      - name: Template E2E Tests (Windows)
        run: node scripts/ci/templates-e2e.mjs --skip-publish

  e2e-sandbox:
    permissions:
      contents: read
      id-token: write  # assumes the AWS role below
    name: E2E Sandbox
    needs: [build-and-test-local, detect-changes]
    if: contains(fromJSON(needs.detect-changes.outputs.e2e-run), 'sandbox') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: e2e
    env:
      BLOCKS_STACK_SUFFIX: pr-${{ github.event.pull_request.number || github.run_id }}-${{ github.run_attempt }}
      E2E_FROM_EMAIL: ${{ secrets.E2E_FROM_EMAIL }}
    steps:
      - name: Check the E2E trailer
        if: contains(fromJSON(needs.detect-changes.outputs.e2e-blocked), 'sandbox')
        run: |
          echo "::error::The head commit's E2E trailer leaves out this job, but this PR's changes call for it. Push a commit without the trailer before merging."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      # Pin a fixed Blocks CLI telemetry installation ID for CI e2e runs so this
      # traffic is consistent and identifiable (and can be excluded from product
      # usage metrics).
      - uses: ./.github/actions/seed-telemetry-id

      - run: npm ci
      - run: npm run build

      - name: Configure AWS credentials
        uses: ./.github/actions/e2e-aws-credentials
        with:
          role-arns: ${{ secrets.AWS_ROLE_ARNS }}
          index: ${{ needs.detect-changes.outputs.e2e-index }}

      - name: E2E Test Sandbox
        run: npm run test:e2e:sandbox

  e2e-sandbox-vpc:
    permissions:
      contents: read
      id-token: write  # assumes the AWS role below
    name: E2E VPC Smoke
    needs: [build-and-test-local, detect-changes]
    if: contains(fromJSON(needs.detect-changes.outputs.e2e-run), 'sandbox-vpc') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: e2e
    # Serialize across PRs: the smoke app provisions private-DNS interface
    # endpoints into the shared persistent test VPC, and AWS permits only one
    # per service per VPC. Without this, two open PRs collide on the endpoints
    # (and the shared stack) and CloudFormation fails the second run. Queue
    # rather than cancel so an in-flight deploy/destroy isn't interrupted.
    concurrency:
      group: blocks-test-vpc-${{ needs.detect-changes.outputs.e2e-index }}
      cancel-in-progress: false
    env:
      BLOCKS_STACK_SUFFIX: vpc-${{ github.event.pull_request.number || github.run_id }}-${{ github.run_attempt }}
      E2E_FROM_EMAIL: ${{ secrets.E2E_FROM_EMAIL }}
    steps:
      - name: Check the E2E trailer
        if: contains(fromJSON(needs.detect-changes.outputs.e2e-blocked), 'sandbox-vpc')
        run: |
          echo "::error::The head commit's E2E trailer leaves out this job, but this PR's changes call for it. Push a commit without the trailer before merging."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      # Pin a fixed Blocks CLI telemetry installation ID for CI e2e runs so this
      # traffic is consistent and identifiable (and can be excluded from product
      # usage metrics).
      - uses: ./.github/actions/seed-telemetry-id

      - run: npm ci
      - run: npm run build

      - name: Configure AWS credentials
        uses: ./.github/actions/e2e-aws-credentials
        with:
          role-arns: ${{ secrets.AWS_ROLE_ARNS }}
          index: ${{ needs.detect-changes.outputs.e2e-index }}

      - name: Ensure persistent test VPC
        run: cd test-infra && npx cdk deploy BlocksTestVpc --require-approval never --outputs-file outputs.json

      - name: Export VPC ID
        run: |
          VPC_ID=$(cat test-infra/outputs.json | python3 -c "import sys,json; print(json.loads(sys.stdin.read())['BlocksTestVpc']['VpcId'])")
          echo "VPC_TEST_VPC_ID=$VPC_ID" >> "$GITHUB_ENV"

      - name: E2E VPC Smoke
        run: npm run test:e2e:sandbox:vpc

  e2e-compute-smoke:
    name: E2E Compute Smoke
    permissions:
      contents: read
      id-token: write  # assumes the AWS role below
    needs: [build-and-test-local, detect-changes]
    if: contains(fromJSON(needs.detect-changes.outputs.e2e-run), 'compute-smoke') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: e2e
    # Serialize this suite across PRs: it provisions private-DNS interface
    # endpoints into its OWN persistent test VPC (BlocksComputeTestVpc, separate
    # from the VPC smoke job's BlocksTestVpc), and AWS permits only one per
    # service per VPC — two concurrent runs of THIS job would collide. Queue
    # rather than cancel so an in-flight deploy/destroy isn't interrupted.
    #
    # This uses a group distinct from the VPC smoke job (blocks-test-vpc). The
    # two suites don't collide across groups because they target *different*
    # persistent VPCs, so they can run in parallel.
    concurrency:
      group: blocks-test-compute-${{ needs.detect-changes.outputs.e2e-index }}
      cancel-in-progress: false
    env:
      BLOCKS_STACK_SUFFIX: compute-${{ github.event.pull_request.number || github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check the E2E trailer
        if: contains(fromJSON(needs.detect-changes.outputs.e2e-blocked), 'compute-smoke')
        run: |
          echo "::error::The head commit's E2E trailer leaves out this job, but this PR's changes call for it. Push a commit without the trailer before merging."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      # Pin a fixed Blocks CLI telemetry installation ID for CI e2e runs so this
      # traffic is consistent and identifiable (and can be excluded from product
      # usage metrics).
      - uses: ./.github/actions/seed-telemetry-id

      - run: npm ci
      - run: npm run build

      - name: Configure AWS credentials
        uses: ./.github/actions/e2e-aws-credentials
        with:
          role-arns: ${{ secrets.AWS_ROLE_ARNS }}
          index: ${{ needs.detect-changes.outputs.e2e-index }}

      - name: Ensure persistent compute test VPC
        run: cd test-infra && npx cdk deploy BlocksComputeTestVpc --require-approval never --outputs-file compute-outputs.json

      - name: Export VPC ID
        run: |
          VPC_ID=$(cat test-infra/compute-outputs.json | python3 -c "import sys,json; print(json.loads(sys.stdin.read())['BlocksComputeTestVpc']['VpcId'])")
          echo "VPC_TEST_VPC_ID=$VPC_ID" >> "$GITHUB_ENV"

      - name: E2E Compute Smoke
        run: npm run test:e2e:sandbox:compute

  e2e-production:
    permissions:
      contents: read
      id-token: write  # assumes the AWS role below
    name: E2E Production
    needs: [build-and-test-local, detect-changes]
    if: contains(fromJSON(needs.detect-changes.outputs.e2e-run), 'production') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: e2e
    env:
      BLOCKS_STACK_SUFFIX: pr-${{ github.event.pull_request.number || github.run_id }}-${{ github.run_attempt }}
      E2E_FROM_EMAIL: ${{ secrets.E2E_FROM_EMAIL }}
    steps:
      - name: Check the E2E trailer
        if: contains(fromJSON(needs.detect-changes.outputs.e2e-blocked), 'production')
        run: |
          echo "::error::The head commit's E2E trailer leaves out this job, but this PR's changes call for it. Push a commit without the trailer before merging."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      # Pin a fixed Blocks CLI telemetry installation ID for CI e2e runs so this
      # traffic is consistent and identifiable (and can be excluded from product
      # usage metrics).
      - uses: ./.github/actions/seed-telemetry-id

      - run: npm ci
      - run: npm run build

      - name: Configure AWS credentials
        uses: ./.github/actions/e2e-aws-credentials
        with:
          role-arns: ${{ secrets.AWS_ROLE_ARNS }}
          index: ${{ needs.detect-changes.outputs.e2e-index }}

      - name: E2E Test Production
        run: npm run test:e2e:production

  e2e-supabase:
    permissions:
      contents: read
      id-token: write  # assumes the AWS role below
    name: E2E Supabase
    needs: [build-and-test-local, detect-changes]
    if: contains(fromJSON(needs.detect-changes.outputs.e2e-run), 'supabase') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: e2e
    env:
      # Pin the Supabase Root 2021 CA (public cert, committed) so every external-DB
      # connection in this suite runs verify-full — exercising the TLS verification
      # feature end-to-end instead of connecting unverified. externalDbSsl() reads
      # this; the explicit-engine tests read it too.
      DATABASE_CA_CERT: ${{ github.workspace }}/packages/bb-data/test/fixtures/supabase-ca.crt
    # One Supabase project serves every E2E account, so this group stays global.
    concurrency:
      group: e2e-supabase
      cancel-in-progress: false
    steps:
      - name: Check the E2E trailer
        if: contains(fromJSON(needs.detect-changes.outputs.e2e-blocked), 'supabase')
        run: |
          echo "::error::The head commit's E2E trailer leaves out this job, but this PR's changes call for it. Push a commit without the trailer before merging."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      # Pin a fixed Blocks CLI telemetry installation ID for CI e2e runs so this
      # traffic is consistent and identifiable (and can be excluded from product
      # usage metrics).
      - uses: ./.github/actions/seed-telemetry-id

      - run: npm ci
      - run: npm run build

      - name: Install pg_dump 18 (for the run-all baseline E2E)
        # The runner's default pg_dump may be older than the Supabase server, and
        # pg_dump's major must be >= the server's. Install the PGDG client so the
        # run-all baseline E2E (migrations-e2e) generates a real baseline instead of
        # skipping. Applying migrations needs no pg_dump — only generating one does.
        # Best-effort (continue-on-error): if the install ever fails, the gated E2E
        # just skips — it must not take down the crud/auth Supabase suites. Uses the
        # armored key via apt `signed-by` directly (no `gpg --dearmor`, which fails
        # on `/dev/tty` under sudo in CI).
        continue-on-error: true
        run: |
          sudo install -d /etc/apt/keyrings
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo tee /etc/apt/keyrings/pgdg.asc > /dev/null
          echo "deb [signed-by=/etc/apt/keyrings/pgdg.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Configure AWS credentials
        uses: ./.github/actions/e2e-aws-credentials
        with:
          role-arns: ${{ secrets.AWS_ROLE_ARNS }}
          index: ${{ needs.detect-changes.outputs.e2e-index }}

      - name: Fetch Supabase secrets
        run: |
          SECRET=$(aws secretsmanager get-secret-value \
            --secret-id blocks/supabase-e2e \
            --query SecretString --output text)
          echo "$SECRET" | jq -r 'to_entries[] | "\(.key)=\(.value)"' >> "$GITHUB_ENV"

      - name: Apply test schema
        run: npx tsx packages/bb-data/test/apply-schema.ts

      - name: E2E Test Supabase
        run: npm run test:e2e:supabase

  e2e-hosting:
    permissions:
      contents: read
      id-token: write  # assumes the AWS role below
    name: E2E Hosting (${{ matrix.framework }})
    timeout-minutes: 60
    needs: [build-and-test-local, detect-changes]
    if: contains(fromJSON(needs.detect-changes.outputs.e2e-run), 'hosting') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: e2e
    strategy:
      fail-fast: false
      matrix:
        include:
          - framework: spa
            app-dir: test-apps/hosting-spa
            script: test:e2e:hosting-spa
          - framework: nextjs
            app-dir: test-apps/hosting-ssr
            script: test:e2e:hosting-ssr
          - framework: nuxt
            app-dir: test-apps/hosting-ssr-nuxt
            script: test:e2e:hosting-ssr-nuxt
          - framework: astro
            app-dir: test-apps/hosting-ssr-astro
            script: test:e2e:hosting-ssr-astro
          - framework: astro-default404
            app-dir: test-apps/hosting-ssr-astro-default404
            script: test:e2e:hosting-ssr-astro-default404
          - framework: sveltekit
            app-dir: test-apps/hosting-ssr-sveltekit
            script: test:e2e:hosting-ssr-sveltekit
          # Same suite with the SSR server on AWS Lambda Web Functions
          # (compute.type: 'web-function'); the app reads HOSTING_COMPUTE_TYPE.
          - framework: sveltekit-web-function
            app-dir: test-apps/hosting-ssr-sveltekit
            script: test:e2e:hosting-ssr-sveltekit
            compute-type: web-function
          - framework: nextjs-web-function
            app-dir: test-apps/hosting-ssr
            script: test:e2e:hosting-ssr
            compute-type: web-function
          - framework: nuxt-web-function
            app-dir: test-apps/hosting-ssr-nuxt
            script: test:e2e:hosting-ssr-nuxt
            compute-type: web-function
    env:
      BLOCKS_STACK_SUFFIX: pr-${{ github.event.pull_request.number || github.run_id }}-${{ matrix.framework }}
      HOSTING_COMPUTE_TYPE: ${{ matrix.compute-type || 'lambda' }}
      # Web Function jobs keep the sandbox after the suite for the redeploy check.
      BLOCKS_SANDBOX_KEEP: ${{ matrix.compute-type == 'web-function' && '1' || '' }}
      E2E_FROM_EMAIL: ${{ secrets.E2E_FROM_EMAIL }}
    steps:
      - name: Check the E2E trailer
        if: contains(fromJSON(needs.detect-changes.outputs.e2e-blocked), 'hosting')
        run: |
          echo "::error::The head commit's E2E trailer leaves out this job, but this PR's changes call for it. Push a commit without the trailer before merging."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      # Pin a fixed Blocks CLI telemetry installation ID for CI e2e runs so this
      # traffic is consistent and identifiable (and can be excluded from product
      # usage metrics).
      - uses: ./.github/actions/seed-telemetry-id

      - run: npm ci
      - run: npm run build

      - name: Configure AWS credentials
        uses: ./.github/actions/e2e-aws-credentials
        with:
          role-arns: ${{ secrets.AWS_ROLE_ARNS }}
          index: ${{ needs.detect-changes.outputs.e2e-index }}

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: E2E Test Hosting (${{ matrix.framework }})
        run: npm run ${{ matrix.script }}

      # Sandbox deploys use Express Mode (rollback disabled), which rejects
      # replacement updates; a fresh create can't catch a revision that updates
      # in place. Redeploy the kept sandbox with a new revision and check it serves.
      - name: Redeploy with a new Web Function revision
        if: matrix.compute-type == 'web-function'
        run: npx tsx scripts/ci/web-function-redeploy.ts ${{ matrix.app-dir }}

      - name: Cleanup sandbox
        if: always()
        run: |
          cd ${{ matrix.app-dir }}
          npx tsx test/sandbox-destroy.ts aws-blocks/index.cdk.ts || true

  e2e-telemetry:
    name: Telemetry E2E
    needs: [build-and-test-local, detect-changes]
    if: contains(fromJSON(needs.detect-changes.outputs.e2e-run), 'telemetry') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: e2e
    permissions:
      contents: read
      id-token: write
    env:
      BLOCKS_STACK_SUFFIX: telemetry-${{ github.event.pull_request.number || github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check the E2E trailer
        if: contains(fromJSON(needs.detect-changes.outputs.e2e-blocked), 'telemetry')
        run: |
          echo "::error::The head commit's E2E trailer leaves out this job, but this PR's changes call for it. Push a commit without the trailer before merging."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Configure AWS credentials
        uses: ./.github/actions/e2e-aws-credentials
        with:
          role-arns: ${{ secrets.AWS_ROLE_ARNS }}
          index: ${{ needs.detect-changes.outputs.e2e-index }}

      - name: Seed fixed e2e telemetry installation ID
        shell: bash
        run: |
          mkdir -p "$HOME/.blocks/telemetry"
          printf '%s' '00000000-0000-0000-0000-000000000e2e' > "$HOME/.blocks/telemetry/installation-id"

      - name: Telemetry E2E Tests
        run: npm run test:telemetry

      - name: Cleanup stacks
        if: always()
        run: |
          cd test-apps/telemetry
          npx tsx aws-blocks/scripts/sandbox-destroy.ts || true
          npx tsx aws-blocks/scripts/destroy.ts || true

  # Gate job — matches the branch protection required check name.
  # Skipped E2E jobs (not selected by detect-changes) are treated as passing.
  # Note: Amplify interop tests live in a separate workflow
  # (e2e-amplify-interop.yml) so their failures don't show red here.
  build-and-test:
    name: Build and Test
    needs: [detect-changes, blocks-integrity, release-install-check, build-and-test-local, e2e-templates, e2e-templates-windows, e2e-sandbox, e2e-sandbox-vpc, e2e-compute-smoke, e2e-production, e2e-supabase, e2e-hosting, e2e-telemetry]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check results
        run: |
          # A failed detect-changes skips every E2E job, which would otherwise pass below.
          if [[ "${{ needs.detect-changes.result }}" != "success" ]]; then
            echo "detect-changes failed"
            exit 1
          fi

          if [[ "${{ needs.blocks-integrity.result }}" != "success" ]]; then
            echo "blocks-integrity failed"
            exit 1
          fi

          if [[ "${{ needs.release-install-check.result }}" != "success" ]]; then
            echo "release-install-check failed"
            exit 1
          fi

          if [[ "${{ needs.build-and-test-local.result }}" != "success" ]]; then
            echo "build-and-test-local failed"
            exit 1
          fi

          # E2E jobs must either succeed or be skipped (not selected)
          if [[ "${{ needs.e2e-templates.result }}" != "success" && "${{ needs.e2e-templates.result }}" != "skipped" ]] ||
             [[ "${{ needs.e2e-templates-windows.result }}" != "success" && "${{ needs.e2e-templates-windows.result }}" != "skipped" ]] ||
             [[ "${{ needs.e2e-sandbox.result }}" != "success" && "${{ needs.e2e-sandbox.result }}" != "skipped" ]] ||
             [[ "${{ needs.e2e-sandbox-vpc.result }}" != "success" && "${{ needs.e2e-sandbox-vpc.result }}" != "skipped" ]] ||
             [[ "${{ needs.e2e-compute-smoke.result }}" != "success" && "${{ needs.e2e-compute-smoke.result }}" != "skipped" ]] ||
             [[ "${{ needs.e2e-production.result }}" != "success" && "${{ needs.e2e-production.result }}" != "skipped" ]] ||
             [[ "${{ needs.e2e-supabase.result }}" != "success" && "${{ needs.e2e-supabase.result }}" != "skipped" ]] ||
             [[ "${{ needs.e2e-hosting.result }}" != "success" && "${{ needs.e2e-hosting.result }}" != "skipped" ]] ||
             [[ "${{ needs.e2e-telemetry.result }}" != "success" && "${{ needs.e2e-telemetry.result }}" != "skipped" ]]; then
            echo "One or more E2E jobs failed"
            exit 1
          fi
