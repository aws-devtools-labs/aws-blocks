name: Harbor agent check (advisory)

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Open PR number to evaluate (approval required before model access)'
        required: true
        type: string
      trials:
        description: 'Trials per arm, 1-50 (each trial is a separate paid run)'
        required: false
        default: '1'
        type: string

permissions:
  contents: read

concurrency:
  group: harbor-agent-check-pr-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  revisions:
    # Run the reviewed controller from main, never a PR-controlled privileged workflow.
    if: github.repository == 'aws-devtools-labs/aws-blocks' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      candidate: ${{ steps.revisions.outputs.candidate }}
      baseline: ${{ steps.revisions.outputs.baseline }}
      source_repository: ${{ steps.revisions.outputs.source_repository }}
      trials: ${{ steps.trials.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: trials
        name: Validate trial count
        env:
          TRIALS: ${{ inputs.trials }}
        run: |
          matrix=$(python3 scripts/harbor-bench/trials.py "$TRIALS")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      - id: revisions
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          TRIALS: ${{ inputs.trials }}
        with:
          script: |
            const value = process.env.PR_NUMBER;
            if (!/^[1-9][0-9]*$/.test(value)) throw new Error('Expected a positive PR number');
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner, repo: context.repo.repo, pull_number: Number(value),
            });
            if (pr.state !== 'open' || !pr.head.repo) throw new Error('PR must be open with an accessible head repository');
            if (pr.base.ref !== 'main') throw new Error('Only PRs targeting main are supported');
            const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
              owner: context.repo.owner, repo: context.repo.repo,
              basehead: `${pr.base.sha}...${pr.head.sha}`,
            });
            core.setOutput('candidate', pr.head.sha);
            core.setOutput('baseline', comparison.merge_base_commit.sha);
            core.setOutput('source_repository', pr.head.repo.full_name);
            await core.summary.addHeading('Requested Harbor evaluation')
              .addTable([['PR', 'Candidate', 'Baseline', 'Trials per arm'],
                [value, pr.head.sha, comparison.merge_base_commit.sha, process.env.TRIALS]])
              .addRaw('Optional and non-required. Review these exact revisions before approving model access. '
                + 'A new dispatch for this PR cancels this run.').write();

  packages:
    needs: revisions
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arm: [baseline, candidate]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ matrix.arm == 'baseline' && needs.revisions.outputs.baseline || needs.revisions.outputs.candidate }}
          repository: ${{ matrix.arm == 'baseline' && github.repository || needs.revisions.outputs.source_repository }}
          persist-credentials: false
      # The selected revision's install and build scripts are PR code, and this run is on main, so
      # they run in a container that sees no runner environment or files: an explicit environment
      # (no ACTIONS_*, GITHUB_* or runner variables) and only a copy of the tree without .git mounted
      # (no actions directory, other runner files or Docker socket); it keeps network access for npm.
      # The slim image has no git, no native toolchain and no passwd entry for the runner uid, so a
      # revision needing any of them fails here. No setup-node here either: its default
      # package-manager cache would save into the main branch's Actions cache scope.
      - name: Build and pack selected revision in an isolated container
        id: build
        env:
          # node:22.23.3-bookworm-slim (multi-arch index digest).
          NODE_IMAGE: node:22.23.3-bookworm-slim@sha256:3ed98443660ff48413b5af19ecefce3b9d50845a901a43420d47cc63a9fddbe9
          BUILD_DIR: ${{ runner.temp }}/harbor-build
        run: |
          set -euo pipefail
          mkdir "$BUILD_DIR"
          tar -C "$GITHUB_WORKSPACE" --exclude=./.git -cf - . | tar -C "$BUILD_DIR" -xf -
          docker run --rm --init \
            --user "$(id -u):$(id -g)" --cap-drop=ALL --security-opt=no-new-privileges \
            --mount "type=bind,src=$BUILD_DIR,dst=/work" --workdir /work \
            --env HOME=/tmp/home --env CI=true --env HUSKY=0 --env BLOCKS_DISABLE_TELEMETRY=1 \
            --env NPM_CONFIG_USERCONFIG=/dev/null --env NPM_CONFIG_GLOBALCONFIG=/dev/null/npmrc \
            --env NPM_CONFIG_CACHE=/tmp/npm-cache \
            "$NODE_IMAGE" \
            bash -euo pipefail -c 'mkdir -p "$HOME" && npm ci && npm run build && npm run publish:local'
          # The upload follows symlinks, so only a plain tree of regular files leaves the container.
          # A find error (e.g. an unreadable directory) aborts the step under set -e. It stays inline:
          # this job's checkout is the PR revision, so a script from it could not be trusted.
          # scripts/ci/harbor-packages-isolation.test.mjs runs the block between the markers.
          # plain-tree-guard: begin
          out="$BUILD_DIR/dist-registry"
          if [ -L "$out" ] || [ ! -d "$out" ]; then
            echo '::error::dist-registry must be a directory of regular files'
            exit 1
          fi
          bad=$(find "$out" -mindepth 1 ! -type f ! -type d -print -quit)
          if [ -n "$bad" ]; then
            echo '::error::dist-registry must be a directory of regular files'
            exit 1
          fi
          echo "registry=$out/" >> "$GITHUB_OUTPUT"
          # plain-tree-guard: end
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harbor-packages-${{ matrix.arm }}
          path: ${{ steps.build.outputs.registry }}
          retention-days: 7
          if-no-files-found: error

  approval:
    needs: [revisions, packages]
    # The one human gate per run: blocks-team reviews the exact candidate/baseline revisions in
    # the run summary, then approves this single job. Required reviewers live on this environment,
    # not on harbor-bench: an environment with reviewers is reviewed per matrix job, and one
    # approval has left some of the 40 benchmark jobs waiting for another.
    environment: harbor-bench-approval
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Record approval
        run: echo "Approved model access for this run's candidate and baseline revisions."

  benchmark:
    needs: [revisions, packages, approval]
    # Model credentials only after the approval job. harbor-bench holds the role/bucket secrets and
    # is the OIDC subject the roles trust; it is restricted to main and has no reviewers of its own.
    environment: harbor-bench
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        arm: [baseline, candidate]
        trial: ${{ fromJSON(needs.revisions.outputs.trials) }}
    env:
      WORK: run-${{ matrix.arm }}-${{ matrix.trial }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: harbor-packages-${{ matrix.arm }}
          path: packed
      - name: Install pinned Harbor
        run: python -m pip install -r scripts/harbor-bench/requirements.txt
      - name: Prepare isolated registry and task image
        env:
          ARM: ${{ matrix.arm }}
          COMMIT: ${{ matrix.arm == 'baseline' && needs.revisions.outputs.baseline || needs.revisions.outputs.candidate }}
          HARNESS_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python scripts/harbor-bench/prepare.py --registry packed --output "$WORK" --arm "$ARM" --commit "$COMMIT" --harness-commit "$HARNESS_SHA"
          image=$(python -c 'import json, os; print(json.load(open(os.environ["WORK"] + "/identity.json"))["image"])')
          docker build --tag "$image" "$WORK/task/environment"
      - name: Assume dedicated Bedrock-only role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-duration-seconds: 10800
          role-session-name: harbor-${{ github.run_id }}-${{ matrix.arm }}-${{ matrix.trial }}
          mask-aws-account-id: true
          # Intersection with the role policy, never permission to deploy or publish.
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["bedrock:InvokeModel","bedrock:InvokeModelWithResponseStream"],"Resource":["arn:aws:bedrock:*:*:inference-profile/global.anthropic.claude-opus-5-5","arn:aws:bedrock:*::foundation-model/anthropic.claude-opus-5-5"]}]}
      - name: Run three phases in one Harbor container and Claude session
        id: run
        run: python scripts/harbor-bench/run.py "$WORK"
      - name: Upload allowlisted results only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harbor-result-${{ matrix.arm }}-${{ matrix.trial }}
          path: ${{ env.WORK }}/public/
          retention-days: 14
          if-no-files-found: warn
      - name: Remove isolated runtime containers
        if: always()
        run: docker ps -aq --filter 'label=com.docker.compose.project' | xargs -r docker rm -f
      # Raw traces go only to the team's private bucket, never to public artifacts. Every step
      # below is best effort: it cannot change this arm's benchmark result.
      - name: Check private trace storage
        id: traces
        if: always() && steps.run.outcome != 'skipped'
        continue-on-error: true
        env:
          TRACES_ROLE: ${{ secrets.AWS_TRACES_ROLE_ARN }}
          TRACES_BUCKET: ${{ vars.HARBOR_TRACES_BUCKET }}
          PR_NUMBER: ${{ inputs.pr_number }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          ARM: ${{ matrix.arm }}
          TRIAL: ${{ matrix.trial }}
        run: |
          set -euo pipefail
          if [ -z "$TRACES_ROLE" ] || [ -z "$TRACES_BUCKET" ]; then
            echo '::notice::Trace upload skipped: AWS_TRACES_ROLE_ARN or HARBOR_TRACES_BUCKET is not set for harbor-bench.'
            exit 0
          fi
          # Mask before the session policy (which names the bucket) appears in later step inputs.
          echo "::add-mask::$TRACES_BUCKET"
          target=$(python3 scripts/harbor-bench/traces.py upload-target --pr "$PR_NUMBER" --run-id "$RUN_ID" \
            --attempt "$RUN_ATTEMPT" --arm "$ARM" --trial "$TRIAL" --bucket "$TRACES_BUCKET")
          {
            echo "prefix=$(jq -r .prefix <<<"$target")"
            echo "policy=$(jq -r .policy <<<"$target")"
            echo 'enabled=true'
          } >> "$GITHUB_OUTPUT"
      - name: Pack trace with the Bedrock credentials redacted
        id: pack
        if: always() && steps.traces.outputs.enabled == 'true'
        continue-on-error: true
        # Runs before the credentials below replace them: traces.py reads the Bedrock values
        # from this environment and never prints them.
        run: |
          sudo chown -R "$(id -u):$(id -g)" "$WORK"
          mkdir -p "$RUNNER_TEMP/harbor-trace"
          python scripts/harbor-bench/traces.py pack "$WORK" "$RUNNER_TEMP/harbor-trace/trace.tar.gz"
      - name: Assume trace writer role
        id: writer
        if: always() && steps.pack.outcome == 'success'
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_TRACES_ROLE_ARN }}
          aws-region: us-east-1
          role-duration-seconds: 3600
          role-session-name: harbor-traces-${{ github.run_id }}-${{ matrix.arm }}-${{ matrix.trial }}
          mask-aws-account-id: true
          unset-current-credentials: true
          # The role may write anywhere under harbor/v1/ on an unversioned bucket; this session may
          # only write this run/attempt/arm/trial prefix, so it cannot overwrite other runs' traces.
          inline-session-policy: ${{ steps.traces.outputs.policy }}
      - name: Upload trace to the private bucket
        if: always() && steps.writer.outcome == 'success'
        continue-on-error: true
        env:
          BUCKET: ${{ vars.HARBOR_TRACES_BUCKET }}
          PREFIX: ${{ steps.traces.outputs.prefix }}
        run: |
          set -euo pipefail
          aws s3 cp --only-show-errors "$RUNNER_TEMP/harbor-trace/trace.tar.gz" "s3://$BUCKET/${PREFIX}trace.tar.gz"
          if [ -f "$WORK/public/result.json" ]; then
            aws s3 cp --only-show-errors "$WORK/public/result.json" "s3://$BUCKET/${PREFIX}result.json"
          fi
          echo "::notice::Uploaded the redacted trace to the private traces bucket under ${PREFIX}"

  report:
    needs: [revisions, packages, benchmark]
    if: always() && needs.revisions.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true # Missing artifacts must still produce an honest report.
        with:
          pattern: harbor-result-*
          path: results
      - name: Render comparison
        env:
          BASELINE_SHA: ${{ needs.revisions.outputs.baseline }}
          CANDIDATE_SHA: ${{ needs.revisions.outputs.candidate }}
          HARNESS_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRIALS: ${{ inputs.trials }}
        run: |
          python3 scripts/harbor-bench/report.py results report.md --trials "$TRIALS"
          cat report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Update advisory PR comment
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- harbor-agent-check -->';
            const body = marker + '\n' + fs.readFileSync('report.md', 'utf8');
            const params = { owner: context.repo.owner, repo: context.repo.repo, issue_number: Number(process.env.PR_NUMBER) };
            const comments = await github.paginate(github.rest.issues.listComments, params);
            const previous = comments.find(c => c.user.type === 'Bot' && c.body.startsWith(marker));
            if (previous) await github.rest.issues.updateComment({ ...params, comment_id: previous.id, body });
            else await github.rest.issues.createComment({ ...params, body });
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harbor-comparison
          path: report.md
          retention-days: 14
