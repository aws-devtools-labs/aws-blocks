name: Publish Canary or RC (npm)

# Publishes a prerelease of every @aws-cdk-blocks package and the aws-cdk-blocks
# umbrella to public npm. Pick `kind` when you run it:
#
#   canary  Any branch. Version 0.0.0-canary.<branch>.<sha>.<ts>, dist-tag
#           `canary-<branch>`.
#   rc      main only. Version `rc-version` (X.Y.Z-rc.N, e.g. 1.0.0-rc.0) for
#           every package, dist-tag `rc`. Install with `aws-cdk-blocks@rc`.
#
# Never touches `latest` — stable releases live in publish-packages.yml.
# The S3-registry canary lives in publish-canary.yml.
#
# Two jobs: `pack` builds, tests, and packs with no secrets. `publish` holds
# NPM_TOKEN, runs no repo code (no checkout, no npm ci), verifies the packed
# tarballs against the inputs, and publishes them with provenance.
#
# NOTE: npm versions are permanent and public (unpublish only works for 72h).
# An rc version can be published once; the next build is rc.N+1.

on:
  workflow_dispatch:
    inputs:
      kind:
        description: 'canary: a build of this branch under canary-<branch>. rc: rc-version under the rc dist-tag (main only).'
        type: choice
        options: [canary, rc]
        default: canary
      rc-version:
        description: 'rc only: the version every package publishes as, X.Y.Z-rc.N (e.g. 1.0.0-rc.0).'
        type: string
        required: false

concurrency:
  group: publish-canary-npm
  cancel-in-progress: false

permissions: {}

jobs:
  pack:
    name: Build, test & pack
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      NODE_OPTIONS: '--test-reporter=spec'
      KIND: ${{ inputs.kind }}
      RC_VERSION: ${{ inputs.rc-version }}
      BRANCH_NAME: ${{ github.ref_name }}
    steps:
      # Fail before the 45-minute build when the inputs can't be published.
      - name: Check inputs
        run: |
          set -euo pipefail
          case "$KIND" in
            canary)
              if [[ ! "$BRANCH_NAME" =~ ^[a-zA-Z0-9/_.-]+$ ]]; then
                echo "::error::Branch name contains unsafe characters"
                exit 1
              fi
              ;;
            rc)
              if [[ "$GITHUB_REF" != refs/heads/main ]]; then
                echo "::error::An rc publishes from main only (this run is on $GITHUB_REF)"
                exit 1
              fi
              if [[ ! "$RC_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-rc\.(0|[1-9][0-9]*)$ ]]; then
                echo "::error::rc-version must be X.Y.Z-rc.N, e.g. 1.0.0-rc.0 (got '$RC_VERSION')"
                exit 1
              fi
              for name in @aws-cdk-blocks/core aws-cdk-blocks; do
                if npm view "$name@$RC_VERSION" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
                  echo "::error::$name@$RC_VERSION is already on npm; pick the next rc number"
                  exit 1
                fi
              done
              ;;
            *)
              echo "::error::Unknown kind '$KIND'"
              exit 1
              ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      # Pin a fixed Blocks CLI telemetry installation ID for CI e2e runs so this
      # traffic is consistent and identifiable (and can be excluded from product
      # usage metrics).
      - uses: ./.github/actions/seed-telemetry-id

      - run: npm ci

      - name: Build
        run: npm run build

      - name: E2E Test Local
        run: npm run test:e2e:local

      - name: Pack
        run: |
          set -euo pipefail
          if [[ "$KIND" == rc ]]; then
            npx tsx scripts/publish/publish.ts --rc "$RC_VERSION" --pack-only dist-npm
          else
            npx tsx scripts/publish/publish.ts --canary "$BRANCH_NAME" --pack-only dist-npm
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: canary-npm-tarballs
          path: dist-npm/
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: publish
    permissions:
      contents: read
      id-token: write # npm provenance
    env:
      KIND: ${{ inputs.kind }}
      RC_VERSION: ${{ inputs.rc-version }}
    steps:
      # No checkout here, so no .nvmrc — keep in sync with it.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: canary-npm-tarballs
          path: dist-npm

      # The manifest comes from the pack job, which ran repo code. Check it against
      # the run's own inputs, not against itself.
      - name: Verify tarballs
        working-directory: dist-npm
        run: |
          set -euo pipefail
          DIST_TAG=$(jq -r .distTag publish-manifest.json)
          case "$KIND" in
            canary)
              tag_ok='^canary-[a-z0-9-]+$'
              version_ok='^0\.0\.0-canary\.'
              ;;
            rc)
              if [[ "$GITHUB_REF" != refs/heads/main ]]; then
                echo "::error::An rc publishes from main only (this run is on $GITHUB_REF)"
                exit 1
              fi
              if [[ ! "$RC_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-rc\.(0|[1-9][0-9]*)$ ]]; then
                echo "::error::rc-version must be X.Y.Z-rc.N (got '$RC_VERSION')"
                exit 1
              fi
              tag_ok='^rc$'
              version_ok="^${RC_VERSION//./\\.}\$"
              ;;
            *)
              echo "::error::Unknown kind '$KIND'"
              exit 1
              ;;
          esac
          if [[ ! "$DIST_TAG" =~ $tag_ok ]]; then
            echo "::error::Refusing dist-tag '$DIST_TAG' for a $KIND publish"
            exit 1
          fi
          jq -c '.packages[]' publish-manifest.json | while read -r pkg; do
            name=$(jq -r .name <<<"$pkg")
            version=$(jq -r .version <<<"$pkg")
            file=$(jq -r .file <<<"$pkg")
            expected=$(jq -r .integrity <<<"$pkg")
            if [[ ! "$name" =~ ^(@aws-cdk-blocks/[a-z0-9-]+|aws-cdk-blocks)$ ]]; then
              echo "::error::Unexpected package name '$name'"
              exit 1
            fi
            if [[ ! "$version" =~ $version_ok ]]; then
              echo "::error::$name: refusing version '$version' for a $KIND publish"
              exit 1
            fi
            if [[ ! "$file" =~ ^[a-z0-9.-]+\.tgz$ ]]; then
              echo "::error::$name: unexpected tarball file name '$file'"
              exit 1
            fi
            actual="sha512-$(openssl dgst -sha512 -binary "$file" | base64 -w0)"
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::$name: integrity mismatch for $file"
              exit 1
            fi
          done
          echo "DIST_TAG=$DIST_TAG" >> "$GITHUB_ENV"

      - name: Publish
        working-directory: dist-npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          # Manifest is in topological order, so dependencies publish first.
          # A version already on npm is skipped only when it is this exact tarball, so
          # re-running the failed job after a partial publish is safe, and a second build
          # never lands under a version that an earlier build already holds.
          jq -c '.packages[]' publish-manifest.json | while read -r pkg; do
            name=$(jq -r .name <<<"$pkg")
            version=$(jq -r .version <<<"$pkg")
            file=$(jq -r .file <<<"$pkg")
            expected=$(jq -r .integrity <<<"$pkg")
            if published=$(npm view "$name@$version" dist.integrity 2>/dev/null) && [[ -n "$published" ]]; then
              if [[ "$published" != "$expected" ]]; then
                echo "::error::$name@$version is already on npm from a different build"
                exit 1
              fi
              echo "$name@$version already on npm, skipping"
              continue
            fi
            npm publish "./$file" --tag "$DIST_TAG" --access public --provenance --ignore-scripts
          done

      - name: Summary
        working-directory: dist-npm
        run: |
          {
            echo "## Published to npm (\`$DIST_TAG\`)"
            echo ""
            echo "**Dist tag:** \`$DIST_TAG\`"
            echo ""
            echo "### Packages"
            jq -r '.packages[] | "- `\(.name)@\(.version)`"' publish-manifest.json
            echo ""
            echo "### Install"
            echo '```bash'
            echo "npm install aws-cdk-blocks@$DIST_TAG"
            echo '```'
            echo ""
            echo "### Create App"
            echo '```bash'
            echo "npm create @aws-cdk-blocks/blocks-app@$DIST_TAG -- --template demo"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
