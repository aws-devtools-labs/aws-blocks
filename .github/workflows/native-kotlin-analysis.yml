name: Native Kotlin Analysis

# Jobs check out the PR's merge commit (actions/checkout's default), the
# commit GitHub reads this file from, so a step added on main finds its script
# even when the PR branch predates it.

on:
  pull_request:
    paths:
      - 'native/kotlin/**'
      - 'native/codegen-fixtures/**'
      - '.github/workflows/native-kotlin-analysis.yml'
  workflow_dispatch:

concurrency:
  group: native-kotlin-analysis-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version-sync:
    name: Kotlin version is in sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      # Keep the generated runtime version aligned with package.json, the changesets source of truth.
      # Runtime tests exercise the generateVersion task's token-semver validation.
      - name: Check gradle.properties version matches package.json
        working-directory: native/kotlin
        run: scripts/sync-version.sh --check

      # compile-fixture-goldens.test.sh and regenerate-fixtures.test.sh need a JDK and Gradle;
      # the fixture-goldens job runs them.
      - name: Test the Kotlin scripts
        run: |
          for test in native/kotlin/scripts/*.test.sh; do
            case "$(basename "$test")" in compile-fixture-goldens.test.sh | regenerate-fixtures.test.sh) continue ;; esac
            echo "== $test =="
            bash "$test"
          done

  # The golden-file tests (`:codegen:test`) only compare text, so a golden that doesn't
  # compile passes them. This compiles each fixture's Kotlin golden, on its own, against
  # the in-repo runtime (JVM).
  fixture-goldens:
    name: Fixture goldens compile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Test the fixture-goldens script
        run: bash native/kotlin/scripts/compile-fixture-goldens.test.sh

      # A regenerate (the Kotlin step of regenerate-all.sh) must always run the generator.
      - name: Test that the fixture regenerate always runs
        run: bash native/kotlin/scripts/regenerate-fixtures.test.sh

      - name: Compile every fixture's Kotlin golden (fails on errors)
        run: bash native/kotlin/scripts/compile-fixture-goldens.sh

      # Text comparison can't show that a serializer reads the wire format: these decode and
      # encode real wire JSON through the goldens of the fixtures with `round-trips/` tests.
      - name: Round-trip wire JSON through the fixture goldens (JVM)
        working-directory: native/kotlin
        run: ./gradlew :fixture-goldens:roundTripFixtureGoldens

  build-and-test:
    name: Build & Test (runtime, codegen)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: native/kotlin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Run runtime unit tests (JVM)
        run: ./gradlew :runtime:jvmTest

      # Version.kt is a generated commonMain source, so also cover Android host
      # and common-metadata compile; iOS runs in the macOS job below.
      - name: Run runtime unit tests (Android host)
        run: ./gradlew :runtime:testAndroidHostTest

      - name: Compile common metadata
        run: ./gradlew :runtime:compileCommonMainKotlinMetadata

      - name: Run codegen unit tests
        run: ./gradlew :codegen:test

      # The plugin module owns the Gradle task and extension that carry codegen's inputs;
      # :codegen:test does not reach them. `check` adds validatePlugins, the only gate that
      # fails on a task input missing its annotation.
      - name: Run plugin checks
        run: ./gradlew :plugin:check

  windows-test:
    name: Build & Test (runtime, Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: native/kotlin
        # `gradlew` is a shell script and the Windows runner defaults to pwsh.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # The only runner where the Windows key custody executes. Elsewhere it compiles but
      # its tests return early, and tier selection resolves away from it, so without this
      # job that code would ship having never run.
      - name: Run runtime unit tests (JVM)
        run: ./gradlew :runtime:jvmTest

  linux-keyring-test:
    name: Build & Test (runtime, Linux keyring, ${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    defaults:
      run:
        working-directory: native/kotlin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # libsecret is not preinstalled on the runners, and the key custody needs a keyring daemon
      # serving org.freedesktop.secrets to talk to.
      - name: Install libsecret and a keyring daemon
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsecret-1-0 gnome-keyring dbus-x11

      # Both architectures, because the variadic calling convention is the risk this proves.
      #
      # Gradle runs inside the dbus-run-session block, after the unlock: a second session gets a
      # fresh bus and an empty keyring. --no-daemon matters for the same reason — a daemon started
      # outside the block has no DBUS_SESSION_BUS_ADDRESS to hand the test JVM, and every libsecret
      # call then fails. -i makes Gradle forward test output to this log.
      - name: Run runtime unit tests under an unlocked keyring
        env:
          BLOCKS_EXPECT_OS_KEY_TIER: "1"
        run: |
          dbus-run-session -- bash -c '
            echo -n "ci-keyring" | gnome-keyring-daemon --unlock --components=secrets
            ./gradlew --no-daemon :runtime:jvmTest -i
          '

      # A green suite alone does not show the keyring was reached: these tests return early off
      # Linux rather than failing, and an early return is indistinguishable from a pass in Gradle's
      # output. The times tell them apart — an early return is ~0ms, a real libsecret round trip
      # tens of milliseconds — so print them, and keep this job self-evidencing.
      - name: Report per-test times for the key custody suites
        if: always()
        run: |
          python3 -I - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for path in sorted(glob.glob('runtime/build/test-results/jvmTest/*.xml')):
              suite = ET.parse(path).getroot()
              name = suite.get('name', '')
              if 'KeyCustody' not in name:
                  continue
              print(name)
              for case in suite.iter('testcase'):
                  millis = float(case.get('time', 0)) * 1000
                  print(f'  {millis:9.1f} ms  {case.get("name")}')
          PY

  ios-test:
    name: Build & Test (runtime, iOS)
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: native/kotlin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # Runs VersionTest on the iOS simulator, proving the generated commonMain
      # constant is wired into the Kotlin/Native iOS target.
      - name: Run runtime unit tests (iOS simulator)
        run: ./gradlew :runtime:iosSimulatorArm64Test
