name: Native Kotlin Analysis

on:
  pull_request:
    paths:
      - 'native/kotlin/**'
      - '.github/workflows/native-kotlin-analysis.yml'
  workflow_dispatch:

concurrency:
  group: native-kotlin-analysis-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version-sync:
    name: Kotlin version is in sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      # Keep the generated runtime version aligned with package.json, the changesets source of truth.
      # Runtime tests exercise the generateVersion task's token-semver validation.
      - name: Check gradle.properties version matches package.json
        working-directory: native/kotlin
        run: scripts/sync-version.sh --check

      - name: Test the Kotlin scripts
        run: |
          for test in native/kotlin/scripts/*.test.sh; do
            echo "== $test =="
            bash "$test"
          done

  build-and-test:
    name: Build & Test (runtime, codegen)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: native/kotlin
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Run runtime unit tests (JVM)
        run: ./gradlew :runtime:jvmTest

      # Version.kt is a generated commonMain source, so also cover Android host
      # and common-metadata compile; iOS runs in the macOS job below.
      - name: Run runtime unit tests (Android host)
        run: ./gradlew :runtime:testAndroidHostTest

      - name: Compile common metadata
        run: ./gradlew :runtime:compileCommonMainKotlinMetadata

      - name: Run codegen unit tests
        run: ./gradlew :codegen:test

  ios-test:
    name: Build & Test (runtime, iOS)
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: native/kotlin
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # Runs VersionTest on the iOS simulator, proving the generated commonMain
      # constant is wired into the Kotlin/Native iOS target.
      - name: Run runtime unit tests (iOS simulator)
        run: ./gradlew :runtime:iosSimulatorArm64Test
