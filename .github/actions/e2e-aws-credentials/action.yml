name: E2E AWS credentials
description: >-
  Assumes the E2E role of one pool account. Picks the role ARN from the
  AWS_ROLE_ARNS secret by index (see .github/actions/e2e-slot) and masks it,
  because a value taken out of a JSON secret is not redacted on its own.
  The session carries the inline session policy in session-policy.json, which
  can only narrow what the role allows (see the comment on the pick step).
inputs:
  role-arns:
    description: The AWS_ROLE_ARNS secret, a JSON array of role ARNs (account 1 first)
    required: true
  index:
    description: 0-based account index, from .github/actions/e2e-slot
    required: false
    default: '0'
  accounts:
    description: When set, fail unless AWS_ROLE_ARNS has exactly this many entries
    required: false
    default: ''
runs:
  using: composite
  steps:
    - id: pick
      shell: bash
      env:
        ROLE_ARNS: ${{ inputs.role-arns }}
        INDEX: ${{ inputs.index }}
        ACCOUNTS: ${{ inputs.accounts }}
        POLICY_FILE: ${{ github.action_path }}/session-policy.json
      # The session policy keeps everything the E2E jobs do (CDK deploys through
      # the bootstrap roles, the tests' and sweeps' direct calls to many services,
      # and CloudFormation deletes that run with the caller's credentials) but
      # takes out of the session's own calls: role assumption other than into the
      # CDK bootstrap roles of this account, IAM users, groups, access keys and
      # other long-lived credentials, identity providers, account, billing and
      # Organizations changes, turning off CloudTrail or AWS Config recording,
      # and changes to the bootstrap roles or to the E2E role itself. This step
      # pins the bootstrap roles to the selected role's account and adds the E2E
      # role ARN to that last Deny.
      #
      # It limits only what the session does with its own credentials; it is not
      # the account's boundary. A session policy doesn't carry over to a role the
      # session assumes or passes: the bootstrap roles (and the CloudFormation
      # execution role they deploy through) and any role the session can pass to
      # a service, such as a Lambda function or a stack, keep their full
      # permissions, including the IAM calls left out here.
      # Tests: scripts/ci/workflow-secrets.test.mjs.
      run: |
        if ! jq -e 'type == "array"' > /dev/null 2>&1 <<< "$ROLE_ARNS"; then
          echo "::error::AWS_ROLE_ARNS is missing or not a JSON array of role ARNs."
          exit 1
        fi
        count=$(jq 'length' <<< "$ROLE_ARNS")
        if [ -n "$ACCOUNTS" ] && [ "$count" != "$ACCOUNTS" ]; then
          echo "::error::AWS_ROLE_ARNS has $count entries, but .github/actions/e2e-slot counts $ACCOUNTS E2E accounts."
          exit 1
        fi
        arn=$(jq -r --argjson i "$INDEX" '.[$i] // empty' <<< "$ROLE_ARNS")
        if [ -z "$arn" ]; then
          echo "::error::AWS_ROLE_ARNS has $count entries, so there is no E2E account $((INDEX + 1))."
          exit 1
        fi
        echo "::add-mask::$arn"
        # The account field of arn:aws:iam::<account>:role/<name>.
        account=$(cut -s -d: -f5 <<< "$arn")
        if ! [[ "$account" =~ ^[0-9]{12}$ ]]; then
          echo "::error::E2E account $((INDEX + 1)) in AWS_ROLE_ARNS is not a role ARN with an account ID."
          exit 1
        fi
        # The policy pins role assumption to this account, and the step's
        # inputs are printed in the log.
        echo "::add-mask::$account"
        echo "role-arn=$arn" >> "$GITHUB_OUTPUT"
        policy=$(jq -c --arg role "$arn" --arg account "$account" '
          (.Statement[] | select(.Sid == "AssumeCdkBootstrapRoles") | .Resource) |= sub("::\\*:"; "::\($account):")
          | (.Statement[] | select(.Sid == "KeepBootstrapAndE2ERoles") | .Resource) += [$role]' "$POLICY_FILE")
        # STS rejects a session policy longer than 2048 characters.
        if [ "${#policy}" -gt 2048 ]; then
          echo "::error::The E2E session policy is ${#policy} characters; STS allows at most 2048."
          exit 1
        fi
        echo "session-policy=$policy" >> "$GITHUB_OUTPUT"

    - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: ${{ steps.pick.outputs.role-arn }}
        aws-region: us-east-1
        inline-session-policy: ${{ steps.pick.outputs.session-policy }}
