# Dependabot configuration.
#
# Scope note: every published package lives under packages/* and every test app
# under test-apps/* is installed from the single root package-lock.json (npm
# workspaces). One npm entry rooted at "/" therefore covers the whole workspace;
# there is no per-package or per-test-app lockfile to configure separately.
# The create-blocks-app templates are the exception: each has its own
# package.json and no lockfile, so they get a second npm entry.
# scripts/ci/agent-bench-playwright is another exception: it has a lockfile on
# purpose and no entry here, because it pins the agent bench's Playwright to
# PW_VERSION (scripts/agent-bench/steps/3-build-and-test.sh) and is bumped with
# it. A security PR for it fails scripts/ci/agent-bench-playwright.test.mjs
# until PW_VERSION moves too.
#
# What this file controls: it does NOT generate or clear Dependabot *alerts*
# (those come from the dependency graph). It configures the *pull requests*
# Dependabot opens:
#   - npm version-update PRs run weekly, Monday 06:00 Europe/Berlin, so they
#     are waiting at the start of the working week.
#   - Three groups: aws-sdk (@aws-sdk/*, @smithy/*), which release in lockstep;
#     dev-dependencies (build/test only, low blast radius); and
#     production-dependencies, minor and patch only, so a weekly run opens a
#     few PRs rather than one per package. Production majors (only on runs
#     where that group has no open PR, dependabot/dependabot-core#14202)
#     and security fixes land as their own PRs so each shipped bump stays
#     reviewable and mergeable on its own.
#   - typescript and @types/node are toolchain foundations: a major bump is a
#     deliberate migration, not routine hygiene (TS 7 / @types/node 26 broke the
#     project-reference build in one grouped PR). So they are excluded from the
#     dev-dependencies group (minor/patch arrive as their own PRs) and their
#     major-version updates are ignored (bump them intentionally, by hand).
#   - The dev-dependencies group takes minor and patch updates only. A major
#     bump of a dev dependency (a framework in a test app, a test runner) can
#     need code or config changes, and one grouped PR with many of them can't
#     land. Majors are raised as their own PRs, but only on runs where this
#     group has no open PR (dependabot/dependabot-core#14202). Check
#     `npm outdated` (root and workspaces) for dev majors before each release.
#     Majors of vite, @vitejs/* and @sveltejs/* are ignored: they move together
#     with TypeScript 6 as one migration (issue #984).
#   - Cooldown: version updates wait until a release is 3 days old. This is
#     Dependabot's default; it is set explicitly so it can't silently change
#     and nobody lowers it by accident. Security updates are not delayed.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Europe/Berlin"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    ignore:
      # SvelteKit 3 and the Vite 8 plugins peer-depend on Vite 8, and SvelteKit
      # 3 on TypeScript 6, so single major PRs can't resolve: a deliberate
      # migration (issue #984).
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@sveltejs/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      aws-sdk:
        patterns:
          - "@aws-sdk/*"
          - "@smithy/*"
      dev-dependencies:
        dependency-type: development
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "typescript"
          - "@types/node"
          # A group without patterns takes every match; keep the SDK together.
          - "@aws-sdk/*"
          - "@smithy/*"
      production-dependencies:
        dependency-type: production
        update-types:
          - "minor"
          - "patch"
        # As above: the SDK stays in the aws-sdk group.
        exclude-patterns:
          - "@aws-sdk/*"
          - "@smithy/*"

  # create-blocks-app templates. No lockfile: Dependabot updates the ranges in
  # each template's package.json, which is what scaffolded apps install from.
  # Minor and patch only, as the ncu job does (--target minor), in one grouped
  # PR for all templates. A major is a deliberate migration; the "*"
  # semver-major ignore below keeps majors out. The group must not set
  # update-types: without a lockfile a range such as ^6.4.4 has no current
  # version, so that filter can't classify the update and Dependabot opens it
  # as its own PR, one per template. Ignore rules instead take the first x.y.z
  # in the range, so keep each template range a single ^x.y.z, ~x.y.z or
  # exact x.y.z (not ^6, 6.x or >=5 <6.0.0).
  - package-ecosystem: npm
    directories:
      - /packages/create-blocks-app/templates/*
      # amplify's top-level package.json is an overlay with no dependencies and
      # no workspaces; its dependencies live one level down.
      - /packages/create-blocks-app/templates/amplify/aws-blocks
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Europe/Berlin"
    cooldown:
      default-days: 3
    versioning-strategy: increase
    ignore:
      # Published from this repo; the templates track them with "*".
      - dependency-name: "@aws-blocks/*"
      # Minor and patch only: template majors move by hand.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Named so the reason survives if the "*" rule goes: Vite 8 hard-depends
      # on lightningcss (MPL-2.0), which the licence check can't see without a
      # lockfile, and it would ship in every scaffolded app (issue #984).
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      # @vitejs/plugin-react 6 requires Vite 8 (issue #984).
      - dependency-name: "@vitejs/*"
        update-types: ["version-update:semver-major"]
      # Toolchain foundations, as in the root entry.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      templates:
        patterns:
          - "*"

  # Keep the GitHub Actions used by CI patched. Low volume, batch into one PR.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns:
          - "*"
