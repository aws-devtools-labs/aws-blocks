# Temporary exclusions from license checking.
#
# GitHub's dependency graph reports Pub (Dart/Flutter) package licenses in
# lowercase (e.g. "bsd-3-clause", sourced from pub.dev's pana tags), which the
# dependency-review-action's case-sensitive SPDX parser rejects as invalid —
# it fails the check before the allowlist above is even consulted.
#
# flutter_secure_storage is verifiably BSD-3-Clause:
# https://pub.dev/packages/flutter_secure_storage/license
#
# Remove once the upstream parser normalizes license casing:
# https://github.com/actions/dependency-review-action
allow_dependencies_licenses:
  - "pkg:pub/flutter_secure_storage"

# Advisories skipped during the vulnerability check.
#
# These three brace-expansion DoS advisories are flagged against a copy that is
# BUNDLED inside aws-cdk-lib's published tarball (its vendored `minimatch`), at
# node_modules/aws-cdk-lib/node_modules/brace-expansion with "inBundle": true.
# A bundled dependency is physically shipped inside the parent package, so it is
# NOT part of the resolvable dependency graph — our root
# `overrides: { "brace-expansion": "5.0.12" }` cannot rewrite it, and neither can
# `npm audit fix`. Only AWS refreshing the bundle in a future aws-cdk-lib release
# resolves it. Tracked upstream at https://github.com/aws/aws-cdk/issues/37133.
# AWS frames these as build/deploy-time only (not in any runtime/release
# artifact), and the DoS requires untrusted glob input, which CDK synth does not
# take — so the real-world impact is negligible.
#
# IMPORTANT — why this is NOT a blanket hole: allow_ghsas matches by advisory ID
# globally, but every NON-bundled brace-expansion in the tree is forced to the
# patched 5.0.12 by the root `overrides` pin (verified: the only vulnerable copy
# left is the bundled cdk one). So in practice this only ever waves through the
# single un-fixable bundled copy. If the `overrides` pin is ever removed, a
# vulnerable non-bundled copy could reappear and this exemption would hide it —
# so KEEP the brace-expansion override whenever this block exists.
#
# Remove this block once aws-cdk-lib bundles brace-expansion >= 5.0.12.
allow_ghsas:
  - "GHSA-6j4f-fj2g-mc7p" # brace-expansion DoS (parseCommaParts), patched 5.0.10
  - "GHSA-qhr7-859c-m2p7" # brace-expansion DoS (nested brace groups), patched 5.0.11
  - "GHSA-q2hr-2g5m-vwhr" # brace-expansion quadratic expansion DoS, patched 5.0.12
