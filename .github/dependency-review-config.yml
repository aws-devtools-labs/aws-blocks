# Temporary exclusions from license checking.
#
# GitHub's dependency graph reports Pub (Dart/Flutter) package licenses in
# lowercase (e.g. "bsd-3-clause", sourced from pub.dev's pana tags), which the
# dependency-review-action's case-sensitive SPDX parser rejects as invalid —
# it fails the check before the allowlist above is even consulted.
#
# flutter_secure_storage is verifiably BSD-3-Clause:
# https://pub.dev/packages/flutter_secure_storage/license
#
# Remove once the upstream parser normalizes license casing:
# https://github.com/actions/dependency-review-action
allow_dependencies_licenses:
  - "pkg:pub/flutter_secure_storage"

  # sharp's prebuilt libvips binaries (LGPL-3.0-or-later). They reach the
  # lockfile only through the hosting test apps (next in test-apps/hosting-ssr,
  # astro in test-apps/hosting-ssr-astro*); no published package depends on
  # them, and libvips is dynamically linked, not copied into our code.
  # Without these entries, every sharp version bump fails the check.
  # Same exception as aws-amplify/amplify-js:
  # https://github.com/aws-amplify/amplify-js/blob/main/.github/dependency-review/dependency-review-config.yml
  - "pkg:npm/%40img/sharp-libvips-darwin-arm64"
  - "pkg:npm/%40img/sharp-libvips-darwin-x64"
  - "pkg:npm/%40img/sharp-libvips-linux-arm"
  - "pkg:npm/%40img/sharp-libvips-linux-arm64"
  - "pkg:npm/%40img/sharp-libvips-linux-ppc64"
  - "pkg:npm/%40img/sharp-libvips-linux-riscv64"
  - "pkg:npm/%40img/sharp-libvips-linux-s390x"
  - "pkg:npm/%40img/sharp-libvips-linux-x64"
  - "pkg:npm/%40img/sharp-libvips-linuxmusl-arm64"
  - "pkg:npm/%40img/sharp-libvips-linuxmusl-x64"
  - "pkg:npm/%40img/sharp-wasm32"
  - "pkg:npm/%40img/sharp-win32-arm64"
  - "pkg:npm/%40img/sharp-win32-ia32"
  - "pkg:npm/%40img/sharp-win32-x64"

# Advisory IDs skipped during the vulnerability check. Add a one-line reason
# per entry (or per contiguous group) explaining why it's exempt and when to
# drop it — keep it short.
allow_ghsas:
  # nuxt — the ONE internal e2e test app (test-apps/hosting-ssr-nuxt) is pinned
  # <4.5.0, which is the vulnerable range for these (all patched in 4.5.1). We
  # hold the pin because 4.5 pulls lightningcss (MPL-2.0); unpinning to the
  # patched 4.5.1 is blocked on confirming MPL-2.0 deps are allowed. Not in any
  # template or published package. Drop these (and the pin) once MPL-2.0 is
  # approved and nuxt can move to >= 4.5.1.
  - "GHSA-9473-5f9j-94wq" # Nuxt server island RCE (template injection), patched 4.5.1
  - "GHSA-hxcr-hm88-mpq6" # Nuxt island v-for OOM DoS, patched 4.5.1
  - "GHSA-9pgf-384g-p7mv" # Nuxt island body CPU-exhaustion DoS, patched 4.5.1
  - "GHSA-48hr-524c-v5w3" # Nuxt unauthorized component instantiation, patched 4.5.1
