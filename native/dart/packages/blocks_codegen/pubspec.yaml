name: blocks_codegen
description: Code generator for AWS CDK Blocks client SDK — reads OpenRPC spec and generates typed Dart clients.
version: 1.0.0
homepage: https://docs.aws.amazon.com/blocks/latest/devguide
repository: https://github.com/aws-devtools-labs/aws-blocks
issue_tracker: https://github.com/aws-devtools-labs/aws-blocks/issues

environment:
  sdk: ^3.11.0

dependencies:
  args: ^2.4.0
  # build_runner 2.17.1 requires build 5, while mockito and other builders
  # still pin build <5. build 5.0.0 only breaks BuildStep implementers;
  # this package extends Builder, which is unchanged.
  build: '>=4.0.0 <6.0.0'
  # Generated clients need blocks_runtime 1.0.0 (`minimumRuntimeVersion` in
  # lib/src/generator.dart); test/generator_test.dart checks the two agree.
  blocks_runtime: ^1.0.0

dev_dependencies:
  # build_runner 2.16.2 is the first release that compiles against analyzer
  # 14.5.0, which removed a setter earlier build_runner versions used.
  build_runner: ^2.16.2
  lints: ^6.0.0
  test: ^1.25.0
