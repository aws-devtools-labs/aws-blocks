name: blocks_runtime_flutter
description: Flutter-specific implementations for blocks_runtime (secure storage, OAuth browser flow)
version: 0.1.2
homepage: https://docs.aws.amazon.com/blocks/latest/devguide
repository: https://github.com/aws-devtools-labs/aws-blocks
issue_tracker: https://github.com/aws-devtools-labs/aws-blocks/issues

environment:
  sdk: ^3.11.0
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter
  blocks_runtime: ^0.1.2
  flutter_secure_storage: ^11.0.0
  url_launcher: ^6.2.0
  app_links: ^7.0.0

# Floors stay low on purpose: build_runner 2.15.2+ and mockito 5.8.0+ need
# analyzer 13.3+, hence meta 1.18.3+, which only Flutter 3.47+ pins. Don't raise.
dev_dependencies:
  build_runner: ^2.14.0
  flutter_test:
    sdk: flutter
  lints: ^6.0.0
  mockito: ^5.6.0
