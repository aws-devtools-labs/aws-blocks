name: blocks_runtime_flutter
description: Flutter-specific implementations for blocks_runtime (secure storage, OAuth browser flow)
version: 0.1.4
homepage: https://docs.aws.amazon.com/blocks/latest/devguide
repository: https://github.com/aws-devtools-labs/aws-blocks
issue_tracker: https://github.com/aws-devtools-labs/aws-blocks/issues

environment:
  sdk: ^3.11.0
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter
  blocks_runtime: ^0.1.4
  flutter_secure_storage: ^11.1.0
  url_launcher: ^6.2.0
  app_links: ^7.0.0

dev_dependencies:
  # analyzer 14.5.0 (2026-10-06) removed a setter build_runner 2.16.1 still uses, so
  # `dart run build_runner build` fails to compile. Drop this cap once build_runner ships a fix.
  analyzer: '<14.5.0'
  build_runner: ^2.14.0
  flutter_test:
    sdk: flutter
  lints: ^6.0.0
  mockito: ^5.6.0
