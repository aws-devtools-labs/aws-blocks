name: blocks_runtime_flutter
description: Flutter-specific implementations for blocks_runtime (secure storage, OAuth browser flow)
version: 0.1.4
homepage: https://docs.aws.amazon.com/blocks/latest/devguide
repository: https://github.com/aws-devtools-labs/aws-blocks
issue_tracker: https://github.com/aws-devtools-labs/aws-blocks/issues

environment:
  sdk: ^3.11.0
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter
  blocks_runtime: ^0.1.4
  flutter_secure_storage: ^11.1.0
  url_launcher: ^6.2.0
  app_links: ^7.0.0

dev_dependencies:
  # Not ^2.16.2 like the sibling packages: Flutter 3.41 pins meta 1.17.0, which
  # admits analyzer 10.0.1 at most and so build_runner 2.15.1 at most. Newer
  # Flutter admits analyzer 14.5 or later, and pub then resolves build_runner
  # 2.16.2 or later, which compiles against it. ^2.14.0 admits both, so no cap
  # is needed.
  build_runner: ^2.14.0
  flutter_test:
    sdk: flutter
  lints: ^6.0.0
  mockito: ^5.6.0
