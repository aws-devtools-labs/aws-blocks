name: blocks_runtime
description: Runtime library for AWS CDK Blocks client SDK — JSON-RPC 2.0 HTTP client, WebSocket realtime, and file transferables.
version: 1.0.0
homepage: https://docs.aws.amazon.com/blocks/latest/devguide
repository: https://github.com/aws-devtools-labs/aws-blocks
issue_tracker: https://github.com/aws-devtools-labs/aws-blocks/issues

environment:
  sdk: ^3.11.0

dependencies:
  crypto: ^3.0.0
  http: ^1.5.0
  web_socket_channel: ^3.0.0

dev_dependencies:
  # build_runner 2.16.2 is the first release that compiles against analyzer
  # 14.5.0, which removed a setter earlier build_runner versions used.
  build_runner: ^2.16.2
  build_version: ^2.1.1
  fake_async: ^1.3.0
  lints: ^6.0.0
  stream_channel: ^2.1.0
  test: ^1.25.0
