<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blocks App</title>
  <style>
    body { font-family: var(--bb-font-family, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif); max-width: 860px; margin: 40px auto; padding: 20px; background: var(--bb-color-bg, #fff); color: var(--bb-color-text, #333); }
    h1 { margin-bottom: 4px; }
    .intro { color: var(--bb-color-text-muted, #666); font-size: 0.9em; margin-bottom: 24px; line-height: 1.5; }
    .intro strong { color: var(--bb-color-text, #444); }
    input, textarea, select { padding: var(--bb-space-2, 8px) var(--bb-space-3, 12px); margin: var(--bb-space-1, 4px); border: 1px solid var(--bb-color-border, #ddd); border-radius: var(--bb-radius-sm, 4px); font-size: 0.95em; font-family: inherit; color: var(--bb-color-text, #333); background: var(--bb-color-surface, #fff); }
    input[type="text"], input[type="email"], input[type="password"] { min-width: 220px; }
    input:focus, textarea:focus, select:focus { outline: none; border-color: var(--bb-color-accent, #0972d3); box-shadow: 0 0 0 2px var(--bb-color-focus-ring, #0972d3); }
    button { padding: var(--bb-space-2, 8px) var(--bb-space-4, 16px); margin: var(--bb-space-1, 4px); cursor: pointer; border: 1px solid var(--bb-color-border, #ddd); border-radius: var(--bb-radius-sm, 4px); background: var(--bb-color-surface, #f8f8f8); color: var(--bb-color-text, #333); font-size: 0.95em; font-family: inherit; }
    button:hover { border-color: var(--bb-color-accent, #0972d3); }
    ul { padding: 0; }
    li { list-style: none; }
  </style>
</head>
<body>
  <div id="menu-bar"></div>
  <h1>Blocks App</h1>
  <p class="intro">
    This starter app demonstrates:
    <strong>authentication</strong> with cross-tab coordination,
    <strong>real-time sync</strong> across browser tabs,
    and <strong>todos stored in a distributed table</strong> with per-user isolation.
  </p>
  <div id="auth"></div>
  <div id="app"></div>
  <script type="module" src="/src/index.ts"></script>
</body>
</html>
