<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blocks App</title>
    <style>
      body { font-family: var(--bb-font-family, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif); max-width: 860px; margin: 40px auto; padding: 20px; background: var(--bb-color-bg, #fff); color: var(--bb-color-text, #333); }
      input, select { padding: var(--bb-space-2, 8px) var(--bb-space-3, 12px); margin: var(--bb-space-1, 4px); border: 1px solid var(--bb-color-border, #ddd); border-radius: var(--bb-radius-sm, 4px); font-size: 0.95em; font-family: inherit; color: var(--bb-color-text, #333); background: var(--bb-color-surface, #fff); }
      input:focus, select:focus { border-color: var(--bb-color-accent, #0972d3); outline: 2px solid var(--bb-color-focus-ring, #0972d3); outline-offset: 1px; }
      button { padding: var(--bb-space-2, 8px) var(--bb-space-4, 16px); margin: var(--bb-space-1, 4px); cursor: pointer; border: 1px solid var(--bb-color-border, #ddd); border-radius: var(--bb-radius-sm, 4px); background: var(--bb-color-surface, #f8f8f8); color: var(--bb-color-text, #333); font-size: 0.95em; font-family: inherit; }
      button:hover { border-color: var(--bb-color-accent, #0972d3); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
