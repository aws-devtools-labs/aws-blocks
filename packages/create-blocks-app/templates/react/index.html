<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blocks App</title>
    <!-- First-paint tokens only. The authoritative token layer (incl. the
         .bb-* component classes) is @aws-blocks/auth-common's THEME_CSS,
         injected by the components at runtime; this inline copy exists so a
         dark-mode user's first paint already uses the dark palette instead of
         flashing white until the deferred module bundle runs. -->
    <style>
      :root {
        color-scheme: light dark;
        --bb-color-bg: #ffffff; --bb-color-surface: #ffffff; --bb-color-surface-alt: #f4f6f9;
        --bb-color-text: #16191f; --bb-color-text-muted: #5f6b7a; --bb-color-border: #d5dbdb;
        --bb-color-accent: #0972d3; --bb-color-success: #037f0c; --bb-color-danger: #d91515;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-bb-theme="light"]) {
          color-scheme: dark;
          --bb-color-bg: #0f1b2a; --bb-color-surface: #1a2634; --bb-color-surface-alt: #232f3e;
          --bb-color-text: #e9ebed; --bb-color-text-muted: #a9b4c0; --bb-color-border: #3b4858;
          --bb-color-accent: #539fe5; --bb-color-success: #29ad32; --bb-color-danger: #ff7170;
        }
      }
    </style>
    <style>
      body { font-family: var(--bb-font-family, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif); max-width: 860px; margin: 40px auto; padding: 20px; background: var(--bb-color-bg, #fff); color: var(--bb-color-text, #333); }
      input, select { padding: var(--bb-space-2, 8px) var(--bb-space-3, 12px); margin: var(--bb-space-1, 4px); border: 1px solid var(--bb-color-border, #ddd); border-radius: var(--bb-radius-sm, 4px); font-size: 0.95em; font-family: inherit; color: var(--bb-color-text, #333); background: var(--bb-color-surface, #fff); }
      input:focus, select:focus { border-color: var(--bb-color-accent, #0972d3); outline: 2px solid var(--bb-color-focus-ring, #0972d3); outline-offset: 1px; }
      button { padding: var(--bb-space-2, 8px) var(--bb-space-4, 16px); margin: var(--bb-space-1, 4px); cursor: pointer; border: 1px solid var(--bb-color-border, #ddd); border-radius: var(--bb-radius-sm, 4px); background: var(--bb-color-surface, #f8f8f8); color: var(--bb-color-text, #333); font-size: 0.95em; font-family: inherit; }
      button:hover { border-color: var(--bb-color-accent, #0972d3); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
