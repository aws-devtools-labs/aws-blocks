<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AWS Blocks Agent</title>
  <!-- First-paint tokens only. The authoritative token layer (incl. the
       .bb-* component classes) is @aws-blocks/auth-common's THEME_CSS,
       injected by the components at runtime; this inline copy exists so a
       dark-mode user's first paint already uses the dark palette instead of
       flashing white until the deferred module bundle runs. -->
  <style>
    :root {
      color-scheme: light dark;
      --bb-color-bg: #ffffff; --bb-color-surface: #ffffff; --bb-color-surface-alt: #f4f6f9;
      --bb-color-text: #16191f; --bb-color-text-muted: #5f6b7a; --bb-color-border: #d5dbdb;
      --bb-color-accent: #0972d3; --bb-color-success: #037f0c; --bb-color-danger: #d91515;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-bb-theme="light"]) {
        color-scheme: dark;
        --bb-color-bg: #0f1b2a; --bb-color-surface: #1a2634; --bb-color-surface-alt: #232f3e;
        --bb-color-text: #e9ebed; --bb-color-text-muted: #a9b4c0; --bb-color-border: #3b4858;
        --bb-color-accent: #539fe5; --bb-color-success: #29ad32; --bb-color-danger: #ff7170;
      }
    }
  </style>
  <style>
    body { font-family: var(--bb-font-family, sans-serif); max-width: 800px; margin: 50px auto; padding: 20px; background: var(--bb-color-bg, #fff); color: var(--bb-color-text, #333); }
    .section { margin: 30px 0; padding: 20px; border: 1px solid var(--bb-color-border, #ddd); border-radius: var(--bb-radius-md, 8px); background: var(--bb-color-surface, #fff); }
    button { padding: var(--bb-space-2, 10px) var(--bb-space-4, 20px); margin: 5px; cursor: pointer; border: 1px solid var(--bb-color-border, #ddd); border-radius: var(--bb-radius-sm, 4px); background: var(--bb-color-surface, #f8f8f8); color: var(--bb-color-text, #333); font-family: inherit; }
    button:hover { border-color: var(--bb-color-accent, #0972d3); }
    input { padding: var(--bb-space-2, 8px); margin: 5px; border: 1px solid var(--bb-color-border, #ddd); border-radius: var(--bb-radius-sm, 4px); background: var(--bb-color-surface, #fff); color: var(--bb-color-text, #333); font-family: inherit; }
    #chat-log { margin-top: 10px; padding: 10px; background: var(--bb-color-surface-alt, #f5f5f5); border-radius: var(--bb-radius-sm, 4px); min-height: 60px; }
    #chat-log > div { margin: 6px 0; }
    #app[hidden] { display: none; }
  </style>
</head>
<body>
  <h1>AWS Blocks — AI Agent</h1>
  <p>Sign in, then chat with the agent. In <code>npm run dev</code> the agent uses the built-in <code>canned</code> provider — a deterministic fake model, no AWS or LLM. Ask it to "save a note" to see a tool call. Swap <code>model.local</code> in <code>aws-blocks/index.ts</code> for a real model.</p>

  <div class="section">
    <div id="auth-container"></div>
  </div>

  <div class="section" id="app" hidden>
    <h2>Chat</h2>
    <div style="display:flex;gap:4px;align-items:center">
      <input id="chat-input" placeholder="Say something, or ask it to save a note" style="flex:1" />
      <button id="chat-send">Send</button>
    </div>
    <div id="chat-log"></div>
  </div>

  <script type="module" src="/src/index.ts"></script>
</body>
</html>
