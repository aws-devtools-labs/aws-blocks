<!DOCTYPE html>
<html>
<head>
  <title>AWS Blocks Demo</title>
  <!-- First-paint tokens only. The authoritative token layer (incl. the
       .bb-* component classes) is @aws-blocks/auth-common's THEME_CSS,
       injected by the components at runtime; this inline copy exists so a
       dark-mode user's first paint already uses the dark palette instead of
       flashing white until the deferred module bundle runs. -->
  <style>
    :root {
      color-scheme: light dark;
      --bb-color-bg: #ffffff; --bb-color-surface: #ffffff; --bb-color-surface-alt: #f4f6f9;
      --bb-color-text: #16191f; --bb-color-text-muted: #5f6b7a; --bb-color-border: #d5dbdb;
      --bb-color-accent: #0972d3; --bb-color-success: #037f0c; --bb-color-danger: #d91515;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-bb-theme="light"]) {
        color-scheme: dark;
        --bb-color-bg: #0f1b2a; --bb-color-surface: #1a2634; --bb-color-surface-alt: #232f3e;
        --bb-color-text: #e9ebed; --bb-color-text-muted: #a9b4c0; --bb-color-border: #3b4858;
        --bb-color-accent: #539fe5; --bb-color-success: #29ad32; --bb-color-danger: #ff7170;
      }
    }
  </style>
  <style>
    body { font-family: var(--bb-font-family, sans-serif); max-width: 800px; margin: 50px auto; padding: 20px; background: var(--bb-color-bg, #fff); color: var(--bb-color-text, #333); }
    .section { margin: 30px 0; padding: 20px; border: 1px solid var(--bb-color-border, #ddd); border-radius: var(--bb-radius-md, 8px); background: var(--bb-color-surface, #fff); }
    button { padding: var(--bb-space-2, 10px) var(--bb-space-4, 20px); margin: 5px; cursor: pointer; border: 1px solid var(--bb-color-border, #ddd); border-radius: var(--bb-radius-sm, 4px); background: var(--bb-color-surface, #f8f8f8); color: var(--bb-color-text, #333); font-family: inherit; }
    button:hover { border-color: var(--bb-color-accent, #0972d3); }
    input, select { padding: var(--bb-space-2, 8px); margin: 5px; border: 1px solid var(--bb-color-border, #ddd); border-radius: var(--bb-radius-sm, 4px); background: var(--bb-color-surface, #fff); color: var(--bb-color-text, #333); font-family: inherit; }
    .result { margin-top: 10px; padding: 10px; background: var(--bb-color-surface-alt, #f5f5f5); border-radius: var(--bb-radius-sm, 4px); }
    .success { color: var(--bb-color-success, green); }
    .error { color: var(--bb-color-danger, red); }
    #auth-status { font-weight: bold; margin-bottom: 10px; }
    .todo-item { display: flex; align-items: center; gap: 10px; padding: 8px; border-bottom: 1px solid var(--bb-color-border, #eee); }
    .todo-item input[type="checkbox"] { cursor: pointer; }
    .todo-item .todo-title { flex: 1; border: none; background: transparent; font-size: inherit; padding: 4px; }
    .todo-item .todo-title:focus { outline: 1px solid var(--bb-color-accent, #4CAF50); background: var(--bb-color-surface-alt, #f9f9f9); }
    .todo-item select { padding: 4px; }
    .todo-item button { padding: 5px 10px; }
    #todo-input { flex: 1; }
    #todo-priority { padding: 8px; }
    .todo-add { display: flex; gap: 10px; margin-bottom: 15px; }
  </style>
</head>
<body>
  <h1>AWS Blocks Demo</h1>
  
  <div class="section">
    <h2>Authentication</h2>
    <div id="auth-status"></div>
    <div id="auth-container"></div>
    <p style="color: #666; font-size: 0.85em;">
      New accounts confirm their email with a 6-digit code. Locally no email is sent:
      the code is printed in the <code>npm run dev</code> terminal.
    </p>
  </div>
  
  <div class="section">
    <h2>Todo List</h2>
    <div class="todo-add">
      <input type="text" id="todo-input" placeholder="New todo..." onkeypress="if(event.key==='Enter') addTodo()">
      <select id="todo-priority">
        <option value="1">High</option>
        <option value="2" selected>Medium</option>
        <option value="3">Low</option>
      </select>
      <button onclick="addTodo()">Add</button>
    </div>
    <div style="margin-bottom: 10px;">
      <label>Sort by: </label>
      <select onchange="changeSort(this.value)">
        <option value="none">Todo ID</option>
        <option value="createdAt">Creation Time</option>
        <option value="priority">Priority</option>
        <option value="title">Title</option>
      </select>
    </div>
    <div id="todo-error" class="result"></div>
    <div id="todo-list"></div>
  </div>
  
  <div class="section">
    <h2>Cookie Test</h2>
    <input type="text" id="cookieName" placeholder="Cookie name" value="session">
    <input type="text" id="cookieValue" placeholder="Cookie value" value="abc123">
    <button onclick="testSetCookie()">Set Cookie</button>
    <button onclick="testGetCookie()">Get Cookie</button>
    <button onclick="testDeleteCookie()">Delete Cookie</button>
    <div id="cookie-result" class="result"></div>
  </div>
  
  <div class="section">
    <h2>KV Store Test</h2>
    <input type="text" id="key" placeholder="Key" value="test-key">
    <input type="text" id="value" placeholder="Value" value="test-value">
    <button onclick="testSetValue()">Set Value</button>
    <button onclick="testGetValue()">Get Value</button>
    <div id="kv-result" class="result"></div>
  </div>

  <div class="section">
    <h2>Test Results</h2>
    <button onclick="runAllTests()">Run All Tests</button>
    <div id="test-results" class="result"></div>
  </div>

  <script type="module" src="/src/index.ts"></script>
</body>
</html>
